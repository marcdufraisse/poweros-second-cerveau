<!doctype html>
<!--
  KEYNOTE MINIMAL · tier2 · lower-third · PLATE
  Floating bottom-left plate over talking-head video. Transparent stage; a
  near-black hairline plate holds a bold name over a quiet mono role line,
  with a single 3px accent tick marking the plate's left edge. Plate rises
  20px while a soft blur resolves to sharp; tick draws, then name, then role.
  Slots: name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      /* transparent stage — tier2 overlays float over live footage */
      #t2-lt-plate {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        font-family: var(--font-display); overflow: hidden;
      }

      #t2-lt-plate .plate {
        position: absolute; left: 100px; bottom: 100px; max-width: 640px;
        background: rgba(0, 0, 0, 0.74);
        border: var(--rule);
        border-radius: var(--radius-sm);
        padding: 30px 44px 30px 42px;
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.4);
      }

      #t2-lt-plate .tick {
        position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
        background: var(--accent);
      }

      #t2-lt-plate .name {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--text); line-height: 1.1;
      }

      #t2-lt-plate .role {
        margin-top: 10px;
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-label); letter-spacing: 0.02em;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-plate" data-composition-id="t2-lt-plate" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="tick"></div>
        <div class="name" data-slot="name">Marcus Webb</div>
        <div class="role" data-slot="role">Director of AI Curriculum, Acme</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-lt-plate";

      tl.from(root + " .plate", { autoAlpha: 0, y: 20, filter: "blur(10px)", duration: 1.1, ease: "expo.out" }, 0)
        .from(root + " .tick", { scaleY: 0, transformOrigin: "top", duration: 0.9, ease: "expo.out" }, 0.25)
        .from(root + " .name", { autoAlpha: 0, y: 16, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 0.35)
        .from(root + " .role", { autoAlpha: 0, y: 12, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, 0.55)

        .set({}, {}, 6);

      window.__timelines["t2-lt-plate"] = tl;
    </script>
  </body>
</html>
