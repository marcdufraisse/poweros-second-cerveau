<!doctype html>
<!--
  KEYNOTE MINIMAL · tier2 · list · HAIRLINE
  Floating bottom-left plate over talking-head video. Transparent stage; a
  near-black hairline plate holds a quiet mono title over three hairline-
  separated rows. The plate resolves first, then the title, then the three
  rows cascade in left-to-right with a soft blur resolve.
  Slots: title, i1, i2, i3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      /* transparent stage — tier2 overlays float over live footage */
      #t2-list-hairline {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        font-family: var(--font-display); overflow: hidden;
      }

      #t2-list-hairline .plate {
        position: absolute; left: 100px; bottom: 72px; width: 620px;
        background: rgba(0, 0, 0, 0.74);
        border: var(--rule);
        border-radius: var(--radius-sm);
        padding: 22px 40px 12px;
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.4);
      }

      #t2-list-hairline .title {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        padding-bottom: 14px;
      }

      #t2-list-hairline .row {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); color: var(--text);
        border-top: var(--rule);
        padding: 12px 0;
      }
      #t2-list-hairline .row:last-child { padding-bottom: 14px; }
    </style>
  </head>
  <body>
    <div id="t2-list-hairline" data-composition-id="t2-list-hairline" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="title" data-slot="title">What's Covered</div>
        <div class="row" data-row="1"><span data-slot="i1">Prompt design fundamentals</span></div>
        <div class="row" data-row="2"><span data-slot="i2">Agent orchestration patterns</span></div>
        <div class="row" data-row="3"><span data-slot="i3">Deployment &amp; monitoring</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-list-hairline";

      tl.from(root + " .plate", { autoAlpha: 0, y: 22, filter: "blur(10px)", duration: 1.1, ease: "expo.out" }, 0)
        .from(root + " .title", { autoAlpha: 0, y: 10, duration: 0.7, ease: "expo.out" }, 0.4)
        .from(root + " .row[data-row='1']", { autoAlpha: 0, x: -18, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, 0.6)
        .from(root + " .row[data-row='2']", { autoAlpha: 0, x: -18, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, 0.75)
        .from(root + " .row[data-row='3']", { autoAlpha: 0, x: -18, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, 0.9)

        .set({}, {}, 6);

      window.__timelines["t2-list-hairline"] = tl;
    </script>
  </body>
</html>
