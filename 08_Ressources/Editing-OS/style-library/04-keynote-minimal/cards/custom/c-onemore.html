<!doctype html>
<!--
  KEYNOTE MINIMAL · custom · tease · ONEMORE
  Full-screen "one more thing" beat. The frame opens near-black and holds
  there in silence; a small dim mono kicker fades in center, holds, then
  fades away; only after it clears does the title resolve huge and white,
  with the stage glow blooming beneath it. Patience is the whole point.
  Slots: kicker, title.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-onemore {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #c-onemore .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #c-onemore .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #c-onemore .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
      }

      #c-onemore .kicker {
        position: absolute;
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-faint);
      }

      #c-onemore .title {
        font-weight: var(--wt-bold); font-size: var(--size-display);
        letter-spacing: var(--track-display); color: var(--text);
        line-height: 1.05; max-width: 1500px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="c-onemore" data-composition-id="c-onemore" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="kicker" data-slot="kicker">one more thing</div>
        <div class="title" data-slot="title">Your certification never expires.</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-onemore";

      tl.set(root + " .title", { autoAlpha: 0 }, 0)
        .set(root + " .kicker", { autoAlpha: 0 }, 0)
        .set(root + " .stage-glow", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 90%" }, 0)

        /* let the black breathe before anything happens */
        .to(root + " .kicker", { autoAlpha: 1, duration: 0.9, ease: "power2.inOut" }, 1.0)

        /* a confident hold on the kicker alone in the dark */
        .to(root + " .kicker", { autoAlpha: 0, duration: 0.7, ease: "power2.inOut" }, 2.5)

        /* the stage glow blooms beneath the title as it resolves */
        .to(root + " .stage-glow", { autoAlpha: 1, scale: 1.0, duration: 1.6, ease: "expo.out" }, 3.15)

        .from(root + " .title", { autoAlpha: 0, y: 34, filter: "blur(14px)", duration: 1.3, ease: "expo.out" }, 3.3)

        /* long silent hold on the resolved title, then a slow finite breath */
        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 90%", duration: 1.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.2)

        .set({}, {}, 8);

      window.__timelines["c-onemore"] = tl;
    </script>
  </body>
</html>
