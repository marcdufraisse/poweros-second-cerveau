<!doctype html>
<!--
  KEYNOTE MINIMAL · custom · reveal · MEGAWORD
  Full-screen product-reveal takeover. True-black stage glows low in frame;
  one short word resolves at mega scale in metallic gradient (0.88->1.0 scale
  while a blur clears); once settled, a narrow bright band sweeps once
  left-to-right across the word like light passing over machined metal
  (a separate overlay div, mix-blend-mode: overlay, moved with xPercent —
  the text's own background-position never animates); a dim sub-line resolves
  below only after the sweep passes.
  Slots: word, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-megaword {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #c-megaword .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #c-megaword .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #c-megaword .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* the sweep is clipped to exactly the word's footprint via overflow:hidden
         on this wrapper. isolation + an opaque canvas backdrop give the
         mix-blend-mode below a real surface to react with, so the highlight
         reads only where the word's own glyph pixels sit beneath it —
         everywhere else the blend resolves back to plain black. */
      #c-megaword .word-wrap {
        position: relative; display: inline-block; overflow: hidden; isolation: isolate;
        background: var(--canvas);
      }

      /* metallic hero word — background-clip:text; padding protects edges;
         NO will-change here (render gotcha) */
      #c-megaword .word {
        font-weight: var(--wt-black); font-size: var(--size-mega);
        line-height: 1.0; letter-spacing: var(--track-display);
        padding: 0 44px;
        background: var(--metal-text);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      /* the light-pass overlay — a skewed soft band, blended over the word.
         skewX is set via GSAP (not this stylesheet) so GSAP owns the whole
         transform from frame one — mixing a CSS-authored transform with a
         GSAP-animated xPercent causes the two to decompose/recompose the
         matrix in different orders and drift out of alignment. */
      #c-megaword .sweep {
        position: absolute; top: -30%; left: 0; width: 46%; height: 160%;
        background: linear-gradient(100deg,
          transparent 0%,
          rgba(255, 255, 255, 0.55) 48%,
          transparent 100%);
        mix-blend-mode: overlay;
        pointer-events: none;
        z-index: 4;
      }

      #c-megaword .sub {
        margin-top: 26px;
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-body); letter-spacing: var(--track-snug);
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="c-megaword" data-composition-id="c-megaword" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="word-wrap">
          <div class="word" data-slot="word">Agents.</div>
          <div class="sweep"></div>
        </div>
        <div class="sub" data-slot="sub">Certified. Trained. Ready to work.</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-megaword";

      tl.set(root + " .sweep", { xPercent: -160, skewX: -18 }, 0)

        .from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 90%", duration: 1.6, ease: "expo.out" }, 0)

        /* the reveal: scale 0.88 -> 1.0 while blur resolves to sharp */
        .from(root + " .word", { autoAlpha: 0, scale: 0.88, filter: "blur(16px)", transformOrigin: "50% 55%", duration: 1.3, ease: "expo.out" }, 0.3)

        /* a confident hold on the resolved word before the light passes */
        .to(root + " .sweep", { xPercent: 260, duration: 0.9, ease: "power2.inOut" }, 2.0)

        /* sub-line resolves only after the sweep has passed */
        .from(root + " .sub", { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 1.0, ease: "expo.out" }, 2.85)

        /* stage glow breathes gently — finite */
        .to(root + " .stage-glow", { scale: 1.05, transformOrigin: "50% 90%", duration: 2.05, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.9)

        .set({}, {}, 8);

      window.__timelines["c-megaword"] = tl;
    </script>
  </body>
</html>
