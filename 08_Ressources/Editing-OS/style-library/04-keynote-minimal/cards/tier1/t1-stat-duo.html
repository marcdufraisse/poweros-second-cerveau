<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · stat · DUO
  Full-screen takeover. True-black stage; twin soft glows breathe low in
  frame; two metallic count-up numbers sit side by side split by a single
  vertical hairline — left in cool metal, right in blue-metal. Each side
  carries its own kicker + short label. Silk motion, no bounce.
  Slots: kicker1, stat1, label1, kicker2, stat2, label2.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-duo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-duo .stage-glow {
        position: absolute; inset: 0; background: var(--glow-duo); z-index: 1;
      }
      #t1-stat-duo .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-stat-duo .row {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
        padding: 0 var(--pad);
      }

      #t1-stat-duo .divider {
        width: 1px; align-self: stretch; margin: 140px 0;
        background: var(--hairline); transform: scaleY(0); transform-origin: 50% 50%;
      }

      #t1-stat-duo .col {
        width: 44%;
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
      }

      #t1-stat-duo .kicker {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 10px;
      }

      /* metallic hero numbers — background-clip:text; padding protects edges;
         NO will-change here (render gotcha) */
      /* solid fills — two side-by-side gradient-clipped numbers fall into the
         invisible-slab failure mode, so the duo uses flat color instead */
      #t1-stat-duo .stat {
        font-weight: var(--wt-black); font-size: var(--size-display);
        line-height: 1.04; letter-spacing: var(--track-display);
        padding: 0 20px;
      }
      #t1-stat-duo .stat.metal { color: var(--text); }
      #t1-stat-duo .stat.blue  { color: var(--accent); }

      #t1-stat-duo .label {
        font-weight: var(--wt-semi); font-size: var(--size-body);
        letter-spacing: var(--track-snug); color: var(--text-dim);
        max-width: 460px; line-height: 1.35;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-duo" data-composition-id="t1-stat-duo" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="row">
        <div class="col">
          <div class="kicker" data-slot="kicker1">Course library</div>
          <div class="stat metal" data-slot="stat1" data-count-to="48">0</div>
          <div class="label" data-slot="label1">on-demand certification modules across every skill track</div>
        </div>

        <div class="divider"></div>

        <div class="col">
          <div class="kicker" data-slot="kicker2">Community</div>
          <div class="stat blue" data-slot="stat2" data-count-to="1200" data-count-suffix="+">0+</div>
          <div class="label" data-slot="label2">active builders sharing wins in the weekly live calls</div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-duo";

      const stat1El = document.querySelector(root + " [data-slot='stat1']");
      const stat2El = document.querySelector(root + " [data-slot='stat2']");
      const target1 = parseFloat(stat1El.dataset.countTo || "48");
      const target2 = parseFloat(stat2El.dataset.countTo || "1200");
      const suffix1 = stat1El.dataset.countSuffix || "";
      const suffix2 = stat2El.dataset.countSuffix || "";
      const counter1 = { v: 0 };
      const counter2 = { v: 0 };

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 55%", duration: 1.7, ease: "expo.out" }, 0)

        .from(root + " .kicker", { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 1.0, ease: "expo.out", stagger: 0.12 }, 0.3)

        .to(root + " .divider", { scaleY: 1, duration: 1.3, ease: "expo.out" }, 0.35)

        /* left number */
        .from(stat1El, { autoAlpha: 0, y: 30, filter: "blur(12px)", duration: 1.1, ease: "expo.out" }, 0.5)
        .to(counter1, {
          v: target1, duration: 1.6, ease: "power3.out",
          onUpdate: () => { stat1El.textContent = Math.round(counter1.v) + suffix1; }
        }, 0.5)

        /* right number, slightly staggered */
        .from(stat2El, { autoAlpha: 0, y: 30, filter: "blur(12px)", duration: 1.1, ease: "expo.out" }, 0.65)
        .to(counter2, {
          v: target2, duration: 1.7, ease: "power3.out",
          onUpdate: () => { stat2El.textContent = Math.round(counter2.v) + suffix2; }
        }, 0.65)

        .from(root + " .label", { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out", stagger: 0.1 }, 1.55)

        /* glow breathes — finite */
        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 55%", duration: 2.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.3)

        .set({}, {}, 7);

      window.__timelines["t1-stat-duo"] = tl;
    </script>
  </body>
</html>
