<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · section · RULE
  Full-screen chapter marker. True-black stage, asymmetric left composition —
  a title rises above a hairline that draws edge-to-edge across the full
  frame, a tiny accent tick square marks the line's true origin at the far
  left, and a mono kicker + sub-line sit beneath. The tick is the single
  accent-colored element in the card.
  Slots: kicker (text), title (text), sub (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-rule {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-section-rule .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-section-rule .edge {
        position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none;
      }

      #t1-section-rule .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
        padding-left: var(--pad);
      }

      #t1-section-rule .col { max-width: 940px; }

      #t1-section-rule .title {
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-snug); line-height: 1.05;
        color: var(--text); margin-bottom: 40px;
      }

      /* the hairline spans the true full frame width, edge to edge,
         regardless of the text column's left padding */
      #t1-section-rule .rule-row {
        position: relative; width: 1920px; height: 1px;
        left: calc(-1 * var(--pad));
        background: var(--hairline);
        transform: scaleX(0); transform-origin: 0% 50%;
      }

      /* the single accent element — sits at the line's true origin */
      #t1-section-rule .tick {
        position: absolute; top: -3.5px; left: -4px;
        width: 8px; height: 8px; background: var(--accent);
      }

      #t1-section-rule .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-top: 34px;
      }

      #t1-section-rule .sub {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); letter-spacing: var(--track-snug);
        color: var(--text-faint); margin-top: 14px; max-width: 860px;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-rule" data-composition-id="t1-section-rule" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="col">
          <div class="title" data-slot="title">Workflows</div>

          <div class="rule-row">
            <div class="tick"></div>
          </div>

          <div class="kicker" data-slot="kicker">Section 04</div>
          <div class="sub" data-slot="sub">From one-off tasks to systems that run every week</div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-rule";

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 78%", duration: 1.6, ease: "expo.out" }, 0)

        /* title rises first, blur-resolves */
        .from(root + " .title", { autoAlpha: 0, y: 32, filter: "blur(12px)", duration: 1.1, ease: "expo.out" }, 0.3)

        /* the hairline draws across the full frame */
        .to(root + " .rule-row", { scaleX: 1, duration: 1.3, ease: "expo.out" }, 1.15)

        /* the tick appears right as the line reaches its origin */
        .from(root + " .tick", { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 1.2)

        .from(root + " .kicker", { autoAlpha: 0, y: 16, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 2.15)
        .from(root + " .sub", { autoAlpha: 0, y: 12, duration: 0.8, ease: "power2.out" }, 2.45)

        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 78%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-section-rule"] = tl;
    </script>
  </body>
</html>
