<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · overview · SPECS
  Full-screen takeover. True-black stage; a soft stage glow breathes low in
  frame; a centered ~1100px column of four hairline-separated spec rows
  (mono uppercase label left, semi-bold value right) cascades in beneath a
  title, each row's hairline drawing left to right as it resolves.
  Slots: title, l1, v1, l2, v2, l3, v3, l4, v4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-specs {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-overview-specs .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-overview-specs .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-overview-specs .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      #t1-overview-specs .title {
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-display); color: var(--text);
        margin-bottom: 56px; text-align: center;
      }

      #t1-overview-specs .specs { width: 1100px; display: flex; flex-direction: column; }

      #t1-overview-specs .row { position: relative; padding: 26px 0; }
      #t1-overview-specs .row-rule {
        position: absolute; top: 0; left: 0; height: 1px; width: 100%;
        background: var(--hairline); transform: scaleX(0); transform-origin: 0% 50%;
      }
      #t1-overview-specs .row-inner {
        display: flex; align-items: baseline; justify-content: space-between;
      }

      #t1-overview-specs .rlabel {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
      }
      #t1-overview-specs .rvalue {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-specs" data-composition-id="t1-overview-specs" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="title" data-slot="title">Certification, at a glance</div>

        <div class="specs">
          <div class="row" data-row="1">
            <div class="row-rule"></div>
            <div class="row-inner">
              <div class="rlabel" data-slot="l1">Format</div>
              <div class="rvalue" data-slot="v1">Self-paced + live labs</div>
            </div>
          </div>
          <div class="row" data-row="2">
            <div class="row-rule"></div>
            <div class="row-inner">
              <div class="rlabel" data-slot="l2">Duration</div>
              <div class="rvalue" data-slot="v2">6 weeks</div>
            </div>
          </div>
          <div class="row" data-row="3">
            <div class="row-rule"></div>
            <div class="row-inner">
              <div class="rlabel" data-slot="l3">Cohort size</div>
              <div class="rvalue" data-slot="v3">Capped at 40</div>
            </div>
          </div>
          <div class="row" data-row="4">
            <div class="row-rule"></div>
            <div class="row-inner">
              <div class="rlabel" data-slot="l4">Outcome</div>
              <div class="rvalue" data-slot="v4">Acme Certified badge</div>
            </div>
          </div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-specs";

      tl.from(root + " .stage-glow", { autoAlpha: 0, duration: 1.6, ease: "expo.out" }, 0)

        .from(root + " .title", { autoAlpha: 0, y: 26, filter: "blur(10px)", duration: 1.1, ease: "expo.out" }, 0.2);

      /* four rows cascade — hairline draws, then label + value resolve */
      const rows = [1, 2, 3, 4];
      const rowStart = 1.0;
      const rowStagger = 0.18;

      rows.forEach((n, i) => {
        const t = rowStart + i * rowStagger;
        tl.to(root + ' .row[data-row="' + n + '"] .row-rule', { scaleX: 1, duration: 0.9, ease: "expo.out" }, t)
          .from(root + ' .row[data-row="' + n + '"] .rlabel', { autoAlpha: 0, y: 14, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, t + 0.08)
          .from(root + ' .row[data-row="' + n + '"] .rvalue', { autoAlpha: 0, y: 14, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, t + 0.14);
      });

      tl.to(root + " .stage-glow", { scale: 1.05, transformOrigin: "50% 78%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6)

        .set({}, {}, 8);

      window.__timelines["t1-overview-specs"] = tl;
    </script>
  </body>
</html>
