<!doctype html>
<!--
  HARRIS ATLAS · tier2 · lower-third · FILE
  Bottom-center dark slate strip (dossier ticker, max 900px wide). Courier
  text types on character by character: a file tag in accent blue, a middle
  dot, then the topic in white, ended by a blinking Courier cursor block
  (finite blinks). Transparent page ground — sits over talking-head footage.
  Slots: file, topic.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lowerthird-file {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-mono);
        overflow: hidden;
      }

      #t2-lowerthird-file .strip {
        position: absolute; left: 50%; bottom: 92px; z-index: 5;
        transform: translateX(-50%) scaleX(0.94);
        transform-origin: 50% 50%;
        max-width: 900px; width: 900px;
        background: var(--label-bg);
        border-radius: var(--radius-sm);
        box-shadow: 0 12px 28px rgba(0,0,0,0.4);
        padding: 20px 32px;
        display: flex; align-items: baseline; justify-content: center;
        white-space: nowrap; overflow: hidden;
      }

      #t2-lowerthird-file .file {
        font-size: var(--size-body); font-weight: 700;
        color: var(--accent); letter-spacing: 0.04em;
      }
      #t2-lowerthird-file .dot {
        font-size: var(--size-body); color: var(--cream);
        margin: 0 14px; opacity: 0.7;
      }
      #t2-lowerthird-file .topic {
        font-size: var(--size-body); font-weight: 400;
        color: var(--cream); letter-spacing: 0.02em;
      }
      #t2-lowerthird-file .cursor {
        display: inline-block; width: 14px; height: 30px;
        background: var(--cream); margin-left: 10px;
        transform: translateY(6px);
      }

      #t2-lowerthird-file .ch { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="t2-lowerthird-file" data-composition-id="t2-lowerthird-file" data-start="0" data-width="1920" data-height="1080">
      <div class="strip">
        <span class="file" data-slot="file">FILE 042</span><span class="dot">&middot;</span><span class="topic" data-slot="topic">THE CLASSROOM THAT NEVER CLOSES</span><span class="cursor"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector("#t2-lowerthird-file");

      /* deterministic pre-split: wrap every character of the typed line in
         its own span so the typewriter can stagger opacity char by char */
      function splitChars(el) {
        const text = el.textContent;
        el.textContent = "";
        const spans = [];
        for (const c of text) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c === " " ? " " : c;
          el.appendChild(s);
          spans.push(s);
        }
        return spans;
      }

      const fileEl = root.querySelector(".file");
      const topicEl = root.querySelector(".topic");
      const fileChars = splitChars(fileEl);
      const topicChars = splitChars(topicEl);
      const dotEl = root.querySelector(".dot");
      const cursorEl = root.querySelector(".cursor");

      gsap.set(dotEl, { opacity: 0 });
      gsap.set(cursorEl, { opacity: 0 });

      tl.from(root.querySelector(".strip"), { autoAlpha: 0, scaleX: 0.7, duration: 0.4, ease: "expo.out" }, 0)
        .to(fileChars, { opacity: 1, duration: 0.02, ease: "none", stagger: 0.03 }, 0.35)
        .to(dotEl, { opacity: 0.7, duration: 0.1, ease: "none" }, ">-0.02")
        .to(topicChars, { opacity: 1, duration: 0.02, ease: "none", stagger: 0.03 }, ">")
        /* blinking cursor: finite blinks after the line finishes typing */
        .set(cursorEl, { opacity: 1 })
        .to(cursorEl, { opacity: 0, duration: 0.32, ease: "none", repeat: 5, yoyo: true }, ">0.1")
        .to(cursorEl, { opacity: 0, duration: 0.3, ease: "none" }, ">")
        .set({}, {}, 6);

      window.__timelines["t2-lowerthird-file"] = tl;
    </script>
  </body>
</html>
