<!doctype html>
<!--
  HARRIS ATLAS · tier2 · lower-third · BOXED
  Bottom-left lower-third. A slate label box (white Oswald caps name) stamps
  in first; a smaller parchment chip with mono role text slides out beneath
  it a beat later. Transparent page ground — sits over talking-head footage.
  Slots: name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lowerthird-boxed {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
        overflow: hidden;
      }

      #t2-lowerthird-boxed .wrap {
        position: absolute; left: 90px; bottom: 96px; z-index: 5;
        display: flex; flex-direction: column; align-items: flex-start;
      }

      /* the slate name box — signature boxed map label */
      #t2-lowerthird-boxed .name {
        background: var(--label-bg); color: var(--white);
        padding: 16px 26px 18px; border-radius: var(--radius-sm);
        font-weight: var(--wt-semi); font-size: 40px;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        box-shadow: 0 10px 26px rgba(0,0,0,0.35);
        transform-origin: 0% 100%;
      }

      /* parchment chip sliding out beneath — role text */
      #t2-lowerthird-boxed .role-chip {
        position: relative; margin-top: -4px; margin-left: 14px;
        background: var(--parchment-hi);
        border: 1px solid rgba(var(--ink-rgb), 0.5);
        border-radius: var(--radius-sm);
        padding: 8px 20px 9px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        overflow: hidden;
      }
      #t2-lowerthird-boxed .role-chip::before {
        content: ""; position: absolute; inset: 0;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.12; pointer-events: none;
      }
      #t2-lowerthird-boxed .role {
        position: relative; z-index: 1;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--ink); letter-spacing: 0.06em; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lowerthird-boxed" data-composition-id="t2-lowerthird-boxed" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="name" data-slot="name">MARGARET OYELARAN</div>
        <div class="role-chip">
          <div class="role" data-slot="role">LEAD INVESTIGATOR &middot; AI EDUCATION DESK</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-lowerthird-boxed";

      tl.from(root + " .name", { autoAlpha: 0, y: 16, scale: 1.12, duration: 0.45, ease: "expo.out" }, 0.1)
        .fromTo(root + " .role-chip",
          { autoAlpha: 0, x: -30 },
          { autoAlpha: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.5)
        .set({}, {}, 6);

      window.__timelines["t2-lowerthird-boxed"] = tl;
    </script>
  </body>
</html>
