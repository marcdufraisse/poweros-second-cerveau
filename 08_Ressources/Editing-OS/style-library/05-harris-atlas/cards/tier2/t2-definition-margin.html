<!doctype html>
<!--
  HARRIS ATLAS · tier2 · definition · MARGIN
  Bottom-center parchment plate (marginalia note, max 1050px wide): the term
  in Oswald caps with a thin accent-blue underline that draws beneath it,
  then a serif italic one-line definition fades in below. Transparent page
  ground — sits over talking-head footage.
  Slots: term, def.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-definition-margin {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
        overflow: hidden;
      }

      #t2-definition-margin .plate {
        position: absolute; left: 50%; bottom: 90px; z-index: 5;
        transform: translateX(-50%);
        max-width: 1050px;
        background: var(--parchment-hi);
        border: 1px solid rgba(var(--ink-rgb), 0.5);
        border-radius: var(--radius-sm);
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        padding: 26px 46px 30px;
        text-align: center;
      }
      #t2-definition-margin .plate::before {
        content: ""; position: absolute; inset: 0;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.12; pointer-events: none;
      }
      #t2-definition-margin .term {
        position: relative; z-index: 1; display: inline-block;
        font-weight: var(--wt-semi); font-size: 46px;
        color: var(--ink); letter-spacing: var(--track-caps);
        text-transform: uppercase; transform-origin: 50% 100%;
      }
      #t2-definition-margin .underline-wrap {
        position: relative; z-index: 1;
        display: flex; justify-content: center; margin: 10px 0 14px;
      }
      #t2-definition-margin .underline {
        width: 220px; height: 3px; background: var(--accent);
        transform: scaleX(0); transform-origin: 50% 50%;
      }
      #t2-definition-margin .def {
        position: relative; z-index: 1;
        font-family: var(--font-body); font-style: italic;
        font-size: var(--size-body); color: rgba(var(--ink-rgb), 0.85);
        line-height: 1.4; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="t2-definition-margin" data-composition-id="t2-definition-margin" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="term" data-slot="term">EARLY ADOPTER</div>
        <div class="underline-wrap"><div class="underline"></div></div>
        <div class="def" data-slot="def">One who enrolls before the curriculum has proven itself.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-definition-margin";

      tl.from(root + " .plate", { autoAlpha: 0, y: 16, duration: 0.5, ease: "power2.out" }, 0)
        .from(root + " .term", { autoAlpha: 0, scale: 1.12, duration: 0.45, ease: "expo.out" }, 0.25)
        .to(root + " .underline", { scaleX: 1, duration: 0.55, ease: "power1.inOut" }, 0.7)
        .from(root + " .def", { autoAlpha: 0, y: 10, duration: 0.6, ease: "power2.out" }, 1.15)
        .set({}, {}, 6);

      window.__timelines["t2-definition-margin"] = tl;
    </script>
  </body>
</html>
