<!doctype html>
<!--
  HARRIS ATLAS · custom · archive · DOSSIER
  Film-ground archival plate. Near-black projector background with heavy
  grain, vignette, and a faint finite flicker. A lifted parchment document
  floats center-frame at a slight rotation with a soft shadow: a Courier
  header types on, then two Courier body lines type after it, then a
  red-bordered uppercase Oswald stamp SLAMS in over the corner of the page.
  Slots: doc_title, line1, line2, stamp.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-dossier {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--film); color: var(--cream);
        font-family: var(--font-mono); overflow: hidden;
      }

      #c-dossier .stage {
        position: absolute; inset: 0; z-index: 3;
      }

      #c-dossier .grain {
        position: absolute; inset: -40px; z-index: 6; pointer-events: none;
        background-image: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.22;
      }
      #c-dossier .vig {
        position: absolute; inset: 0; z-index: 7; pointer-events: none;
        background: var(--vignette);
      }

      #c-dossier .plate {
        position: absolute; left: 50%; top: 50%;
        width: 940px; padding: 74px 84px 84px;
        background: var(--parchment-hi); color: var(--ink);
        border-radius: var(--radius-sm);
        box-shadow: 0 46px 90px rgba(var(--film-rgb), 0.62), 0 8px 20px rgba(var(--film-rgb), 0.4);
        transform: translate(-50%, -50%) rotate(1deg);
      }

      #c-dossier .doc-title {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink); margin-bottom: 30px; white-space: pre;
      }
      #c-dossier .rule {
        border: none; border-top: var(--hairline); margin: 0 0 30px;
      }
      #c-dossier .line {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 24px; letter-spacing: 0.01em; line-height: 1.6;
        color: rgba(var(--ink-rgb), 0.88); margin-bottom: 16px; white-space: pre-wrap;
      }

      #c-dossier .stamp {
        position: absolute; top: 30px; right: 34px; z-index: 4;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--red); border: 3px solid var(--red);
        padding: 14px 26px 16px; border-radius: var(--radius-sm);
        transform: rotate(-8deg);
        background: rgba(var(--ink-rgb), 0.02);
      }
    </style>
  </head>
  <body>
    <div id="c-dossier" data-composition-id="c-dossier" data-start="0" data-width="1920" data-height="1080">

      <div class="stage">
        <div class="plate">
          <div class="doc-title" data-slot="doc_title">FILE 042 · ADOPTION LOG</div>
          <hr class="rule" />
          <div class="line" data-slot="line1">Subject enrolled in the Acme certification path on record.</div>
          <div class="line" data-slot="line2">First agent observed running unattended in production.</div>
          <div class="stamp" data-slot="stamp">Verified</div>
        </div>
      </div>

      <div class="grain"></div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      /* deterministic char-split for typewriter effect — pre-split spans, no runtime randomness */
      function splitChars(el) {
        const text = el.textContent;
        el.textContent = "";
        const spans = [];
        for (const ch of text) {
          const s = document.createElement("span");
          s.style.opacity = "0";
          s.textContent = ch === " " ? " " : ch;
          el.appendChild(s);
          spans.push(s);
        }
        return spans;
      }

      const root = "#c-dossier";
      const titleChars = splitChars(document.querySelector(root + " .doc-title"));
      const line1Chars = splitChars(document.querySelector(root + " .line[data-slot='line1']"));
      const line2Chars = splitChars(document.querySelector(root + " .line[data-slot='line2']"));

      const tl = gsap.timeline({ paused: true });

      /* faint finite projector flicker over the whole stage */
      tl.to(root + " .stage", { opacity: 0.97, duration: 0.22, ease: "none", repeat: 9, yoyo: true }, 0);

      /* document plate lifts in */
      tl.from(root + " .plate", { autoAlpha: 0, y: 26, scale: 0.97, duration: 0.7, ease: "power2.out" }, 0.3);

      /* header types on, then two body lines type after it */
      tl.to(titleChars, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.03 }, 1.1)
        .to(line1Chars, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.03 }, 2.0)
        .to(line2Chars, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.03 }, 3.3);

      /* red stamp SLAMS in over the corner */
      tl.fromTo(root + " .stamp",
        { autoAlpha: 0, scale: 1.6 },
        { autoAlpha: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 4.9);

      tl.set({}, {}, 8);

      window.__timelines["c-dossier"] = tl;
    </script>
  </body>
</html>
