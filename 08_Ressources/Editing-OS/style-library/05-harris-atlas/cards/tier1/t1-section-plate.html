<!doctype html>
<!--
  HARRIS ATLAS · tier1 · section · PLATE
  Full-screen takeover. Atlas-plate chapter divider: parchment ground,
  plate frame + corner coordinates, a centered mono chapter index, a short
  red tick rule, an enormous Oswald title, and a small serif italic
  sub-line. Slow push-in on the map ground only.
  Slots: index (text), title (text), sub (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-plate {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* map ground — pushed-in by the timeline (background only, text stays sharp) */
      #t1-section-plate .ground {
        position: absolute; inset: -60px; z-index: 1;
      }
      #t1-section-plate .ground svg { width: 100%; height: 100%; }

      #t1-section-plate .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-section-plate .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-section-plate .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-section-plate .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-section-plate .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-section-plate .coord.tl { top: 54px; left: 62px; }
      #t1-section-plate .coord.br { bottom: 54px; right: 62px; }

      #t1-section-plate .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      #t1-section-plate .index {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--ink-rgb), 0.72); letter-spacing: var(--track-wide);
        text-transform: uppercase;
      }
      #t1-section-plate .tick {
        width: 90px; height: 4px; margin: 22px 0; background: var(--red);
        transform-origin: center; transform: scaleX(0);
      }
      #t1-section-plate .title {
        font-weight: var(--wt-semi); font-size: var(--size-title);
        line-height: 1.05; letter-spacing: 0.01em; color: var(--ink);
        text-transform: uppercase; margin: 0; max-width: 1420px;
      }
      #t1-section-plate .sub {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-reg);
        font-size: var(--size-body); color: rgba(var(--ink-rgb), 0.8);
        margin-top: 22px; max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-plate" data-composition-id="t1-section-plate" data-start="0" data-width="1920" data-height="1080">

      <div class="ground">
        <!-- abstract coastline: sage ocean, parchment landmass (no literal geography) -->
        <svg viewBox="0 0 2040 1200" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="2040" height="1200" fill="var(--sage)"/>
          <path d="M -80 900 C 300 1020, 640 940, 900 1000 C 1180 1060, 1420 960, 1680 1010 C 1880 1050, 2000 970, 2120 1000 L 2120 -100 L -80 -100 Z"
                fill="var(--parchment)"/>
        </svg>
      </div>

      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">PLATE 22 · CHAPTER MARK</div>
      <div class="coord br">ACME ARCHIVE · SHEET 05</div>

      <div class="center">
        <div class="index" data-slot="index">PART II</div>
        <div class="tick"></div>
        <div class="title" data-slot="title">THE CERTIFICATION WARS</div>
        <div class="sub" data-slot="sub">In which the community decided what "qualified" would mean.</div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-plate";

      /* slow documentary push-in — GROUND ONLY, text stays pin-sharp */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "50% 55%", duration: 7, ease: "power2.inOut" }, 0)

        /* plate + coordinates print on */
        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        /* chapter index settles, the red tick draws, then the title STAMPS */
        .from(root + " .index", { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out" }, 1.0)
        .to(root + " .tick", { scaleX: 1, duration: 0.5, ease: "power1.inOut" }, 1.5)
        .from(root + " .title", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 1.85)
        .from(root + " .sub", { autoAlpha: 0, y: 16, duration: 0.6, ease: "power2.out" }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-section-plate"] = tl;
    </script>
  </body>
</html>
