<!doctype html>
<!--
  HARRIS ATLAS · tier1 · stat · FILM
  Full-screen takeover. Projector-black ground: heavy grain, warm vignette,
  faint finite flicker. A Courier kicker types on character by character,
  an enormous cream Oswald number counts up center-frame with a small
  accent-blue tick beneath it, then a small cream serif line resolves below.
  Slots: kicker, stat, label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-film {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--film); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-film .ground { position: absolute; inset: -60px; z-index: 1; background: var(--film); }
      #t1-stat-film .grain {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.14;
      }
      #t1-stat-film .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-stat-film .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      #t1-stat-film .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: var(--cream); opacity: 0.68; letter-spacing: var(--track-wide);
        text-transform: uppercase; margin-bottom: 14px;
      }
      #t1-stat-film .kicker span { display: inline-block; }
      #t1-stat-film .stat {
        font-weight: var(--wt-semi); font-size: 260px; line-height: 1;
        letter-spacing: 0.01em; color: var(--cream);
      }
      #t1-stat-film .tick {
        width: 140px; height: 4px; margin: 26px auto 0;
        background: var(--accent); transform-origin: center;
      }
      #t1-stat-film .label {
        font-family: var(--font-body); font-style: italic;
        font-size: var(--size-body); color: var(--cream); opacity: 0.82;
        max-width: 900px; margin-top: 30px; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-film" data-composition-id="t1-stat-film" data-start="0" data-width="1920" data-height="1080">

      <div class="ground"></div>
      <div class="grain"></div>

      <div class="center">
        <div class="kicker" data-slot="kicker">CLASSIFIED: MEMBER FILE 118</div>
        <div class="stat" data-slot="stat">97</div>
        <div class="tick"></div>
        <div class="label" data-slot="label">percent completed certification within the cohort</div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-stat-film";

      /* pre-split the Courier kicker into char spans for a deterministic typewriter */
      const kickerEl = document.querySelector(root + " .kicker");
      const kickerText = kickerEl.textContent;
      kickerEl.textContent = "";
      const kickerChars = kickerText.split("").map(function (ch) {
        const span = document.createElement("span");
        span.textContent = ch === " " ? " " : ch;
        span.style.opacity = "0";
        kickerEl.appendChild(span);
        return span;
      });

      const statEl = document.querySelector(root + " .stat");
      const target = parseInt(statEl.textContent.replace(/[^0-9]/g, ""), 10) || 0;
      const counter = { v: 0 };
      statEl.textContent = "0";

      const tl = gsap.timeline({ paused: true });

      /* slow documentary push-in — GROUND ONLY */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.05, transformOrigin: "50% 50%", duration: 7, ease: "power2.inOut" }, 0)

        /* Courier kicker types on, char by char */
        .to(kickerChars, { opacity: 1, duration: 0.03, stagger: 0.03, ease: "none" }, 0.4)

        /* number resolves then counts up */
        .from(root + " .stat", { autoAlpha: 0, scale: 1.12, duration: 0.5, ease: "expo.out" }, 1.5)
        .to(counter, {
          v: target, duration: 1.1, ease: "power2.out",
          onUpdate: function () { statEl.textContent = Math.round(counter.v).toString(); }
        }, 1.7)

        .fromTo(root + " .tick", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power1.inOut" }, 3.0)

        .from(root + " .label", { autoAlpha: 0, y: 16, duration: 0.6, ease: "power2.out" }, 3.35)

        /* faint finite projector flicker on the whole frame */
        .to(root, { opacity: 0.97, duration: 0.12, repeat: 9, yoyo: true, ease: "none" }, 4.2)

        .set({}, {}, 7);

      window.__timelines["t1-stat-film"] = tl;
    </script>
  </body>
</html>
