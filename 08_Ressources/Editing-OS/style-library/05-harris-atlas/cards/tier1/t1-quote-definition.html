<!doctype html>
<!--
  HARRIS ATLAS · tier1 · quote · DEFINITION
  Full-screen takeover. A dictionary-entry moment on a muted projector-black
  ground: a small accent-blue marker, the term in bold lowercase Oswald
  cream, a dim serif italic pronunciation note beside it, then the serif
  italic definition below, and a small Courier source line at the bottom.
  The term resolves first; the definition fades in after.
  Slots: term, note, def, src.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-definition {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--film); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-quote-definition .ground { position: absolute; inset: -60px; z-index: 1; background: var(--film); }
      #t1-quote-definition .grain {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.14;
      }
      #t1-quote-definition .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-quote-definition .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
        padding-left: 220px; padding-right: 220px;
      }

      #t1-quote-definition .headword {
        display: flex; align-items: baseline; gap: 22px; margin-bottom: 30px;
      }
      #t1-quote-definition .dot {
        width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
        transform: translateY(-14px);
      }
      #t1-quote-definition .term {
        font-weight: var(--wt-bold); font-size: 118px; line-height: 1;
        text-transform: lowercase; color: var(--cream);
      }
      #t1-quote-definition .note {
        font-family: var(--font-body); font-style: italic;
        font-size: 26px; color: var(--cream); opacity: 0.5;
      }
      #t1-quote-definition .def {
        font-family: var(--font-body); font-style: italic;
        font-size: var(--size-body); color: var(--cream); opacity: 0.92;
        max-width: 1240px; line-height: 1.55;
      }
      #t1-quote-definition .src {
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--cream); opacity: 0.55; letter-spacing: 0.08em;
        margin-top: 42px;
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-definition" data-composition-id="t1-quote-definition" data-start="0" data-width="1920" data-height="1080">

      <div class="ground"></div>
      <div class="grain"></div>

      <div class="center">
        <div class="headword">
          <div class="dot"></div>
          <div class="term" data-slot="term">automation debt</div>
          <div class="note" data-slot="note">(uh-tom-uh-SHAY-shun det) · noun</div>
        </div>
        <div class="def" data-slot="def">The accumulated cost of manual work an organization keeps postponing to automate, with interest.</div>
        <div class="src" data-slot="src">ACME FIELD GLOSSARY · ENTRY 004</div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-quote-definition";

      const tl = gsap.timeline({ paused: true });

      /* slow documentary push-in — GROUND ONLY */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.05, transformOrigin: "42% 48%", duration: 7, ease: "power2.inOut" }, 0)

        /* the term resolves first: marker pops, term stamps in */
        .from(root + " .dot", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "expo.out" }, 0.4)
        .from(root + " .term", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 0.55)
        .from(root + " .note", { autoAlpha: 0, y: 10, duration: 0.5, ease: "power2.out" }, 1.1)

        /* the definition fades/rises in after the term settles */
        .from(root + " .def", { autoAlpha: 0, y: 20, duration: 0.8, ease: "power2.out" }, 1.7)

        /* source line resolves last */
        .from(root + " .src", { autoAlpha: 0, y: 10, duration: 0.5, ease: "power2.out" }, 2.6)

        /* faint finite projector flicker on the whole frame */
        .to(root, { opacity: 0.97, duration: 0.12, repeat: 9, yoyo: true, ease: "none" }, 3.2)

        .set({}, {}, 7);

      window.__timelines["t1-quote-definition"] = tl;
    </script>
  </body>
</html>
