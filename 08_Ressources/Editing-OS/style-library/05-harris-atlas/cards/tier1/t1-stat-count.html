<!doctype html>
<!--
  HARRIS ATLAS · tier1 · stat · COUNT
  Full-screen takeover. Left-aligned dossier column over a dimmed atlas
  ground (distinct from the centered stat-date plate): mono kicker top,
  giant accent-blue Oswald count-up number, boxed white-on-slate label,
  ink hairline, serif italic claim. Map coastline sits dimmed to the right,
  pushed in slowly; text stays pin-sharp throughout.
  Slots: kicker, stat, label, claim.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-count {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* map ground — dimmed, biased right, pushed-in by the timeline */
      #t1-stat-count .ground {
        position: absolute; inset: -60px; z-index: 1; opacity: 0.6;
      }
      #t1-stat-count .ground svg { width: 100%; height: 100%; }

      #t1-stat-count .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-stat-count .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-stat-count .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-stat-count .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-stat-count .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-stat-count .coord.tl { top: 54px; left: 62px; }
      #t1-stat-count .coord.br { bottom: 54px; right: 62px; }

      /* left dossier column */
      #t1-stat-count .col {
        position: absolute; z-index: 5; left: 150px; top: 50%;
        transform: translateY(-52%); max-width: 860px;
      }
      #t1-stat-count .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--ink-rgb), 0.72); letter-spacing: var(--track-wide);
        text-transform: uppercase; margin-bottom: 12px;
      }
      #t1-stat-count .stat {
        font-weight: var(--wt-bold); font-size: 224px; line-height: 1;
        letter-spacing: 0.01em; color: var(--accent);
      }
      #t1-stat-count .boxed {
        display: inline-block; margin-top: 24px;
        background: var(--label-bg); color: var(--white);
        padding: var(--label-pad); border-radius: var(--radius-sm);
        font-weight: var(--wt-med); font-size: var(--size-label);
        letter-spacing: var(--track-caps); text-transform: uppercase;
      }
      #t1-stat-count .hair {
        width: 520px; height: 0; margin: 34px 0;
        border-top: var(--hairline); transform-origin: left center;
      }
      #t1-stat-count .claim {
        font-family: var(--font-body); font-style: italic;
        font-size: var(--size-body); color: rgba(var(--ink-rgb), 0.85);
        max-width: 800px; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-count" data-composition-id="t1-stat-count" data-start="0" data-width="1920" data-height="1080">

      <div class="ground">
        <svg viewBox="0 0 2040 1200" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="2040" height="1200" fill="var(--sage)"/>
          <path d="M 900 -80 C 1180 60, 1260 220, 1460 210 C 1660 200, 1780 340, 1980 320 L 2120 -80 Z
                    M 860 1300 C 1020 1140, 1260 1180, 1440 1080 C 1660 960, 1880 1040, 2120 940 L 2120 1300 Z"
                fill="var(--parchment)"/>
          <path d="M 1180 460 C 1300 400, 1440 430, 1510 510 C 1580 590, 1560 690, 1470 730 C 1380 770, 1250 750, 1190 670 C 1130 590, 1090 510, 1180 460 Z"
                fill="var(--slate)" opacity="0.85" transform="translate(430,-70)"/>
        </svg>
      </div>

      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">FILE 118 · MEMBER TALLY</div>
      <div class="coord br" data-slot="coord">ACME ARCHIVE · SHEET 21</div>

      <div class="col">
        <div class="kicker" data-slot="kicker">TALLY OF THE INVESTIGATION</div>
        <div class="stat" data-slot="stat">1,842</div>
        <div class="boxed" data-slot="label">AGENTS DEPLOYED BY MEMBERS</div>
        <div class="hair"></div>
        <div class="claim" data-slot="claim">Every one of them started the program with zero automation experience.</div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-stat-count";

      const statEl = document.querySelector(root + " .stat");
      const target = parseInt(statEl.textContent.replace(/[^0-9]/g, ""), 10) || 0;
      const counter = { v: 0 };
      statEl.textContent = "0";

      const tl = gsap.timeline({ paused: true });

      /* slow documentary push-in — GROUND ONLY */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "62% 45%", duration: 7, ease: "power2.inOut" }, 0)

        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        .from(root + " .kicker", { autoAlpha: 0, y: 14, duration: 0.55, ease: "expo.out" }, 1.0)

        /* count-up: entrance reveals the digit, then the counter ticks up */
        .from(root + " .stat", { autoAlpha: 0, scale: 1.12, duration: 0.5, ease: "expo.out" }, 1.35)
        .to(counter, {
          v: target, duration: 1.2, ease: "power2.out",
          onUpdate: function () { statEl.textContent = Math.round(counter.v).toLocaleString(); }
        }, 1.55)

        .from(root + " .boxed", { autoAlpha: 0, scale: 1.12, duration: 0.45, ease: "expo.out" }, 2.9)

        .fromTo(root + " .hair", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power1.inOut" }, 3.35)

        .from(root + " .claim", { autoAlpha: 0, y: 18, duration: 0.7, ease: "power2.out" }, 3.7)

        .set({}, {}, 7);

      window.__timelines["t1-stat-count"] = tl;
    </script>
  </body>
</html>
