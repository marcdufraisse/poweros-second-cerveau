<!doctype html>
<!--
  HOUSE · social 9:16 · L'UI REJOUÉE QUI S'EXÉCUTE
  Le geste central importé de Nathan Hodgson (12), porté à la charte l'utilisateur :
  une app sombre REDESSINÉE (pas une capture), posée en carte verre sur le
  navy, qui joue sa séquence causale pendant que l'utilisateur parle :
    1. la requête SE TAPE dans la bulle        45 ms/caractère
    2. la ligne de statut apparaît             « Ouverture du navigateur ✓ »
    3. les lignes de résultat tombent          stagger 0.18s
    4. les badges basculent au jaune           92% → ✓ FAIT
    5. le compteur + la jauge courent          linéaire, c'est une machine
  Rien n'est « présenté », tout ARRIVE. La composer bar reste inerte en bas.
  Occupe la moitié haute du cadre (sandwich : le visage parle en dessous).
  Voir 10-marc/PLAYBOOK.md, grammaire workflow.
  Slots: prompt, status, row1/row1badge, row2/row2badge,
         counterLabel, counterEnd, counterTotal.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-ui-run {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: transparent;
        font-family: var(--font-body);
      }

      /* le panneau : l'app redessinée, carte den sur la moitié haute */
      #soc-ui-run .panel {
        position: absolute; left: 56px; right: 56px; top: 110px;
        background: var(--den); border-radius: 34px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: var(--glass-shadow);
        padding: 44px 40px 36px;
        color: var(--white);
      }
      #soc-ui-run .prompt {
        margin-left: auto; width: fit-content; max-width: 80%;
        background: rgba(255, 255, 255, 0.08); border-radius: 22px;
        padding: 24px 30px; font-size: 33px; font-weight: var(--wt-med);
        line-height: 1.3;
      }
      #soc-ui-run .prompt .caret {
        display: inline-block; width: 3px; height: 1em;
        background: var(--white); vertical-align: -0.15em;
        animation: uir-blink 0.9s steps(1) infinite;
      }
      @keyframes uir-blink { 50% { opacity: 0; } }

      #soc-ui-run .status {
        display: flex; align-items: center; gap: 14px;
        margin-top: 32px; font-family: var(--font-mono);
        font-size: 26px; color: var(--grey-pre);
      }
      #soc-ui-run .status .ok {
        width: 34px; height: 34px; border-radius: 50%;
        background: var(--jaune); color: var(--navy);
        display: grid; place-items: center; font-size: 20px; font-weight: 700;
      }

      #soc-ui-run .rows { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
      #soc-ui-run .row {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px; padding: 24px 26px;
      }
      #soc-ui-run .row .label { font-size: 31px; font-weight: var(--wt-semi); }
      #soc-ui-run .badge {
        font-family: var(--font-mono); font-size: 23px; font-weight: 700;
        padding: 10px 18px; border-radius: 12px; white-space: nowrap;
        color: var(--grey-pre); background: rgba(255, 255, 255, 0.07);
      }
      #soc-ui-run .badge.done { color: var(--navy); background: var(--jaune); }
      #soc-ui-run .badge .alt { display: none; }
      #soc-ui-run .badge.done .alt { display: inline; }
      #soc-ui-run .badge.done .base { display: none; }

      #soc-ui-run .counter {
        margin-top: 32px; display: flex; align-items: baseline; gap: 16px;
        font-family: var(--font-mono);
      }
      #soc-ui-run .counter .clabel { font-size: 26px; letter-spacing: var(--track-pill); color: var(--grey-pre); }
      #soc-ui-run .counter .val { font-size: 62px; font-weight: 700; color: var(--jaune); font-variant-numeric: tabular-nums; }
      #soc-ui-run .counter .total { font-size: 28px; color: var(--grey-pre); }
      #soc-ui-run .bar {
        margin-top: 14px; height: 10px; border-radius: 99px;
        background: rgba(255, 255, 255, 0.10); overflow: hidden;
      }
      #soc-ui-run .bar .fill {
        height: 100%; border-radius: 99px;
        background: linear-gradient(90deg, var(--money-deep), var(--jaune));
        transform-origin: 0% 50%;
      }

      /* la composer bar, inerte : la preuve de contexte */
      #soc-ui-run .composer {
        margin-top: 34px; background: rgba(255, 255, 255, 0.05);
        border-radius: 20px; padding: 22px 26px;
        display: flex; align-items: center; justify-content: space-between;
        font-size: 26px; color: var(--grey-pre);
      }
      #soc-ui-run .composer .mode { display: flex; gap: 10px; align-items: center; }
      #soc-ui-run .composer .tag {
        background: rgba(255, 255, 255, 0.10); color: var(--white);
        border-radius: 10px; padding: 6px 14px;
        font-weight: var(--wt-semi); font-size: 23px;
      }
    </style>
  </head>
  <body>
    <div id="soc-ui-run" data-composition-id="soc-ui-run" data-start="0" data-width="1080" data-height="1920">
      <div class="panel">
        <div class="prompt"><span class="ptext" data-slot="prompt">Analyse mes 10 derniers reels.</span><span class="caret"></span></div>

        <div class="status"><span class="ok">✓</span><span data-slot="status">Ouverture du navigateur</span></div>

        <div class="rows">
          <div class="row">
            <span class="label" data-slot="row1">Transcription</span>
            <span class="badge" data-badge="1"><span class="base" data-slot="row1badge">EN COURS</span><span class="alt">✓ FAIT</span></span>
          </div>
          <div class="row">
            <span class="label" data-slot="row2">Analyse des coupes</span>
            <span class="badge" data-badge="2"><span class="base" data-slot="row2badge">EN ATTENTE</span><span class="alt">✓ FAIT</span></span>
          </div>
        </div>

        <div class="counter">
          <span class="clabel" data-slot="counterLabel">REELS</span>
          <span class="val" id="uir-val">0</span>
          <span class="total">/ <span data-slot="counterTotal">10</span></span>
        </div>
        <div class="bar"><div class="fill"></div></div>

        <div class="composer">
          <span>Comment puis-je aider ?</span>
          <span class="mode"><span class="tag">Chat</span><span>Opus 5</span></span>
        </div>

        <div style="display:none" data-slot="counterEnd">10</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-ui-run";
      const $ = (s) => document.querySelector(root + " " + s);

      const tl = gsap.timeline({ paused: true });

      /* 1. le panneau arrive */
      tl.fromTo(root + " .panel", { y: 60, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.42, ease: "power3.out" }, 0.05);

      /* 2. la requête se tape — set() par caractère (le seek du moteur
         supprime les callbacks, seuls les set() sont déterministes) */
      const ptext = $(".ptext");
      const full = ptext.textContent;
      tl.set(ptext, { textContent: "" }, 0.45);
      const chars = full.length;
      for (let i = 1; i <= chars; i++) {
        tl.set(ptext, { textContent: full.slice(0, i) }, 0.5 + i * 0.045);
      }
      const t2 = 0.5 + chars * 0.045;
      tl.set($(".caret"), { display: "none" }, t2 + 0.3);

      /* 3. le statut */
      tl.fromTo(root + " .status", { y: 14, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.32, ease: "back.out(1.8)" }, t2 + 0.35);

      /* 4. les lignes tombent, une par une */
      tl.fromTo(root + " .row", { y: 26, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.34, ease: "power3.out", stagger: 0.18 }, t2 + 0.75);

      /* 5. les badges basculent au jaune — set(className), pas de callback */
      tl.set($('[data-badge="1"]'), { className: "badge done" }, t2 + 1.7);
      tl.fromTo('[data-badge="1"]', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t2 + 1.7);
      tl.set($('[data-badge="2"]'), { className: "badge done" }, t2 + 2.1);
      tl.fromTo('[data-badge="2"]', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t2 + 2.1);

      /* 6. le compteur + la jauge courent — linéaire, en set() par pas */
      const valEl = document.getElementById("uir-val");
      const end = parseInt($('[data-slot="counterEnd"]')?.textContent || "10", 10) || 10;
      const total = parseInt($('[data-slot="counterTotal"]')?.textContent || String(end), 10) || end;
      const steps = Math.min(end, 48);
      for (let s = 1; s <= steps; s++) {
        tl.set(valEl, { textContent: Math.round((end * s) / steps) }, t2 + 2.5 + (1.6 * s) / steps);
      }
      tl.fromTo(root + " .bar .fill", { scaleX: 0 }, { scaleX: end / total, duration: 1.6, ease: "none" }, t2 + 2.5);

      tl.set({}, {}, t2 + 5.0);
      window.__timelines["soc-ui-run"] = tl;
    </script>
  </body>
</html>
