<!doctype html>
<!--
  HOUSE · social 9:16 · VIEW BADGES
  Social-proof view counters from reel DZU-J9roH-O: dark glass pills with an
  eye glyph and a view count, popping in staggered over the media zone
  (top ~58% of the vertical frame). Transparent — overlays any footage.
  Up to 6 badges; unused slots can be emptied (empty text hides visually).
  Slots: v1..v6 (text, e.g. "1,3 M").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-view-badges {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #soc-view-badges .badge {
        position: absolute;
        display: flex; align-items: center; gap: 12px;
        font-weight: var(--wt-heavy); font-size: 40px; color: var(--white);
        background: rgba(10, 12, 18, 0.68);
        border-radius: 14px; padding: 14px 26px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      }
      #soc-view-badges .badge svg { width: 40px; height: 40px; display: block; }
      #soc-view-badges .b1 { top: 300px; left: 90px; }
      #soc-view-badges .b2 { top: 270px; right: 120px; }
      #soc-view-badges .b3 { top: 520px; left: 220px; }
      #soc-view-badges .b4 { top: 560px; right: 90px; }
      #soc-view-badges .b5 { top: 800px; left: 110px; }
      #soc-view-badges .b6 { top: 830px; right: 200px; }
    </style>
  </head>
  <body>
    <div id="soc-view-badges" data-composition-id="soc-view-badges" data-start="0" data-width="1080" data-height="1920">
      <div class="badge b1"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v1">1,3 M</span></div>
      <div class="badge b2"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v2">2,4 M</span></div>
      <div class="badge b3"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v3">1,2 M</span></div>
      <div class="badge b4"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v4">4,8 M</span></div>
      <div class="badge b5"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v5">2 M</span></div>
      <div class="badge b6"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg><span data-slot="v6">2,3 M</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-view-badges";

      /* hide badges whose slot text was emptied by Agent 3 */
      document.querySelectorAll(root + " .badge").forEach((b) => {
        const t = b.querySelector("[data-slot]");
        if (t && !t.textContent.trim()) b.style.display = "none";
      });

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .badge", {
          autoAlpha: 0, scale: 0.6, duration: 0.4,
          ease: "back.out(1.8)", stagger: 0.12
        }, 0.1)

        /* light float while alive */
        .to(root + " .b1, " + root + " .b3, " + root + " .b5", { y: -8, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0)
        .to(root + " .b2, " + root + " .b4, " + root + " .b6", { y: 8, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0)

        .set({}, {}, 8);

      window.__timelines["soc-view-badges"] = tl;
    </script>
  </body>
</html>
