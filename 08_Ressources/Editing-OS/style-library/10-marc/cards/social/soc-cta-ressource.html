<!doctype html>
<!--
  HOUSE · social 9:16 · CTA RESSOURCE (charte de marque, 2026-10-01)
  La carte de fin standard de tous les reels : « Commente MOT-CLÉ pour
  recevoir [la ressource] ». Une carte de verre noir violet, posée dans la
  zone haute (jamais sur le visage), entre 300 et 900 px : au-dessus de la
  zone mangée par l'UI Instagram, au-dessus de la ligne de tête du format 01.

  Déroulé : la carte sort d'un flou, « Commente » monte, le mot-clé se tape
  lettre par lettre dans la pilule de commentaire puis claque, « pour
  recevoir » et le nom de la ressource arrivent en cascade, puis seul le
  mot-clé respire jusqu'à la coupe (un seul élément qui respire par écran).

  Sons associés (convention sfx) : typing pendant la frappe, pop sur le
  claquement du mot-clé. 2 SFX, pas plus.

  Slots :
    badge     (text, ≤ 22 car.)  l'étiquette du haut, ex. « Ressource gratuite »
    keyword   (text, 2-12 car.)  le mot à commenter, en capitales, ex. « PROMPT »
    resource  (text, ≤ 44 car.)  ce qu'on reçoit, ex. « mon guide des 50 prompts »
  Durée : 4 à 8 s. Le mot-clé atteint sa taille finale à ~1,3 s.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-cta-ressource {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
        color: var(--white);
      }

      /* la lumière derrière la carte : une seule nappe, figée */
      #soc-cta-ressource .halo {
        position: absolute; left: 140px; top: 260px; width: 800px; height: 680px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(139, 92, 246, 0.28) 0%, transparent 70%);
        filter: blur(40px);
      }

      #soc-cta-ressource .card {
        position: absolute; left: 84px; right: 84px; top: 320px;
        padding: 56px 56px 60px;
        border-radius: 32px;
        background: rgba(14, 11, 26, 0.72);
        border: 1px solid rgba(167, 139, 250, 0.30);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 90px -30px rgba(139, 92, 246, 0.55);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }

      #soc-cta-ressource .badge {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 12px 26px; border-radius: 50px;
        background: rgba(139, 92, 246, 0.10); border: 1px solid rgba(139, 92, 246, 0.30);
        font-weight: var(--wt-semi); font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--jaune);
      }
      #soc-cta-ressource .badge .dot {
        width: 12px; height: 12px; border-radius: 50%; background: var(--ok);
        box-shadow: 0 0 0 6px rgba(92, 235, 173, 0.15);
      }

      #soc-cta-ressource .line {
        margin-top: 34px;
        font-weight: var(--wt-heavy); font-size: 72px; line-height: 1.05; letter-spacing: -0.03em;
      }

      /* la pilule de commentaire qui porte le mot-clé */
      #soc-cta-ressource .pill {
        margin-top: 26px;
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 420px; padding: 18px 48px 24px; border-radius: 28px;
        background: rgba(120, 80, 200, 0.10);
        border: 2px solid rgba(167, 139, 250, 0.45);
      }
      #soc-cta-ressource .keyword {
        font-weight: var(--wt-black); font-size: 150px; line-height: 1; letter-spacing: -0.02em;
        text-transform: uppercase; white-space: nowrap;
        background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
        color: transparent;
      }
      #soc-cta-ressource .keyword .ch {
        background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #soc-cta-ressource .caret {
        display: inline-block; width: 6px; height: 120px; margin-left: 8px;
        background: var(--jaune-soft); border-radius: 3px; opacity: 0;
      }

      #soc-cta-ressource .to {
        margin-top: 34px;
        font-weight: var(--wt-med); font-size: 44px; color: var(--text2); letter-spacing: -0.01em;
      }
      #soc-cta-ressource .resource {
        margin-top: 8px; max-width: 820px;
        font-weight: var(--wt-heavy); font-size: 58px; line-height: 1.12; letter-spacing: -0.03em;
        background: var(--grad-title); -webkit-background-clip: text; background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="soc-cta-ressource" data-composition-id="soc-cta-ressource" data-start="0" data-width="1080" data-height="1920">
      <div class="halo"></div>
      <div class="card">
        <div class="badge"><span class="dot"></span><span data-slot="badge">Ressource gratuite</span></div>
        <div class="line">Commente</div>
        <div class="pill"><span class="keyword" id="scr-typed"></span><span class="caret" id="scr-caret"></span></div>
        <div class="to">pour recevoir</div>
        <div class="resource" data-slot="resource">mon guide des 50 prompts</div>
      </div>
      <div style="display:none" data-slot="keyword" id="scr-kw">PROMPT</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-cta-ressource";
      const KW = document.getElementById("scr-kw").textContent.trim().toUpperCase();
      const typed = document.getElementById("scr-typed");
      /* une lettre = un span : la frappe se joue par des set(), sans
         callback, donc juste à n'importe quel instant où l'on seek */
      typed.innerHTML = KW.split("").map((c) => '<span class="ch">' + c + "</span>").join("");

      /* le mot-clé tient sur une ligne : la taille se règle sur sa longueur,
         calcul déterministe, aucune mesure du DOM */
      const size = KW.length <= 6 ? 150 : KW.length <= 8 ? 124 : KW.length <= 10 ? 104 : 88;
      typed.style.fontSize = size + "px";
      document.getElementById("scr-caret").style.height = Math.round(size * 0.8) + "px";

      const T0 = 0.75;                       /* début de la frappe */
      const STEP = 0.07;                     /* une lettre toutes les 70 ms */
      const TEND = T0 + STEP * KW.length;    /* fin de la frappe */

      const tl = gsap.timeline({ paused: true });
      typed.querySelectorAll(".ch").forEach((el, i) => tl.set(el, { display: "inline" }, T0 + STEP * (i + 1)));

      /* la carte sort d'un flou (entrée du titre de la charte de marque) */
      tl.from(root + " .halo", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0)
        .from(root + " .card", { autoAlpha: 0, y: 26, filter: "blur(14px)", duration: 0.6, ease: "expo.out" }, 0.05)
        .from(root + " .badge", { autoAlpha: 0, y: 20, duration: 0.45, ease: "expo.out" }, 0.25)
        .from(root + " .line", { autoAlpha: 0, y: 30, duration: 0.5, ease: "expo.out" }, 0.35)
        .from(root + " .pill", { autoAlpha: 0, scale: 0.9, duration: 0.45, ease: "back.out(1.8)" }, 0.5)

        /* le mot-clé se tape */
        .fromTo("#scr-caret", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "steps(1)", yoyo: true, repeat: 3 }, 0.55)
        .set("#scr-caret", { opacity: 1 }, T0)
        .set(root + " .ch", { display: "none" }, 0)
        .set("#scr-caret", { opacity: 0 }, TEND + 0.05)
        .set("#scr-caret", { display: "none" }, TEND + 0.05)

        /* puis il claque */
        .to(root + " .pill", { scale: 1.08, duration: 0.14, ease: "power2.out" }, TEND + 0.08)
        .to(root + " .pill", { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, TEND + 0.22)
        .to(root + " .pill", { borderColor: "rgba(196, 181, 253, 0.85)", duration: 0.2 }, TEND + 0.08)
        .to(root + " .pill", { borderColor: "rgba(167, 139, 250, 0.45)", duration: 0.6 }, TEND + 0.4)

        /* ce qu'on reçoit */
        .from(root + " .to", { autoAlpha: 0, y: 24, duration: 0.45, ease: "expo.out" }, TEND + 0.25)
        .from(root + " .resource", { autoAlpha: 0, y: 30, filter: "blur(10px)", duration: 0.6, ease: "expo.out" }, TEND + 0.38)

        /* entretien : seul le mot-clé respire, la carte dérive à peine */
        .to(root + " .pill", { scale: 1.035, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, TEND + 1.0)
        .to(root + " .card", { y: -10, duration: 5, ease: "sine.inOut" }, TEND + 0.6)

        .set({}, {}, 7);

      window.__timelines["soc-cta-ressource"] = tl;
    </script>
  </body>
</html>
