<!doctype html>
<!--
  HOUSE · social 9:16 · CHAT LIVE
  The "living UI" chat performance (deconstructed from nathanhodgson.ai):
  a mock AI-chat panel where the prompt TYPES ITSELF with a caret, the send
  button flashes jaune, the sent message jumps up, thinking dots pulse, then
  the reply streams in as shimmering skeleton lines. Occupies the top ~58%
  of the 9:16 frame; transparent below (talking-head shows through).
  Deterministic: typewriter is a GSAP counter, no Date.now / random.
  Slots: app (text), prompt (text ≤70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-chat-live {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-body);
      }
      #soc-chat-live .panel {
        position: absolute; top: 110px; left: 70px; right: 70px;
        background: #17191f; border-radius: 30px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }
      #soc-chat-live .glare {
        position: absolute; top: -20%; bottom: -20%; width: 34%; z-index: 5;
        background: var(--glare);
        transform: var(--glare-skew); pointer-events: none;
      }
      #soc-chat-live .head {
        display: flex; align-items: center; gap: 14px;
        padding: 26px 34px; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      #soc-chat-live .head .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--jaune); }
      #soc-chat-live .head .app {
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: 26px;
        letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85);
      }
      #soc-chat-live .thread { padding: 30px 34px 10px; min-height: 560px; }
      #soc-chat-live .sent {
        margin-left: 120px; margin-bottom: 26px;
        background: rgba(139, 92, 246, 0.14); border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 18px 18px 4px 18px; padding: 20px 24px;
        font-weight: var(--wt-semi); font-size: 30px; line-height: 1.35; color: #fff;
        visibility: hidden;
      }
      #soc-chat-live .dots { display: flex; gap: 10px; padding: 6px 4px 26px; visibility: hidden; }
      #soc-chat-live .dots span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.5); }
      #soc-chat-live .skel { display: flex; flex-direction: column; gap: 18px; }
      #soc-chat-live .skel .bar {
        height: 26px; border-radius: 8px; visibility: hidden;
        background: linear-gradient(90deg, rgba(255,255,255,0.10) 25%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.10) 75%);
        background-size: 220% 100%;
      }
      #soc-chat-live .skel .b1 { width: 92%; } #soc-chat-live .skel .b2 { width: 78%; }
      #soc-chat-live .skel .b3 { width: 88%; } #soc-chat-live .skel .b4 { width: 46%; }
      #soc-chat-live .inputbar {
        display: flex; align-items: center; gap: 18px;
        margin: 26px 34px 30px; padding: 22px 28px;
        background: #0e1015; border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
      }
      #soc-chat-live .typed {
        flex: 1; font-weight: var(--wt-med); font-size: 30px; color: #fff;
        white-space: nowrap; overflow: hidden; min-height: 40px;
      }
      #soc-chat-live .typed .caret {
        display: inline-block; width: 3px; height: 34px; background: #fff;
        vertical-align: -6px; margin-left: 2px;
      }
      #soc-chat-live .send {
        width: 56px; height: 56px; border-radius: 14px; flex: none;
        background: rgba(255, 255, 255, 0.12);
        display: flex; align-items: center; justify-content: center;
      }
      #soc-chat-live .send svg { width: 28px; height: 28px; }
    </style>
  </head>
  <body>
    <div id="soc-chat-live" data-composition-id="soc-chat-live" data-start="0" data-width="1080" data-height="1920">
      <div class="panel">
        <div class="glare"></div>
        <div class="head"><div class="dot"></div><div class="app" data-slot="app">CLAUDE · OPUS 5</div></div>
        <div class="thread">
          <div class="sent" id="scl-sent"></div>
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="skel">
            <div class="bar b1"></div><div class="bar b2"></div>
            <div class="bar b3"></div><div class="bar b4"></div>
          </div>
        </div>
        <div class="inputbar">
          <div class="typed"><span id="scl-text"></span><span class="caret"></span></div>
          <div class="send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>

      <div style="display:none" data-slot="prompt" id="scl-prompt">Crée-moi un plan de contenu pour 30 jours</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-chat-live";
      const PROMPT = document.getElementById("scl-prompt").textContent.trim();
      const textEl = document.getElementById("scl-text");
      const sentEl = document.getElementById("scl-sent");
      sentEl.textContent = PROMPT;

      const tl = gsap.timeline({ paused: true });

      /* panel in + glare sweep across it */
      tl.from(root + " .panel", { autoAlpha: 0, y: -60, duration: 0.5, ease: "expo.out" }, 0.1)
        .fromTo(root + " .glare", { xPercent: -160 }, { xPercent: 420, duration: 0.7, ease: "power2.inOut" }, 0.25)

        /* typewriter — deterministic counter drives the slice */
        .to({ n: 0 }, {
          n: PROMPT.length, duration: 2.0, ease: "none",
          onUpdate: function () {
            textEl.textContent = PROMPT.slice(0, Math.round(this.targets()[0].n));
          }
        }, 0.9)

        /* caret blinks the whole time (finite repeats) */
        .fromTo(root + " .caret", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "steps(1)", yoyo: true, repeat: 13 }, 0.9)

        /* send flash jaune + input empties + message appears up top */
        .to(root + " .send", { backgroundColor: "#8B5CF6", duration: 0.12, ease: "power2.in" }, 3.05)
        .to(root + " .send", { backgroundColor: "rgba(255,255,255,0.12)", duration: 0.3, ease: "power2.out" }, 3.25)
        .set(root + " .typed span:first-child", { textContent: "" }, 3.15)
        .fromTo(root + " .sent", { autoAlpha: 0, y: 24, visibility: "visible" },
          { autoAlpha: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 3.2)

        /* thinking dots pulse */
        .set(root + " .dots", { visibility: "visible" }, 3.5)
        .fromTo(root + " .dots span", { opacity: 0.25 },
          { opacity: 1, duration: 0.3, ease: "sine.inOut", stagger: 0.14, yoyo: true, repeat: 3 }, 3.5)

        /* reply streams in as shimmering skeleton lines */
        .fromTo(root + " .skel .bar", { autoAlpha: 0, y: 12, visibility: "visible" },
          { autoAlpha: 1, y: 0, visibility: "visible", duration: 0.35, ease: "power2.out", stagger: 0.22 }, 4.6)
        .to(root + " .skel .bar", { backgroundPosition: "-220% 0", duration: 1.8, ease: "none" }, 4.8)

        .set({}, {}, 8);

      window.__timelines["soc-chat-live"] = tl;
    </script>
  </body>
</html>
