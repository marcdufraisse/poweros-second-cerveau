<!doctype html>
<!--
  HIGGSFIELD · transition · PUSH PARALLAX
  Scene B pushes A off frame-left, but at 60% of B's speed and under a
  darkening shade — the depth trick AE editors use so a push doesn't read
  flat. B overshoots 26px and settles. Lime hairline rides B's leading edge.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-push-parallax {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA { position: absolute; inset: 0; background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneA .shade { position: absolute; inset: 0; background: #000; opacity: 0; }
      .sceneB {
        position: absolute; inset: 0; z-index: 3; background: var(--olive);
        border-left: 2px solid rgba(var(--lime-rgb), 0.8);
        box-shadow: -50px 0 100px rgba(0, 0, 0, 0.5);
      }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 4;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
    </style>
  </head>
  <body>
    <div id="tr-push-parallax" data-composition-id="tr-push-parallax" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"><div class="shade"></div></div>
      <div class="sceneB"><div class="tag">PUSH PARALLAX · DEPTH, SHADE, OVERSHOOT</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-push-parallax";
      const tl = gsap.timeline({ paused: true });

      tl.set(root + " .sceneB", { x: 1970 }, 0)

        /* B drives in hard, A retreats at 60% under a shade */
        .to(root + " .sceneB", { x: -26, duration: 0.55, ease: "power4.inOut" }, 1.2)
        .to(root + " .sceneA", { x: -1150, duration: 0.55, ease: "power4.inOut" }, 1.2)
        .to(root + " .sceneA .shade", { opacity: 0.55, duration: 0.4, ease: "power2.in" }, 1.25)

        /* the settle */
        .to(root + " .sceneB", { x: 0, duration: 0.3, ease: "power3.out" }, 1.75)

        .set({}, {}, 4);

      window.__timelines["tr-push-parallax"] = tl;
    </script>
  </body>
</html>
