<!doctype html>
<!--
  HIGGSFIELD · transition · PIP EXPAND
  The speaker PIP grows to full-bleed and becomes the next scene — the
  inverse of zoom-through. Scene A dims and scales back behind it (depth),
  the lime rim thins away as the PIP loses its "window" identity. Use when
  returning from a screen-share section back to the talking head.
  Slots: label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-pip-expand {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA { position: absolute; inset: 0; background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); transform-origin: 30% 40%; }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .pip {
        position: absolute; left: 1270px; top: 675px; width: 560px; height: 315px;
        z-index: 5; border-radius: var(--radius-pip); overflow: hidden;
        background: var(--olive);
        box-shadow: 0 0 0 2px rgba(var(--lime-rgb), 0.85),
                    0 0 40px rgba(var(--lime-rgb), 0.2),
                    0 36px 80px rgba(0, 0, 0, 0.55);
      }
      .pip::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .pip .plabel {
        position: absolute; left: 22px; bottom: 18px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-bold); font-size: 15px;
        letter-spacing: var(--track-pill); text-transform: uppercase;
        color: var(--charcoal); background: var(--lime); border-radius: 4px; padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <div id="tr-pip-expand" data-composition-id="tr-pip-expand" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"><div class="tag">PIP EXPAND · THE WINDOW BECOMES THE WORLD</div></div>
      <div class="pip"><div class="plabel" data-slot="label">SPEAKER</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-pip-expand";
      const tl = gsap.timeline({ paused: true });

      /* a breath at anchor, then the expansion: PIP -> full frame while A
         falls back; the label rides along and fades as the window wins */
      tl.to(root + " .pip", { y: -8, duration: 1.2, ease: "sine.inOut" }, 0.2)

        .to(root + " .pip", {
          left: 0, top: 0, width: 1920, height: 1080, borderRadius: 0,
          duration: 0.85, ease: "power3.inOut"
        }, 1.8)
        .to(root + " .sceneA", { scale: 0.94, opacity: 0.35, duration: 0.85, ease: "power3.inOut" }, 1.8)
        .to(root + " .pip .plabel", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.3)

        .set({}, {}, 4.4);

      window.__timelines["tr-pip-expand"] = tl;
    </script>
  </body>
</html>
