<!doctype html>
<!--
  HIGGSFIELD · transition · LETTERBOX CRUSH
  Cinematic blink: navy bars crush in from top and bottom, meet at center as
  a single lime hairline flash, the scene swaps behind closed lids, and the
  frame reopens on B. The heaviest beat in the kit — use for the biggest
  narrative pivots, once or twice per video.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-letterbox-crush {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .barT, .barB {
        position: absolute; left: 0; width: 1920px; height: 541px; z-index: 5;
        background: #01040A;
      }
      .barT { top: 0; transform-origin: 50% 0; transform: scaleY(0); }
      .barB { bottom: 0; transform-origin: 50% 100%; transform: scaleY(0); }
      .hairline {
        position: absolute; left: 0; top: 539px; width: 1920px; height: 2px; z-index: 6;
        background: var(--lime); box-shadow: 0 0 24px rgba(var(--lime-rgb), 0.8);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="tr-letterbox-crush" data-composition-id="tr-letterbox-crush" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"><div class="tag">LETTERBOX CRUSH · THE BLINK, FOR THE BIG PIVOTS</div></div>
      <div class="sceneB"></div>
      <div class="barT"></div>
      <div class="barB"></div>
      <div class="hairline"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-letterbox-crush";
      const tl = gsap.timeline({ paused: true });

      /* crush closed */
      tl.to(root + " .barT", { scaleY: 1, duration: 0.38, ease: "power3.in" }, 1.2)
        .to(root + " .barB", { scaleY: 1, duration: 0.38, ease: "power3.in" }, 1.2)
        .to(root + " .hairline", { opacity: 1, duration: 0.1, ease: "power1.in" }, 1.5)

        /* swap behind closed lids */
        .set(root + " .sceneA", { visibility: "hidden" }, 1.62)
        .set(root + " .sceneB", { visibility: "visible" }, 1.62)

        /* reopen */
        .to(root + " .hairline", { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.75)
        .to(root + " .barT", { scaleY: 0, duration: 0.5, ease: "power3.out" }, 1.75)
        .to(root + " .barB", { scaleY: 0, duration: 0.5, ease: "power3.out" }, 1.75)

        .set({}, {}, 4.2);

      window.__timelines["tr-letterbox-crush"] = tl;
    </script>
  </body>
</html>
