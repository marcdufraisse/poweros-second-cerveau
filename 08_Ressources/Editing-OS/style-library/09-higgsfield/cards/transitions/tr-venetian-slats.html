<!doctype html>
<!--
  HIGGSFIELD · transition · VENETIAN SLATS
  Four vertical slats of the next scene drop in staggered (70ms apart,
  expo.out) like AE mask reveals, lime hairlines on the leading edges. Once
  the frame is covered the real scene B swaps in underneath and the slats
  dissolve — the seams never linger.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-venetian-slats {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .slats { position: absolute; inset: 0; z-index: 5; }
      .slat {
        position: absolute; top: 0; width: 480px; height: 1080px;
        background: var(--olive);
        border-left: 1.5px solid rgba(var(--lime-rgb), 0.55);
        box-shadow: -20px 0 44px rgba(0, 0, 0, 0.4);
      }
      .slat::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .s1 { left: 0; } .s2 { left: 480px; } .s3 { left: 960px; } .s4 { left: 1440px; }
    </style>
  </head>
  <body>
    <div id="tr-venetian-slats" data-composition-id="tr-venetian-slats" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"></div>
      <div class="sceneB"></div>
      <div class="tag">VENETIAN SLATS · STAGGERED MASK DROP</div>
      <div class="slats">
        <div class="slat s1"></div><div class="slat s2"></div><div class="slat s3"></div><div class="slat s4"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-venetian-slats";
      const tl = gsap.timeline({ paused: true });

      tl.set(root + " .slat", { y: -1140 }, 0)

        /* staggered drop, expo — each slat lands hard */
        .to(root + " .slat", { y: 0, duration: 0.45, ease: "expo.out", stagger: 0.07 }, 1.2)

        /* covered: swap the real scene under, dissolve the slats */
        .set(root + " .sceneA", { visibility: "hidden" }, 1.95)
        .set(root + " .sceneB", { visibility: "visible" }, 1.95)
        .to(root + " .slats", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.05)

        .set({}, {}, 4.2);

      window.__timelines["tr-venetian-slats"] = tl;
    </script>
  </body>
</html>
