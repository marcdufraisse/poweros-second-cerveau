<!doctype html>
<!--
  HIGGSFIELD · transition · PANEL SLIDE
  The over-the-shoulder context swap (ref: v3 split-screen panels sliding over
  the speaker). A lime-rimmed media panel slides in from frame-right
  (expo.out), drifts while alive, then slides back out. The base scene never
  cuts — the panel IS the b-roll. In assembly the panel body holds real
  footage; here it holds a placeholder.
  Slots: label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-panel-slide {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA { position: absolute; inset: 0; background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }

      .panel { position: absolute; right: 90px; top: 130px; z-index: 5; }
      .panel .frame {
        width: 980px; height: 560px; border-radius: var(--radius);
        overflow: hidden; position: relative;
        background: var(--olive);
        box-shadow: 0 0 0 2px rgba(var(--lime-rgb), 0.85),
                    0 0 44px rgba(var(--lime-rgb), 0.22),
                    0 40px 90px rgba(0, 0, 0, 0.55);
        transform: var(--glass-tilt);
      }
      .panel .frame::after {
        content: ""; position: absolute; inset: 0;
        background-image: var(--dot-grid); background-size: var(--dot-grid-size);
      }
      .panel .label {
        position: absolute; left: 26px; bottom: 22px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-pill);
        text-transform: uppercase; color: var(--charcoal);
        background: var(--lime); border-radius: 4px; padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <div id="tr-panel-slide" data-composition-id="tr-panel-slide" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"></div>
      <div class="tag">PANEL SLIDE · THE B-ROLL COMES TO YOU</div>
      <div class="panel">
        <div class="frame"><div class="label" data-slot="label">GENERATED IN HIGGSFIELD</div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-panel-slide";
      const tl = gsap.timeline({ paused: true });

      /* in from right, alive with drift, out to the right */
      tl.set(root + " .panel", { x: 1300 }, 0)
        .to(root + " .panel", { x: 0, duration: 0.6, ease: "expo.out" }, 0.8)
        .to(root + " .panel", { y: -10, rotation: -0.5, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4)
        .to(root + " .panel", { x: 1300, duration: 0.45, ease: "power3.in" }, 4.6)
        .set({}, {}, 5.5);

      window.__timelines["tr-panel-slide"] = tl;
    </script>
  </body>
</html>
