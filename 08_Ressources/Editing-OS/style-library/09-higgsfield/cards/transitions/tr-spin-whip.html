<!doctype html>
<!--
  HIGGSFIELD · transition · SPIN WHIP
  Rotational whip: the camera snaps -9deg with a scale punch and heavy blur,
  the cut lands at peak blur, and the next scene un-spins from +9deg back to
  level. The rotation direction carries through the cut (out CCW, in CCW),
  which is what sells it as one continuous camera move.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-spin-whip {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .cam { position: absolute; inset: 0; will-change: transform, filter; }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
    </style>
  </head>
  <body>
    <div id="tr-spin-whip" data-composition-id="tr-spin-whip" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <div class="sceneA"></div>
        <div class="sceneB"></div>
        <div class="tag">SPIN WHIP · ROTATION CARRIES THROUGH THE CUT</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-spin-whip";
      const tl = gsap.timeline({ paused: true });

      /* out: spin CCW into blur */
      tl.to(root + " .cam", { rotation: -9, scale: 1.3, duration: 0.3, ease: "power3.in" }, 1.2)
        .to(root + " .cam", { filter: "blur(22px)", duration: 0.3, ease: "power2.in" }, 1.2)

        /* the cut at peak blur: flip the world to +9 so the un-spin continues CCW */
        .set(root + " .sceneA", { visibility: "hidden" }, 1.5)
        .set(root + " .sceneB", { visibility: "visible" }, 1.5)
        .set(root + " .cam", { rotation: 9 }, 1.5)

        /* in: settle to level, blur clears */
        .to(root + " .cam", { rotation: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 1.5)
        .to(root + " .cam", { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 1.55)

        .set({}, {}, 4);

      window.__timelines["tr-spin-whip"] = tl;
    </script>
  </body>
</html>
