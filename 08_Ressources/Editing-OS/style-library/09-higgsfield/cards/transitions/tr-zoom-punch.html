<!doctype html>
<!--
  HIGGSFIELD · transition · ZOOM PUNCH
  Crash-zoom out of scene A / crash-zoom into scene B. Scale punches to 1.55
  with blur and a 1.5deg rotation kiss (dead-straight zooms read robotic),
  cut at peak, B lands from 1.4 and settles to 1. The AE "punch-in transition"
  with the rotation micro-detail pros add by hand.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-zoom-punch {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .cam { position: absolute; inset: 0; transform-origin: 50% 46%; will-change: transform, filter; }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
    </style>
  </head>
  <body>
    <div id="tr-zoom-punch" data-composition-id="tr-zoom-punch" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <div class="sceneA"></div>
        <div class="sceneB"></div>
        <div class="tag">ZOOM PUNCH · CRASH IN, CUT AT PEAK, SETTLE OUT</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-zoom-punch";
      const tl = gsap.timeline({ paused: true });

      tl.to(root + " .cam", { scale: 1.55, rotation: 1.5, duration: 0.32, ease: "power3.in" }, 1.2)
        .to(root + " .cam", { filter: "blur(16px)", duration: 0.32, ease: "power2.in" }, 1.2)

        .set(root + " .sceneA", { visibility: "hidden" }, 1.52)
        .set(root + " .sceneB", { visibility: "visible" }, 1.52)
        .set(root + " .cam", { scale: 1.4, rotation: -1.5 }, 1.52)

        .to(root + " .cam", { scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" }, 1.52)
        .to(root + " .cam", { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 1.56)

        .set({}, {}, 4);

      window.__timelines["tr-zoom-punch"] = tl;
    </script>
  </body>
</html>
