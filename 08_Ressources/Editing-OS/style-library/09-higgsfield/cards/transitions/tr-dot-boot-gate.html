<!doctype html>
<!--
  HIGGSFIELD · transition · DOT BOOT GATE
  The stage-boot card used as a section gate: an olive LED-dot shutter snaps
  over the frame (blur resolve, lime glow pulse), the scene swaps behind it,
  the shutter dissolves off. This is the "chapter turn" between sections —
  heavier than a wipe, still fast (~1.4s covered).
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-dot-boot-gate {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }

      .gate { position: absolute; inset: 0; z-index: 5; opacity: 0; }
      .gate .fill { position: absolute; inset: 0; background: var(--olive); }
      .gate .bokeh {
        position: absolute; inset: -6%; width: 112%; height: 112%;
        background: var(--olive-bokeh); filter: blur(46px);
      }
      .gate .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(214, 253, 3, 0.16) 1.6px, transparent 1.8px);
        background-size: var(--dot-grid-size);
      }
      .gate .glow {
        position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(58% 58% at 50% 50%, rgba(var(--lime-rgb), 0.14) 0%, transparent 70%);
      }
    </style>
  </head>
  <body>
    <div id="tr-dot-boot-gate" data-composition-id="tr-dot-boot-gate" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"></div>
      <div class="sceneB"></div>
      <div class="tag">DOT BOOT GATE · THE CHAPTER TURN</div>
      <div class="gate">
        <div class="fill"></div>
        <div class="bokeh"></div>
        <div class="dots"></div>
        <div class="glow"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-dot-boot-gate";
      const tl = gsap.timeline({ paused: true });

      /* shutter resolves on (blur 10 -> 0), lime glow pulses once while the
         scene swaps behind it, shutter dissolves off */
      tl.fromTo(root + " .gate",
          { opacity: 0, filter: "blur(10px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 1.2)
        .to(root + " .gate .glow", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.55)
        .to(root + " .gate .glow", { opacity: 0, duration: 0.4, ease: "power2.in" }, 1.9)

        .set(root + " .sceneA", { visibility: "hidden" }, 1.8)
        .set(root + " .sceneB", { visibility: "visible" }, 1.8)

        .to(root + " .gate", { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 2.5)

        .set({}, {}, 4.5);

      window.__timelines["tr-dot-boot-gate"] = tl;
    </script>
  </body>
</html>
