<!doctype html>
<!--
  HIGGSFIELD · transition · ZOOM THROUGH
  The camera dives INTO a glass media panel until it becomes the next scene
  (ref: v1 UI zoom-pans, v3 panel grids). Panel scales up from its anchored
  spot to full-bleed (power3.inOut), scene A parallax-scales behind it, and
  the moment the panel fills the frame it IS scene B. The smoothest move in
  the kit — one continuous zoom, cut invisible at full cover.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-zoom-through {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA { position: absolute; inset: 0; background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); transform-origin: 72% 62%; }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }

      /* the destination panel: anchored bottom-right like their video panels;
         scales up to swallow the frame. Body = scene B (olive demo). */
      .panel {
        position: absolute; left: 1050px; top: 560px; width: 640px; height: 360px;
        z-index: 5; border-radius: var(--radius); overflow: hidden;
        background: var(--olive);
        box-shadow: 0 0 0 2px rgba(var(--lime-rgb), 0.85),
                    0 0 44px rgba(var(--lime-rgb), 0.2),
                    0 40px 90px rgba(0, 0, 0, 0.55);
        transform-origin: 50% 50%;
      }
      .panel::after {
        content: ""; position: absolute; inset: 0;
        background-image: var(--dot-grid); background-size: var(--dot-grid-size);
      }
      .panel .blabel {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: 16px;
        letter-spacing: var(--track-pill); text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="tr-zoom-through" data-composition-id="tr-zoom-through" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"></div>
      <div class="tag">ZOOM THROUGH · DIVE INTO THE PANEL</div>
      <div class="panel"><div class="blabel">SCENE B LIVES IN HERE</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-zoom-through";
      const tl = gsap.timeline({ paused: true });

      /* panel pops in at its anchor, holds a beat, then the dive:
         panel -> full frame while scene A falls away behind it */
      tl.from(root + " .panel", { autoAlpha: 0, y: 60, duration: 0.5, ease: "expo.out" }, 0.7)

        .to(root + " .panel", {
          left: 0, top: 0, width: 1920, height: 1080, borderRadius: 0,
          duration: 0.9, ease: "power3.inOut"
        }, 2.0)
        .to(root + " .sceneA", { scale: 1.18, opacity: 0.4, duration: 0.9, ease: "power3.inOut" }, 2.0)
        .to(root + " .tag", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.1)

        .set({}, {}, 4.5);

      window.__timelines["tr-zoom-through"] = tl;
    </script>
  </body>
</html>
