<!doctype html>
<!--
  HIGGSFIELD · tier2 · list · NUMBERED
  The beside-the-head numbered list: items pop in one at a time, each entering
  grey-pre and flipping to lime when its successor lands. Perspective tilt +
  dark rim so it sits in the room. Right-side anchor, face-safe.
  Slots: i1, i2, i3 (leave i3 empty for a 2-item list).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-list-numbered {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-list-numbered .block {
        position: absolute; top: 230px; right: 150px; z-index: 3;
      }
      #t2-list-numbered .tilt {
        display: flex; flex-direction: column; align-items: flex-start; gap: 24px;
        transform: var(--kinetic-tilt); /* static 3D tilt; GSAP moves .block */
      }
      #t2-list-numbered .item {
        display: flex; align-items: baseline; gap: 16px;
        font-weight: var(--wt-heavy); font-size: 44px; line-height: 1;
        letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--grey-pre); text-shadow: var(--kinetic-shadow);
      }
      #t2-list-numbered .item .num { font-weight: var(--wt-bold); font-size: 0.7em; }
    </style>
  </head>
  <body>
    <div id="t2-list-numbered" data-composition-id="t2-list-numbered" data-start="0" data-width="1920" data-height="1080">
      <div class="block"><div class="tilt">
        <div class="item"><span class="num">1.</span><span data-slot="i1">SETUP</span></div>
        <div class="item"><span class="num">2.</span><span data-slot="i2">IDEA</span></div>
        <div class="item"><span class="num">3.</span><span data-slot="i3">GENERATION</span></div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-list-numbered";
      const css = getComputedStyle(document.documentElement);
      const LIME = css.getPropertyValue("--lime").trim();

      /* drop empty trailing items */
      const items = gsap.utils.toArray(root + " .item").filter((it) => {
        const has = it.querySelector("[data-slot]").textContent.trim().length > 0;
        if (!has) it.style.display = "none";
        return has;
      });

      const tl = gsap.timeline({ paused: true });
      const beat = 0.9;

      items.forEach((item, i) => {
        const t = 0.15 + i * beat;
        tl.from(item, { autoAlpha: 0, x: 40, duration: 0.42, ease: "expo.out" }, t);
        /* flip when the next item lands; last item flips one beat later */
        tl.to(item, { color: LIME, duration: 0.22, ease: "power2.inOut" }, t + beat);
      });

      tl.to(root + " .block", { y: -7, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.5)
        .set({}, {}, Math.max(6, 0.15 + items.length * beat + 1.5));

      window.__timelines["t2-list-numbered"] = tl;
    </script>
  </body>
</html>
