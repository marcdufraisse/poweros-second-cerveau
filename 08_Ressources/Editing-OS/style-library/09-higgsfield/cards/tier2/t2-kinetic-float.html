<!doctype html>
<!--
  HIGGSFIELD · tier2 · label · KINETIC FLOAT
  The in-room lime caps: 1-2 short lines floating beside the speaker's head
  (right side), perspective-tilted with a dark rim. Words reveal staged -
  line 1 enters white-grey, flips to lime as line 2 arrives, line 2 flips
  right after. Whole block micro-drifts while alive.
  Slots: line1, line2 (leave line2 empty for a single-line float).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-kinetic-float {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-kinetic-float .block {
        position: absolute; top: 210px; right: 130px; z-index: 3;
      }
      #t2-kinetic-float .tilt {
        display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
        transform: var(--kinetic-tilt); /* static 3D tilt lives here; GSAP moves .block */
      }
      #t2-kinetic-float .line {
        font-weight: var(--wt-heavy); font-size: var(--size-headline); line-height: 1.06;
        letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--grey-pre); text-shadow: var(--kinetic-shadow);
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div id="t2-kinetic-float" data-composition-id="t2-kinetic-float" data-start="0" data-width="1920" data-height="1080">
      <div class="block"><div class="tilt">
        <div class="line l1" data-slot="line1">AUTOMATE</div>
        <div class="line l2" data-slot="line2">CONTENT</div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-kinetic-float";
      const css = getComputedStyle(document.documentElement);
      const LIME = css.getPropertyValue("--lime").trim();

      const l2 = document.querySelector(root + " .l2");
      const hasL2 = l2.textContent.trim().length > 0;

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .l1", { autoAlpha: 0, y: 22, duration: 0.4, ease: "expo.out" }, 0.1);

      if (hasL2) {
        tl.from(root + " .l2", { autoAlpha: 0, y: 22, duration: 0.4, ease: "expo.out" }, 0.5)
          .to(root + " .l1", { color: LIME, duration: 0.22, ease: "power2.inOut" }, 0.55)
          .to(root + " .l2", { color: LIME, duration: 0.22, ease: "power2.inOut" }, 0.85);
      } else {
        tl.to(root + " .l1", { color: LIME, duration: 0.22, ease: "power2.inOut" }, 0.55);
      }

      /* micro-drift while alive (block only - the text itself never drifts
         relative to the block) */
      tl.to(root + " .block", { y: -8, rotation: 0.5, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.6)
        .set({}, {}, 6.5);

      window.__timelines["t2-kinetic-float"] = tl;
    </script>
  </body>
</html>
