<!doctype html>
<!--
  HIGGSFIELD · tier1 · section · STEP MEGA
  The navy step card: wide-tracked eyebrow ("STEP 1:") above one mega word
  ("SETUP"). Text enters at grey-pre and snaps to full white (the flip).
  Diagonal streaks + warm glow creeping into the bottom-right + vignette.
  Slots: kicker, title.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t1-step-mega {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%);
        overflow: hidden; font-family: var(--font-display);
      }
      #t1-step-mega .streaks { position: absolute; inset: 0; background: var(--streaks); }
      #t1-step-mega .warm    { position: absolute; inset: 0; background: var(--warm-creep); opacity: 0; }
      #t1-step-mega .vig     { position: absolute; inset: 0; background: var(--vignette); }

      #t1-step-mega .wrap {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px; z-index: 2;
      }
      #t1-step-mega .kicker {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-eyebrow);
        text-transform: uppercase; color: var(--grey-pre);
      }
      #t1-step-mega .title {
        font-weight: var(--wt-black); font-size: var(--size-mega); line-height: 0.95;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--grey-pre); text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="t1-step-mega" data-composition-id="t1-step-mega" data-start="0" data-width="1920" data-height="1080">
      <div class="streaks"></div>
      <div class="warm"></div>
      <div class="vig"></div>
      <div class="wrap">
        <div class="kicker" data-slot="kicker">STEP 1:</div>
        <div class="title" data-slot="title">SETUP</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-step-mega";
      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .kicker", { autoAlpha: 0, y: 18, duration: 0.4, ease: "expo.out" }, 0.1)
        .from(root + " .title",  { autoAlpha: 0, y: 46, duration: 0.5, ease: "expo.out" }, 0.22)

        /* the flip — grey-pre snaps to full white, kicker first */
        .to(root + " .kicker", { color: "rgba(255,255,255,0.85)", duration: 0.22, ease: "power2.inOut" }, 0.62)
        .to(root + " .title",  { color: "#FFFFFF", duration: 0.22, ease: "power2.inOut" }, 0.72)

        /* warm practical-light spill creeps in late */
        .to(root + " .warm", { opacity: 1, duration: 1.6, ease: "sine.inOut" }, 1.0)

        .set({}, {}, 4);

      window.__timelines["t1-step-mega"] = tl;
    </script>
  </body>
</html>
