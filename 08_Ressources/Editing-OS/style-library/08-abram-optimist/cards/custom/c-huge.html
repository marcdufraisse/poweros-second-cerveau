<!doctype html>
<!--
  ABRAM OPTIMIST · custom · verdict · HUGE
  Full-screen takeover. The title-drop moment: "Huge." pops in first in solid
  Manrope ink, then "If true." pops in beneath it as THE prism moment — a
  gradient-clipped word whose gradient pans once — with a light-leak flare
  sweeping the frame at that second pop. A small white chip with a mono
  caveat line pops in beneath to ground the claim.
  Slots: word1, word2, caveat.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-huge {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #c-huge .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      #c-huge .word1 {
        font-weight: var(--wt-black); font-size: 220px;
        letter-spacing: var(--track-tight); line-height: 1;
        color: var(--ink);
      }

      /* THE prism word — gradient-clipped, pans once. No will-change. */
      #c-huge .word2 {
        font-weight: var(--wt-black); font-size: 220px;
        letter-spacing: var(--track-tight); line-height: 1;
        padding: 0 20px; margin-top: -6px;
        background-image: var(--prism);
        background-size: 220% 100%; background-position: 0% 50%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      #c-huge .chip {
        margin-top: 56px;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        background: var(--white); color: var(--ink-soft);
        border-radius: var(--radius-pill);
        box-shadow: var(--lift);
        padding: 16px 36px 18px;
      }

      /* light-leak flare band */
      #c-huge .flare {
        position: absolute; top: -10%; bottom: -10%; left: 0; width: 60%;
        background: var(--flare);
        transform: skewX(-14deg) translateX(-140%);
        z-index: 6; pointer-events: none;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div id="c-huge" data-composition-id="c-huge" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="word1" data-slot="word1">Huge.</div>
        <div class="word2" data-slot="word2">If true.</div>
        <div class="chip" data-slot="caveat">[ pending independent verification ]</div>
      </div>

      <div class="flare"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-huge";

      tl.from(root + " .word1", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.25)

        /* second pop — the prism word */
        .from(root + " .word2", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.75)

        /* flare sweeps at the second pop's peak */
        .to(root + " .flare", { xPercent: 420, duration: 0.75, ease: "power2.inOut" }, 0.9)

        /* THE prism pan — light moves through the word once */
        .to(root + " .word2", { backgroundPosition: "100% 50%", duration: 1.2, ease: "power2.inOut" }, 1.0)

        /* caveat chip pops beneath */
        .from(root + " .chip", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 2.15)

        /* one gentle bob on the chip, finite */
        .to(root + " .chip", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.75)

        .set({}, {}, 8);

      window.__timelines["c-huge"] = tl;
    </script>
  </body>
</html>
