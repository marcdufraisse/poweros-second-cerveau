<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · overview · TRIO
  Full-screen takeover. A friendly Manrope headline sits above three floating
  white cards popping in staggered left-to-right, each carrying a big faint
  numeral, a bold mini-headline and one line of Inter copy. The middle card
  carries THE prism moment: a thin gradient bar across its top edge that
  reveals once the row has landed.
  Slots: title, h1, b1, h2, b2, h3, b3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-trio {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-overview-trio .wash {
        position: absolute; bottom: -260px; left: -220px;
        width: 1000px; height: 820px; border-radius: 50%;
        background: var(--prism-wash);
        filter: blur(70px);
      }

      #t1-overview-trio .title {
        position: absolute; top: 108px; left: 0; right: 0;
        text-align: center;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); color: var(--ink);
      }

      #t1-overview-trio .row {
        position: absolute; top: 320px; left: 160px; right: 160px; bottom: 130px;
        display: flex; flex-direction: row; gap: 44px;
        z-index: 3;
      }

      #t1-overview-trio .card {
        position: relative; flex: 1 1 0;
        background: var(--white); border-radius: var(--radius);
        box-shadow: var(--lift);
        padding: 56px 48px 48px;
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* THE prism moment — a thin bar across the middle card's top edge */
      #t1-overview-trio .card--mid .prism-bar {
        position: absolute; top: 0; left: 0; right: 0; height: 10px;
        background-image: var(--prism); background-size: 220% 100%;
        background-position: 0% 50%;
        transform: scaleX(0); transform-origin: left center;
      }

      #t1-overview-trio .num {
        font-weight: var(--wt-black); font-size: 118px;
        letter-spacing: var(--track-tight); color: var(--ink-faint);
        line-height: 1; margin-bottom: 18px;
      }

      #t1-overview-trio .h {
        font-weight: var(--wt-bold); font-size: 42px;
        letter-spacing: var(--track-tight); line-height: 1.16;
        color: var(--ink); margin-bottom: 20px;
      }

      #t1-overview-trio .b {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-trio" data-composition-id="t1-overview-trio" data-start="0" data-width="1920" data-height="1080">
      <div class="wash"></div>

      <div class="title" data-slot="title">Three ways members learn to build</div>

      <div class="row">
        <div class="card card--1">
          <div class="num">01</div>
          <div class="h" data-slot="h1">Watch a real build</div>
          <div class="b" data-slot="b1">Follow a working agent from blank page to shipped tool.</div>
        </div>
        <div class="card card--mid">
          <div class="prism-bar"></div>
          <div class="num">02</div>
          <div class="h" data-slot="h2">Rebuild it yourself</div>
          <div class="b" data-slot="b2">Guided modules turn watching into doing, one step at a time.</div>
        </div>
        <div class="card card--3">
          <div class="num">03</div>
          <div class="h" data-slot="h3">Ship it to your team</div>
          <div class="b" data-slot="b3">Every path ends with something live, not just a certificate.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-trio";

      tl.from(root + " .wash", { autoAlpha: 0, scale: 0.85, transformOrigin: "20% 80%", duration: 1.1, ease: "power2.out" }, 0)

        .from(root + " .title", { autoAlpha: 0, y: 30, duration: 0.6, ease: "expo.out" }, 0.2)

        /* three cards POP in, staggered */
        .from(root + " .card--1", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.75)
        .from(root + " .card--mid", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.92)
        .from(root + " .card--3", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 1.09)

        /* THE prism bar reveals once, after the row has landed — sweeps in then pans */
        .to(root + " .card--mid .prism-bar", { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.55)
        .to(root + " .card--mid .prism-bar", { backgroundPosition: "100% 50%", duration: 1.0, ease: "power2.inOut" }, 2.05)

        /* one gentle bob, finite, on the middle card only */
        .to(root + " .card--mid", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.6)

        .set({}, {}, 8);

      window.__timelines["t1-overview-trio"] = tl;
    </script>
  </body>
</html>
