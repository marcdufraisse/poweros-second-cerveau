<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · overview · PATH
  Full-screen takeover. Title sits top-left; a thick rounded ink line draws
  itself left-to-right in gentle curves across the lower half of the frame.
  Three circle nodes pop in along the line as it draws, each with a mono
  label chip alternating above/below; the final node fills with the
  functional brand-blue accent to mark "you are here."
  Slots: title, n1, n2, n3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-path {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-overview-path .title {
        position: absolute; top: 120px; left: 150px;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); color: var(--ink);
        max-width: 900px; line-height: 1.1;
      }

      #t1-overview-path svg {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
      }

      #t1-overview-path .track {
        fill: none; stroke: var(--ink); stroke-opacity: 0.10;
        stroke-width: 22; stroke-linecap: round;
      }

      #t1-overview-path .line {
        fill: none; stroke: var(--ink);
        stroke-width: 22; stroke-linecap: round;
      }

      #t1-overview-path .node {
        fill: var(--white); stroke: var(--ink); stroke-width: 8;
        transform-box: fill-box; transform-origin: center;
      }

      #t1-overview-path .node--final {
        fill: var(--accent); stroke: var(--accent);
      }

      /* static anchor — never animated, keeps the chip centered on its point */
      #t1-overview-path .chip-anchor {
        position: absolute; transform: translate(-50%, -50%);
      }

      /* animated chip body — GSAP owns scale/opacity here only */
      #t1-overview-path .chip {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase; white-space: nowrap;
        background: var(--white); color: var(--ink);
        border-radius: var(--radius-pill);
        box-shadow: var(--lift);
        padding: 12px 28px 13px;
      }

      #t1-overview-path .chip--final {
        background: var(--ink); color: var(--white);
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-path" data-composition-id="t1-overview-path" data-start="0" data-width="1920" data-height="1080">
      <div class="title" data-slot="title">Your path through certification</div>

      <svg viewBox="0 0 1920 1080">
        <path class="track" d="M 130 640 C 480 560, 620 840, 960 780 S 1500 620, 1800 700" />
        <path class="line" d="M 130 640 C 480 560, 620 840, 960 780 S 1500 620, 1800 700" pathLength="1000" />

        <circle class="node node--1" cx="130" cy="640" r="22" />
        <circle class="node node--2" cx="960" cy="780" r="22" />
        <circle class="node node--3 node--final" cx="1800" cy="700" r="26" />
      </svg>

      <div class="chip-anchor" style="left: 130px; top: 550px;">
        <div class="chip chip--1" data-slot="n1">Learn the basics</div>
      </div>
      <div class="chip-anchor" style="left: 960px; top: 872px;">
        <div class="chip chip--2" data-slot="n2">Build with agents</div>
      </div>
      <div class="chip-anchor" style="left: 1800px; top: 605px;">
        <div class="chip chip--3 chip--final" data-slot="n3">Get certified</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-path";

      gsap.set(root + " .line", { strokeDasharray: 1000, strokeDashoffset: 1000 });
      gsap.set(root + " .node", { scale: 0, autoAlpha: 0 });
      gsap.set(root + " .chip", { scale: 0.6, autoAlpha: 0 });

      tl.from(root + " .title", { autoAlpha: 0, y: 30, duration: 0.6, ease: "expo.out" }, 0)

        /* the line draws itself left-to-right */
        .to(root + " .line", { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, 0.5)

        /* nodes pop in as the line reaches them */
        .to(root + " .node--1", { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.6)
        .to(root + " .chip--1", { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.65)

        .to(root + " .node--2", { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.7)" }, 1.3)
        .to(root + " .chip--2", { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 1.35)

        .to(root + " .node--3", { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.7)" }, 2.0)
        .to(root + " .chip--3", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 2.05)

        /* one gentle bob on the final "you are here" node */
        .to(root + " .node--3", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.7)

        .set({}, {}, 8);

      window.__timelines["t1-overview-path"] = tl;
    </script>
  </body>
</html>
