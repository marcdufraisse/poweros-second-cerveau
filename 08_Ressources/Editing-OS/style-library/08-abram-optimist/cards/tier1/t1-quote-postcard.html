<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · quote · POSTCARD
  Full-screen takeover. Warm off-white stage; a light-leak flare sweeps
  once behind a slightly rotated white postcard (--lift, --radius,
  -1.5deg) that pops in center. The quote sits in Manrope on the card;
  a hand-level mono attribution line rests bottom-right of the card; a
  tiny --sun square tick marks the top-left corner. No prism moment on
  this card — the flare carries the energy instead.
  Slots: quote, attrib.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-postcard {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-quote-postcard .card {
        position: absolute; left: 50%; top: 50%;
        width: 1200px; padding: 96px 104px 88px;
        background: var(--white); border-radius: var(--radius);
        box-shadow: var(--lift);
        transform: translate(-50%, -50%) rotate(-1.5deg);
        z-index: 4;
      }

      #t1-quote-postcard .sun {
        position: absolute; top: -20px; left: -20px;
        width: 44px; height: 44px; border-radius: 8px;
        background: var(--sun);
        transform: rotate(8deg);
      }

      #t1-quote-postcard .quote {
        font-weight: var(--wt-semi); font-size: 54px;
        letter-spacing: var(--track-tight); line-height: 1.32;
        color: var(--ink);
      }

      #t1-quote-postcard .attrib {
        margin-top: 46px; text-align: right;
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-mono); color: var(--ink-soft);
      }

      /* light-leak flare band, swept once behind the card */
      #t1-quote-postcard .flare {
        position: absolute; top: -10%; bottom: -10%; left: 0; width: 60%;
        background: var(--flare);
        transform: skewX(-14deg) translateX(-140%);
        z-index: 2; pointer-events: none;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-postcard" data-composition-id="t1-quote-postcard" data-start="0" data-width="1920" data-height="1080">
      <div class="flare"></div>

      <div class="card">
        <div class="sun"></div>
        <div class="quote" data-slot="quote">The certification didn't just teach me AI. It gave me a business.</div>
        <div class="attrib" data-slot="attrib">Maya Chen, automation lead</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-quote-postcard";

      tl
        /* the postcard POPS, holding its -1.5deg tilt (set in CSS, untouched here) */
        .from(root + " .card", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.2)

        /* the flare sweeps once behind the card at its peak */
        .to(root + " .flare", { xPercent: 420, duration: 0.8, ease: "power2.inOut" }, 0.55)

        /* the sun tick snaps in */
        .from(root + " .sun", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(1.7)" }, 0.6)

        /* quote rises and settles inside the card */
        .from(root + " .quote", { autoAlpha: 0, y: 24, duration: 0.6, ease: "expo.out" }, 0.75)

        /* attribution settles bottom-right */
        .from(root + " .attrib", { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out" }, 1.15)

        /* one gentle bob on the whole card, finite */
        .to(root + " .card", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-quote-postcard"] = tl;
    </script>
  </body>
</html>
