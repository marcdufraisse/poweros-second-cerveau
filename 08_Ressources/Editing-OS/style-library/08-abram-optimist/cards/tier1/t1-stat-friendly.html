<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · stat · FRIENDLY
  Full-screen takeover. Warm off-white stage; a mono tape-deck pill kicker
  pops in above; a giant Manrope 800 count-up number fills the center —
  the number itself IS the prism moment (gradient-clipped, panning once);
  a sentence-case label rises below it; a tiny mono footnote sits at the
  very bottom. No card, no chip — just big friendly type on air.
  Slots: kicker, stat, label, foot.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-friendly {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-friendly .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* tape-deck pill kicker */
      #t1-stat-friendly .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 12px 30px 14px; margin-bottom: 40px;
      }

      /* the mega number — THE prism moment, clipped + panning */
      #t1-stat-friendly .stat {
        font-weight: var(--wt-black); font-size: var(--size-mega);
        letter-spacing: var(--track-tight); line-height: 1;
        padding: 0 24px;
        background-image: var(--prism);
        background-size: 220% 100%; background-position: 0% 50%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      #t1-stat-friendly .label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: var(--size-headline); color: var(--ink);
        max-width: 1100px; line-height: 1.25; margin-top: 30px;
      }

      #t1-stat-friendly .foot {
        position: absolute; bottom: 64px; left: 0; right: 0;
        text-align: center;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        letter-spacing: var(--track-mono); color: var(--ink-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-friendly" data-composition-id="t1-stat-friendly" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="kicker" data-slot="kicker">NEW THIS COHORT</div>
        <div class="stat" data-slot="stat">94%</div>
        <div class="label" data-slot="label">of members shipped their first working AI agent within 30 days</div>
      </div>
      <div class="foot" data-slot="foot">[ ACME CERTIFICATION · COHORT 12 DATA ]</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-friendly";

      /* generic count-up: parses the slot's placeholder text into
         prefix / numeric target / suffix, animates a plain {v:0} object,
         writes textContent on every update. Deterministic, no randomness. */
      function countUp(sel, opts) {
        const el = document.querySelector(sel);
        const raw = el.textContent.trim();
        const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
        if (!m) return gsap.timeline();
        const prefix = m[1], suffix = m[3];
        const numStr = m[2].replace(/,/g, "");
        const isFloat = numStr.indexOf(".") !== -1;
        const decimals = isFloat ? numStr.split(".")[1].length : 0;
        const target = parseFloat(numStr);
        const obj = { v: 0 };
        el.textContent = prefix + (isFloat ? (0).toFixed(decimals) : "0") + suffix;
        return gsap.to(obj, {
          v: target,
          duration: opts.duration || 1.2,
          ease: opts.ease || "power3.out",
          onUpdate: function () {
            const disp = isFloat ? obj.v.toFixed(decimals) : Math.round(obj.v).toLocaleString("en-US");
            el.textContent = prefix + disp + suffix;
          }
        });
      }

      tl
        /* kicker pill POPS */
        .from(root + " .kicker", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 0.15)

        /* mega number pops up soft, then counts up eagerly */
        .from(root + " .stat", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.45)
        .add(countUp(root + " .stat", { duration: 1.1, ease: "power3.out" }), 0.55)

        /* the prism pan — light moves through the number once */
        .to(root + " .stat", { backgroundPosition: "100% 50%", duration: 1.3, ease: "power2.inOut" }, 0.7)

        /* label rises and settles */
        .from(root + " .label", { autoAlpha: 0, y: 30, duration: 0.7, ease: "expo.out" }, 1.15)

        /* footnote snaps in */
        .from(root + " .foot", { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out" }, 1.7)

        /* one gentle bob on the kicker, finite */
        .to(root + " .kicker", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-stat-friendly"] = tl;
    </script>
  </body>
</html>
