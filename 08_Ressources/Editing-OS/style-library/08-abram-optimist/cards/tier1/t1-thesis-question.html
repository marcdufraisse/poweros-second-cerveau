<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · thesis · QUESTION
  Full-screen takeover. A huge, faint Manrope question mark floats behind
  the copy; a mono tape-deck pill tag ("WAIT. REALLY?") pops in first, then
  a big friendly Manrope question rises, its final word gradient-clipped as
  THE prism moment; a light-leak flare sweeps the frame at the peak.
  Slots: tag, headline (richtext, final word wrapped in <em> = prism word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-question {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* the oversized question mark, floating behind everything */
      #t1-thesis-question .qmark {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -56%) rotate(-6deg);
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 640px; line-height: 1; color: var(--ink-faint);
        z-index: 1; pointer-events: none; user-select: none;
      }

      #t1-thesis-question .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 var(--pad);
      }

      /* tape-deck pill tag */
      #t1-thesis-question .tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 12px 30px 14px; margin-bottom: 48px;
      }

      /* the question */
      #t1-thesis-question .headline {
        font-weight: var(--wt-black); font-size: var(--size-display);
        letter-spacing: var(--track-tight); line-height: 1.08;
        color: var(--ink); max-width: 1460px;
      }
      /* THE prism word — clipped gradient, panning background. No will-change. */
      #t1-thesis-question .headline em {
        font-style: normal;
        padding: 0 10px;
        background-image: var(--prism);
        background-size: 220% 100%; background-position: 0% 50%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      /* light-leak flare band */
      #t1-thesis-question .flare {
        position: absolute; top: -10%; bottom: -10%; left: 0; width: 60%;
        background: var(--flare);
        transform: skewX(-14deg) translateX(-140%);
        z-index: 6; pointer-events: none;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-question" data-composition-id="t1-thesis-question" data-start="0" data-width="1920" data-height="1080">
      <div class="qmark">?</div>

      <div class="center">
        <div class="tag" data-slot="tag">WAIT. REALLY?</div>
        <div class="headline" data-slot="headline">What if certification took <em>one weekend</em>?</div>
      </div>

      <div class="flare"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-question";

      tl.from(root + " .qmark", { autoAlpha: 0, scale: 0.9, duration: 1.0, ease: "power2.out" }, 0)

        /* tape tag POPS */
        .from(root + " .tag", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 0.2)

        /* question rises and settles */
        .from(root + " .headline", { autoAlpha: 0, y: 34, duration: 0.7, ease: "expo.out" }, 0.5)

        /* THE prism pan — light moves through the final word once */
        .to(root + " .headline em", { backgroundPosition: "100% 50%", duration: 1.2, ease: "power2.inOut" }, 1.05)

        /* flare sweeps at the peak */
        .to(root + " .flare", { xPercent: 420, duration: 0.75, ease: "power2.inOut" }, 1.2)

        /* one gentle bob on the tag, finite */
        .to(root + " .tag", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-question"] = tl;
    </script>
  </body>
</html>
