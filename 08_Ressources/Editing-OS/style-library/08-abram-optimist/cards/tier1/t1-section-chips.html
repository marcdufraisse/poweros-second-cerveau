<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · section · CHIPS
  Full-screen takeover. Chapter-as-chips layout: the section title sits
  left-aligned in big Manrope 800; on the right, three white pill chips
  pop in staggered down the column, with the current chapter's chip
  ink-filled (white mono text) to mark it out. A small prism wash tints
  one corner — THE prism moment, barely there.
  Slots: title, c1, c2, c3 (c1 is the current/active chapter).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-chips {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* small prism wash, bottom-left corner only */
      #t1-section-chips .wash {
        position: absolute; bottom: -240px; left: -220px;
        width: 620px; height: 520px; border-radius: 50%;
        background: var(--prism-wash);
        filter: blur(60px);
      }

      #t1-section-chips .row {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 var(--pad);
      }

      #t1-section-chips .left {
        flex: 1 1 auto; max-width: 900px;
      }

      #t1-section-chips .title {
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.1;
        color: var(--ink);
      }

      #t1-section-chips .right {
        flex: 0 0 auto; width: 600px;
        display: flex; flex-direction: column; gap: 26px;
      }

      #t1-section-chips .chip {
        background: var(--white); box-shadow: var(--lift);
        border-radius: var(--radius); padding: 26px 38px;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase; color: var(--ink);
      }

      /* the current chapter — ink-filled, white text */
      #t1-section-chips .chip.active {
        background: var(--ink); color: var(--white); box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-chips" data-composition-id="t1-section-chips" data-start="0" data-width="1920" data-height="1080">
      <div class="wash"></div>

      <div class="row">
        <div class="left">
          <div class="title" data-slot="title">Member wins, live</div>
        </div>

        <div class="right">
          <div class="chip active" data-slot="c1">01 · Certified this week</div>
          <div class="chip" data-slot="c2">02 · First agent shipped</div>
          <div class="chip" data-slot="c3">03 · Client deal closed</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-chips";

      tl.from(root + " .wash", { autoAlpha: 0, scale: 0.9, transformOrigin: "20% 80%", duration: 1.0, ease: "power2.out" }, 0)

        /* section title rises and settles */
        .from(root + " .title", { autoAlpha: 0, y: 34, duration: 0.7, ease: "expo.out" }, 0.3)

        /* the three chips POP in, staggered down the column */
        .from(root + " .chip:nth-child(1)", { autoAlpha: 0, scale: 0.6, duration: 0.42, ease: "back.out(1.7)" }, 0.6)
        .from(root + " .chip:nth-child(2)", { autoAlpha: 0, scale: 0.6, duration: 0.42, ease: "back.out(1.7)" }, 0.85)
        .from(root + " .chip:nth-child(3)", { autoAlpha: 0, scale: 0.6, duration: 0.42, ease: "back.out(1.7)" }, 1.1)

        /* one gentle bob on the active chip, finite */
        .to(root + " .chip.active", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t1-section-chips"] = tl;
    </script>
  </body>
</html>
