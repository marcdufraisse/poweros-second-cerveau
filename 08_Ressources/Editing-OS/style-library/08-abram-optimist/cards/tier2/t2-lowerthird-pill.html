<!doctype html>
<!--
  ABRAM OPTIMIST · tier2 · lower-third · PILL
  Bottom-left overlay for talking-head footage (transparent canvas). A dark
  ink pill pops in carrying the mono name, a small sun-yellow tick tab
  glued to its left edge; a white role chip slides out from beneath it a
  beat later. Nothing else on frame — face stays clear above y=720.
  Slots: name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lowerthird-pill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
        overflow: hidden;
      }

      #t2-lowerthird-pill .stack {
        position: absolute; left: 96px; bottom: 150px;
        display: flex; flex-direction: column; align-items: flex-start;
      }

      /* the ink pill — name, mono, white on ink */
      #t2-lowerthird-pill .pill {
        position: relative;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        color: var(--white); background: var(--ink);
        border-radius: var(--radius-pill);
        padding: 16px 40px 18px 44px;
        box-shadow: var(--lift);
        white-space: nowrap;
      }

      /* small sun-yellow tick tab on the pill's left edge */
      #t2-lowerthird-pill .tick {
        position: absolute; left: -8px; top: 50%;
        width: 16px; height: 16px; margin-top: -8px;
        background: var(--sun); border-radius: 4px;
      }

      /* the role chip — white, Inter, slides out beneath the pill */
      #t2-lowerthird-pill .chip {
        margin-top: 14px; margin-left: 12px;
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 26px; color: var(--ink-soft);
        background: var(--white); border-radius: var(--radius-sm);
        padding: 12px 26px;
        box-shadow: var(--lift);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lowerthird-pill" data-composition-id="t2-lowerthird-pill" data-start="0" data-width="1920" data-height="1080">
      <div class="stack">
        <div class="pill">
          <span class="tick"></span>
          <span data-slot="name">Priya Nakamura</span>
        </div>
        <div class="chip" data-slot="role">AI curriculum lead, Acme Certification</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-lowerthird-pill";

      tl.from(root + " .pill", { autoAlpha: 0, scale: 0.6, transformOrigin: "0% 50%", duration: 0.45, ease: "back.out(1.7)" }, 0)

        /* role chip slides out from beneath the pill */
        .from(root + " .chip", { autoAlpha: 0, x: -36, duration: 0.5, ease: "expo.out" }, 0.3)

        /* one gentle finite bob on the pill */
        .to(root + " .pill", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.1)

        .set({}, {}, 6);

      window.__timelines["t2-lowerthird-pill"] = tl;
    </script>
  </body>
</html>
