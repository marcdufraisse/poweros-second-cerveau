<!doctype html>
<!--
  ABRAM OPTIMIST · tier2 · label · TAPE
  Top-right corner overlay for talking-head footage (transparent canvas).
  A single ink pill chip carrying white mono tape-deck text ("2X SPEED >>")
  pops in and gives one quick bob, then holds still. Nothing else on
  frame — compact corner block, face stays clear.
  Slots: tape.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-label-tape {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-mono);
        overflow: hidden;
      }

      #t2-label-tape .tape {
        position: absolute; top: 72px; right: 96px;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        color: var(--white); background: var(--ink);
        border-radius: var(--radius-pill);
        padding: 16px 34px 18px;
        box-shadow: var(--lift);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-label-tape" data-composition-id="t2-label-tape" data-start="0" data-width="1920" data-height="1080">
      <div class="tape" data-slot="tape">2X SPEED &gt;&gt;</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-label-tape";

      tl.from(root + " .tape", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 0)

        /* one quick single bob, finite, then still */
        .to(root + " .tape", { y: -6, duration: 0.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.5)

        .set({}, {}, 6);

      window.__timelines["t2-label-tape"] = tl;
    </script>
  </body>
</html>
