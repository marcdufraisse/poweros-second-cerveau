<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · section · GRID
  A visible layout-grid moment. Five faint vertical grid columns fade in
  first, exposing the underlying broadsheet structure. A white label-box
  index clip-reveals, then the Archivo section title snaps onto the grid
  left-aligned, followed by an accent underline bar draw and a Narrow-caps
  footer line bottom-left.
  Slots: index, title, foot.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-grid {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-section-grid .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-section-grid .gridline {
        position: absolute; top: 0; bottom: 0; width: 1px;
        background: var(--grid-line);
      }
      #t1-section-grid .gl-1 { left: 320px; }
      #t1-section-grid .gl-2 { left: 640px; }
      #t1-section-grid .gl-3 { left: 960px; }
      #t1-section-grid .gl-4 { left: 1280px; }
      #t1-section-grid .gl-5 { left: 1600px; }

      #t1-section-grid .labelbox {
        position: absolute; top: 340px; left: 96px;
        overflow: hidden;
      }
      #t1-section-grid .labelbox .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }

      #t1-section-grid .title {
        position: absolute; top: 420px; left: 96px; right: 96px;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.08;
        color: var(--white); text-transform: uppercase;
      }

      #t1-section-grid .underline {
        position: absolute; top: 660px; left: 96px;
        width: 260px; height: var(--bar-h); background: var(--accent);
        transform-origin: 0% 50%;
      }

      #t1-section-grid .foot {
        position: absolute; bottom: 118px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-section-grid" data-composition-id="t1-section-grid" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="gridline gl-1"></div>
      <div class="gridline gl-2"></div>
      <div class="gridline gl-3"></div>
      <div class="gridline gl-4"></div>
      <div class="gridline gl-5"></div>

      <div class="labelbox"><div class="boxinner" data-slot="index">SECTION 02</div></div>
      <div class="title" data-slot="title">WHERE THE MARGIN GOES</div>
      <div class="underline"></div>
      <div class="foot" data-slot="foot">ACME DATA DESK · UPDATED WEEKLY</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-grid";

      tl.from(root + " .gridline", {
          autoAlpha: 0, duration: 0.5, ease: "power2.out", stagger: 0.06
        }, 0.05)

        .from(root + " .labelbox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.6)

        .from(root + " .title", { autoAlpha: 0, x: -24, duration: 0.5, ease: "expo.out" }, 0.95)

        .fromTo(root + " .underline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 1.4)

        .from(root + " .foot", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-section-grid"] = tl;
    </script>
  </body>
</html>
