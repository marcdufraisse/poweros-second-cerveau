<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · overview · TABLE
  Full-screen takeover. Archivo headline over a 4-row broadsheet data table:
  Narrow-caps row label left, mono amber value right, hairline rules wipe in
  top to bottom between rows while each value rolls up. The last row is
  flagged with an accent left-border as the headline finding. Source
  bottom-left. Mechanical precision, square corners, dead-still hold.
  Slots: title, r1l, r1v, r2l, r2v, r3l, r3v, r4l, r4v, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-table {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-overview-table .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-overview-table .toprule {
        position: absolute; top: 120px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-overview-table .title {
        position: absolute; top: 156px; left: 96px; right: 96px;
        font-weight: var(--wt-bold); font-size: var(--size-headline);
        letter-spacing: var(--track-tight); line-height: 1.15;
        color: var(--white); max-width: 1500px;
      }

      #t1-overview-table .table {
        position: absolute; top: 320px; left: 96px; right: 96px; bottom: 260px;
        display: flex; flex-direction: column;
      }
      #t1-overview-table .row {
        position: relative; flex: 1; display: flex; align-items: center;
        padding-left: 22px; border-left: 4px solid transparent;
      }
      #t1-overview-table .row.highlight { border-left-color: var(--accent); }
      #t1-overview-table .rowrule {
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-overview-table .rowline {
        display: flex; align-items: baseline; justify-content: space-between;
        width: 100%;
      }
      #t1-overview-table .rlabel {
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-body); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
      }
      #t1-overview-table .row.highlight .rlabel { color: var(--white); font-weight: var(--wt-bold); }
      #t1-overview-table .rvalue {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: 56px; color: var(--amber); letter-spacing: -0.02em;
        min-width: 260px; text-align: right;
      }

      #t1-overview-table .botrule {
        position: absolute; bottom: 200px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 100% 50%;
      }
      #t1-overview-table .source {
        position: absolute; bottom: 118px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-overview-table .stamp {
        position: absolute; bottom: 118px; right: 96px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-table" data-composition-id="t1-overview-table" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="toprule"></div>
      <div class="title" data-slot="title">AI CERTIFICATION MARKET · Q2 SNAPSHOT</div>

      <div class="table">
        <div class="row row-1">
          <div class="rowrule"></div>
          <div class="rowline">
            <span class="rlabel" data-slot="r1l">CERTIFICATIONS ISSUED</span>
            <span class="rvalue" data-slot="r1v" data-count-to="18412" data-count-prefix="" data-count-suffix="">0</span>
          </div>
        </div>
        <div class="row row-2">
          <div class="rowrule"></div>
          <div class="rowline">
            <span class="rlabel" data-slot="r2l">AGENT ADOPTION RATE</span>
            <span class="rvalue" data-slot="r2v" data-count-to="62" data-count-prefix="" data-count-suffix="%">0%</span>
          </div>
        </div>
        <div class="row row-3">
          <div class="rowrule"></div>
          <div class="rowline">
            <span class="rlabel" data-slot="r3l">AVG COMPLETION TIME</span>
            <span class="rvalue" data-slot="r3v" data-count-to="4.2" data-count-decimals="1" data-count-prefix="" data-count-suffix="H">0H</span>
          </div>
        </div>
        <div class="row row-4 highlight">
          <div class="rowrule"></div>
          <div class="rowline">
            <span class="rlabel" data-slot="r4l">MEMBER RETENTION</span>
            <span class="rvalue" data-slot="r4v" data-count-to="91" data-count-prefix="" data-count-suffix="%">0%</span>
          </div>
        </div>
      </div>

      <div class="botrule"></div>
      <div class="source" data-slot="source">SOURCE: ACME MEMBER SURVEY 2026</div>
      <div class="stamp">2026-07 · 09:41:07 EST</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-table";

      function fmt(n, decimals, prefix, suffix) {
        const v = decimals > 0 ? n.toFixed(decimals) : Math.round(n).toLocaleString("en-US");
        return prefix + v + suffix;
      }

      function wireCounter(el) {
        const target = parseFloat(el.dataset.countTo || "0");
        const decimals = parseInt(el.dataset.countDecimals || "0", 10);
        const prefix = el.dataset.countPrefix || "";
        const suffix = el.dataset.countSuffix || "";
        return { el, target, decimals, prefix, suffix, counter: { v: 0 } };
      }

      const rows = [1, 2, 3, 4].map((i) => wireCounter(document.querySelector(root + " .row-" + i + " .rvalue")));

      tl.fromTo(root + " .toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.05)
        .from(root + " .title", { autoAlpha: 0, y: 20, duration: 0.5, ease: "power2.out" }, 0.15);

      /* rows wipe in top to bottom: hairline rule draws, label + value fade,
         value rolls up — cascaded start times, staggered 0.32s per row */
      rows.forEach((row, i) => {
        const t = 0.6 + i * 0.32;
        tl.fromTo(root + " .row-" + (i + 1) + " .rowrule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, t)
          .from(root + " .row-" + (i + 1) + " .rlabel", { autoAlpha: 0, y: 12, duration: 0.4, ease: "power2.out" }, t + 0.1)
          .from(root + " .row-" + (i + 1) + " .rvalue", { autoAlpha: 0, duration: 0.3, ease: "power2.out" }, t + 0.15)
          .to(row.counter, {
            v: row.target, duration: 0.9, ease: "power2.out",
            onUpdate: () => { row.el.textContent = fmt(row.counter.v, row.decimals, row.prefix, row.suffix); }
          }, t + 0.15);
      });

      tl.fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 2.1)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.5)
        .from(root + " .stamp", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.6)

        .set({}, {}, 8);

      window.__timelines["t1-overview-table"] = tl;
    </script>
  </body>
</html>
