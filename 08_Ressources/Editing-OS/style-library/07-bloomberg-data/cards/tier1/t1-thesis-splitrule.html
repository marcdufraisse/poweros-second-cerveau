<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · thesis · SPLITRULE
  A full-height vertical rule draws top-to-bottom, splitting the frame
  ~40/60. Left column: a white label-box tag with accent underline, and an
  amber mono date/tag line clip-revealed beneath it. Right column: a bold
  Archivo claim wipes onto the grid, followed by a dim supporting line.
  Everything enters as a wipe along the grid — no fades on the big shapes.
  Slots: tag, date, claim, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-splitrule {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-thesis-splitrule .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      /* the full-height split rule at 40% */
      #t1-thesis-splitrule .vrule {
        position: absolute; top: 0; bottom: 0; left: 768px; width: 1px;
        background: var(--rule); transform-origin: 50% 0%;
      }

      /* left column: 0 -> 768 */
      #t1-thesis-splitrule .left-col {
        position: absolute; left: 96px; top: 0; bottom: 0; width: 576px;
      }
      #t1-thesis-splitrule .labelbox {
        position: absolute; top: 340px; left: 0;
        overflow: hidden;
      }
      #t1-thesis-splitrule .labelbox .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }
      #t1-thesis-splitrule .underbar {
        position: absolute; top: 394px; left: 0;
        width: 160px; height: var(--bar-h); background: var(--accent);
        transform-origin: 0% 50%;
      }
      #t1-thesis-splitrule .dateclip {
        position: absolute; top: 436px; left: 0; right: 0;
        overflow: hidden;
      }
      #t1-thesis-splitrule .date {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-body); color: var(--amber);
        letter-spacing: -0.01em;
      }

      /* right column: 864 -> 1824. Flow layout so a longer claim (wrapping
         to 2-3 lines at --size-title) never overlaps the sub line below it. */
      #t1-thesis-splitrule .right-col {
        position: absolute; left: 864px; right: 96px; top: 330px;
      }
      #t1-thesis-splitrule .claimclip {
        overflow: hidden;
      }
      #t1-thesis-splitrule .claim {
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.14;
        color: var(--white); max-width: 900px;
      }
      #t1-thesis-splitrule .sub {
        margin-top: 40px;
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4;
        color: var(--text-dim); max-width: 820px;
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-splitrule" data-composition-id="t1-thesis-splitrule" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="vrule"></div>

      <div class="left-col">
        <div class="labelbox"><div class="boxinner" data-slot="tag">MARKET NOTE</div></div>
        <div class="underbar"></div>
        <div class="dateclip"><div class="date" data-slot="date">2026-07-21 · 09:41 EST</div></div>
      </div>

      <div class="right-col">
        <div class="claimclip"><div class="claim" data-slot="claim">Agent adoption is compounding faster than the certification pipeline can staff for it.</div></div>
        <div class="sub" data-slot="sub">Waitlists for advanced tracks have tripled since Q1, per internal enrollment data.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-splitrule";

      tl.fromTo(root + " .vrule", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.inOut" }, 0.05)

        /* left column: label box clip-reveals, underline draws, date wipes in */
        .from(root + " .labelbox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.55)
        .fromTo(root + " .underbar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 0.85)
        .from(root + " .date", { xPercent: -100, duration: 0.5, ease: "power3.inOut" }, 1.05)

        /* right column: claim wipes in as a hard clip, sub follows */
        .from(root + " .claim", { xPercent: -100, duration: 0.65, ease: "power3.inOut" }, 1.3)
        .from(root + " .sub", { autoAlpha: 0, y: 12, duration: 0.4, ease: "power2.out" }, 2.1)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-splitrule"] = tl;
    </script>
  </body>
</html>
