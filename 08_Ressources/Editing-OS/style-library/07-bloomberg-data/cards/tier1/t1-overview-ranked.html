<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · overview · RANKED
  Full-screen takeover. Archivo headline over a four-row ranked leaderboard:
  a huge mono rank numeral, a Narrow-caps name, and a horizontal bar that
  grows from a faint track with its mono value snapping in at the bar end.
  Rows stagger top to bottom; the #1 bar is accent, the rest are rule-toned.
  Slots: title, n1, v1, n2, v2, n3, v3, n4, v4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-ranked {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-overview-ranked .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-overview-ranked .toprule {
        position: absolute; top: 120px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-overview-ranked .title {
        position: absolute; top: 156px; left: 96px; right: 96px;
        font-weight: var(--wt-bold); font-size: var(--size-headline);
        letter-spacing: var(--track-tight); line-height: 1.15;
        color: var(--white); max-width: 1500px;
      }

      #t1-overview-ranked .board {
        position: absolute; top: 330px; left: 96px; right: 96px; bottom: 220px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      #t1-overview-ranked .rank-row { display: flex; align-items: center; gap: 40px; }
      #t1-overview-ranked .rank-num {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: 76px; color: var(--amber); min-width: 110px; text-align: right;
        letter-spacing: -0.02em;
      }
      #t1-overview-ranked .rank-body { flex: 1; }
      #t1-overview-ranked .rank-name {
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;
      }
      #t1-overview-ranked .rank-row.top .rank-name { color: var(--white); font-weight: var(--wt-bold); }

      #t1-overview-ranked .track {
        position: relative; height: 22px; background: var(--grid-line);
        display: flex; align-items: center;
      }
      #t1-overview-ranked .bar {
        position: absolute; left: 0; top: 0; bottom: 0;
        transform-origin: 0% 50%; background: var(--rule);
      }
      #t1-overview-ranked .rank-row.top .bar { background: var(--accent); }
      #t1-overview-ranked .bar-value {
        position: absolute; top: 50%; right: -16px;
        transform: translate(100%, -50%);
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: 34px; color: var(--amber);
      }

      #t1-overview-ranked .botrule {
        position: absolute; bottom: 160px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 100% 50%;
      }
      #t1-overview-ranked .source {
        position: absolute; bottom: 108px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-overview-ranked .stamp {
        position: absolute; bottom: 108px; right: 96px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-ranked" data-composition-id="t1-overview-ranked" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="toprule"></div>
      <div class="title" data-slot="title">TOP AUTOMATION CATEGORIES · BY MEMBER SHARE</div>

      <div class="board">
        <div class="rank-row top" data-bar-width="680">
          <div class="rank-num">01</div>
          <div class="rank-body">
            <div class="rank-name" data-slot="n1">CONTENT GENERATION</div>
            <div class="track"><div class="bar"><span class="bar-value" data-slot="v1">34%</span></div></div>
          </div>
        </div>
        <div class="rank-row" data-bar-width="540">
          <div class="rank-num">02</div>
          <div class="rank-body">
            <div class="rank-name" data-slot="n2">CUSTOMER SUPPORT</div>
            <div class="track"><div class="bar"><span class="bar-value" data-slot="v2">27%</span></div></div>
          </div>
        </div>
        <div class="rank-row" data-bar-width="380">
          <div class="rank-num">03</div>
          <div class="rank-body">
            <div class="rank-name" data-slot="n3">DATA ANALYSIS</div>
            <div class="track"><div class="bar"><span class="bar-value" data-slot="v3">19%</span></div></div>
          </div>
        </div>
        <div class="rank-row" data-bar-width="240">
          <div class="rank-num">04</div>
          <div class="rank-body">
            <div class="rank-name" data-slot="n4">SALES OUTREACH</div>
            <div class="track"><div class="bar"><span class="bar-value" data-slot="v4">12%</span></div></div>
          </div>
        </div>
      </div>

      <div class="botrule"></div>
      <div class="source" data-slot="source">SOURCE: ACME MEMBER SURVEY 2026</div>
      <div class="stamp">2026-07 · 09:41:07 EST</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-ranked";

      /* bar tracks are 1728px wide (1920 - 96*2 - 110 rank col - 40 gap ≈ 1682px);
         bake absolute pixel widths as inline transform targets via scaleX from
         the authored data-bar-width so the fixed data shapes stay hardcoded */
      const rankRows = Array.from(document.querySelectorAll(root + " .rank-row"));
      rankRows.forEach((row) => {
        const w = parseFloat(row.dataset.barWidth);
        row.querySelector(".bar").style.width = w + "px";
      });

      tl.fromTo(root + " .toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.05)
        .from(root + " .title", { autoAlpha: 0, y: 20, duration: 0.5, ease: "power2.out" }, 0.15);

      rankRows.forEach((row, i) => {
        const t = 0.65 + i * 0.3;
        const sel = ".rank-row:nth-child(" + (i + 1) + ")";
        tl.from(root + " " + sel + " .rank-num", { autoAlpha: 0, x: -16, duration: 0.35, ease: "power2.out" }, t)
          .from(root + " " + sel + " .rank-name", { autoAlpha: 0, x: -16, duration: 0.35, ease: "power2.out" }, t)
          .fromTo(root + " " + sel + " .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, t + 0.15)
          .from(root + " " + sel + " .bar-value", { autoAlpha: 0, x: -12, duration: 0.3, ease: "expo.out" }, t + 0.6);
      });

      tl.fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 2.6)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 3.0)
        .from(root + " .stamp", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 3.1)

        .set({}, {}, 8);

      window.__timelines["t1-overview-ranked"] = tl;
    </script>
  </body>
</html>
