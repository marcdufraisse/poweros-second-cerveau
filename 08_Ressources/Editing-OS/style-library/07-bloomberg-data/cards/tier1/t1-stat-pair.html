<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · stat · PAIR
  Full-screen takeover. Broadsheet headline top-left, then two ruled
  --panel side-by-side comparison panels split by a vertical rule that
  draws down the center. Each panel: Narrow-caps label, amber mono value
  rolling up, small delta line (left panel --down, right panel --up).
  Square 1px borders, mechanical entrances, dead-still hold.
  Slots: title, l1, v1, d1, l2, v2, d2.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-pair {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-pair .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-stat-pair .toprule {
        position: absolute; top: 120px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-stat-pair .title {
        position: absolute; top: 152px; left: 96px; right: 96px;
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.08;
        color: var(--white); max-width: 1500px;
      }

      #t1-stat-pair .panels {
        position: absolute; left: 96px; right: 96px; top: 380px; bottom: 170px;
        display: flex;
      }
      #t1-stat-pair .panel {
        flex: 1; background: var(--panel); border: 1px solid var(--rule);
        padding: 56px 64px; display: flex; flex-direction: column; justify-content: center;
      }
      #t1-stat-pair .panel.left { border-right: none; }

      #t1-stat-pair .vrule {
        width: 1px; background: var(--rule); transform-origin: 50% 0%;
      }

      #t1-stat-pair .label {
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 22px;
      }
      #t1-stat-pair .value {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: 168px; line-height: 0.92; letter-spacing: -0.02em;
        color: var(--amber);
      }
      #t1-stat-pair .delta {
        display: flex; align-items: center; gap: 12px;
        margin-top: 26px;
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-body);
      }
      #t1-stat-pair .panel.left .delta { color: var(--down); }
      #t1-stat-pair .panel.right .delta { color: var(--up); }
      #t1-stat-pair .tri-down {
        width: 0; height: 0;
        border-left: 9px solid transparent; border-right: 9px solid transparent;
        border-top: 13px solid var(--down);
      }
      #t1-stat-pair .tri-up {
        width: 0; height: 0;
        border-left: 9px solid transparent; border-right: 9px solid transparent;
        border-bottom: 13px solid var(--up);
      }

      #t1-stat-pair .botrule {
        position: absolute; bottom: 118px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 100% 50%;
      }
      #t1-stat-pair .source {
        position: absolute; bottom: 68px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-pair" data-composition-id="t1-stat-pair" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="toprule"></div>
      <div class="title" data-slot="title">Cost to serve, before and after agent automation</div>

      <div class="panels">
        <div class="panel left">
          <div class="label" data-slot="l1">Support cost per member / mo</div>
          <div class="value" data-slot="v1" data-count-to="42" data-count-prefix="$">$0</div>
          <div class="delta"><span class="tri-down"></span><span data-slot="d1">-9 vs last year</span></div>
        </div>
        <div class="vrule"></div>
        <div class="panel right">
          <div class="label" data-slot="l2">Support cost, agent-automated</div>
          <div class="value" data-slot="v2" data-count-to="11" data-count-prefix="$">$0</div>
          <div class="delta"><span class="tri-up"></span><span data-slot="d2">+74% margin recovered</span></div>
        </div>
      </div>

      <div class="botrule"></div>
      <div class="source">SOURCE: ACME OPERATIONS BENCHMARK 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-pair";

      function rollUp(sel, delay) {
        const el = document.querySelector(sel);
        const target = parseFloat(el.dataset.countTo || "0");
        const pre = el.dataset.countPrefix || "";
        const suf = el.dataset.countSuffix || "";
        const counter = { v: 0 };
        const fmt = (n) => pre + Math.round(n).toLocaleString("en-US") + suf;
        tl.from(sel, { autoAlpha: 0, duration: 0.3, ease: "power2.out" }, delay)
          .to(counter, {
            v: target, duration: 1.2, ease: "power2.out",
            onUpdate: () => { el.textContent = fmt(counter.v); }
          }, delay);
      }

      tl.fromTo(root + " .toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.05)
        .from(root + " .title", { autoAlpha: 0, y: 18, duration: 0.5, ease: "expo.out" }, 0.25)

        .from(root + " .panel.left",  { autoAlpha: 0, x: -24, duration: 0.45, ease: "power3.inOut" }, 0.55)
        .from(root + " .panel.right", { autoAlpha: 0, x: 24,  duration: 0.45, ease: "power3.inOut" }, 0.65)
        .fromTo(root + " .vrule", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power3.inOut" }, 0.6)

        .from(root + " .panel.left .label",  { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.9)
        .from(root + " .panel.right .label", { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 1.0);

      rollUp(root + " .panel.left .value", 1.05);
      rollUp(root + " .panel.right .value", 1.2);

      tl.from(root + " .panel.left .delta",  { autoAlpha: 0, y: 12, duration: 0.4, ease: "expo.out" }, 2.5)
        .from(root + " .panel.right .delta", { autoAlpha: 0, y: 12, duration: 0.4, ease: "expo.out" }, 2.65)

        .fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.9)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.9)

        .set({}, {}, 7);

      window.__timelines["t1-stat-pair"] = tl;
    </script>
  </body>
</html>
