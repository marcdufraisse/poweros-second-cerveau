<!doctype html>
<!--
  BLOOMBERG DATA · custom · chart · LINE
  Trend-line showpiece. A panel holds an SVG polyline (hardcoded
  rising-with-dips shape) that draws left to right via stroke-dashoffset in
  accent blue, with square markers popping in at three hardcoded points; a
  mono amber end-value label snaps in at the line's end. Title + Narrow-caps
  x-axis endpoints, faint gridlines, source bottom-left.
  Slots: title, endval, xleft, xright, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-linechart {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #c-linechart .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #c-linechart .panel {
        position: absolute; top: 130px; left: 96px; right: 96px; bottom: 130px;
        background: var(--panel);
      }
      #c-linechart .panelbar {
        position: absolute; top: 0; left: 0; right: 0; height: 90px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 48px; border-bottom: var(--hairline);
      }
      #c-linechart .paneltitle {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--white);
        overflow: hidden;
      }
      #c-linechart .endval {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: 40px; color: var(--amber);
      }

      #c-linechart .chartwrap {
        position: absolute; top: 90px; left: 48px; right: 48px; bottom: 100px;
      }
      #c-linechart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #c-linechart .gridline { stroke: var(--grid-line); stroke-width: 1; }
      #c-linechart .trendline {
        fill: none; stroke: var(--accent); stroke-width: 4;
      }
      #c-linechart .marker {
        fill: var(--accent); transform-box: fill-box; transform-origin: center;
      }

      #c-linechart .xaxis {
        position: absolute; bottom: 50px; left: 48px; right: 48px;
        display: flex; justify-content: space-between;
      }
      #c-linechart .xlabel {
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
      }

      #c-linechart .source {
        position: absolute; bottom: 60px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="c-linechart" data-composition-id="c-linechart" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="panel">
        <div class="panelbar">
          <div class="paneltitle" data-slot="title">AGENT ADOPTION CURVE · TRAILING 12 MONTHS</div>
          <div class="endval" data-slot="endval">84%</div>
        </div>

        <div class="chartwrap">
          <svg viewBox="0 0 1680 760" preserveAspectRatio="none">
            <line class="gridline" x1="0" y1="120" x2="1680" y2="120" />
            <line class="gridline" x1="0" y1="320" x2="1680" y2="320" />
            <line class="gridline" x1="0" y1="520" x2="1680" y2="520" />
            <line class="gridline" x1="0" y1="700" x2="1680" y2="700" />

            <polyline class="trendline" id="c-linechart-line" points="
              0,620
              210,520
              420,560
              630,340
              840,420
              1050,220
              1260,260
              1470,120
              1680,80
            " />

            <rect class="marker" id="mk1" x="-10" y="610" width="20" height="20" />
            <rect class="marker" id="mk2" x="830" y="410" width="20" height="20" />
            <rect class="marker" id="mk3" x="1670" y="70" width="20" height="20" />
          </svg>
        </div>

        <div class="xaxis">
          <span class="xlabel" data-slot="xleft">JAN</span>
          <span class="xlabel" data-slot="xright">DEC</span>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE: ACME PLATFORM TELEMETRY 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-linechart";

      const line = document.getElementById("c-linechart-line");
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;

      tl.fromTo(root + " .panel", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0)
        .from(root + " .paneltitle", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.15)
        .fromTo(root + " .gridline", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out", stagger: 0.06 }, 0.3)
        .from(root + " .xlabel", { autoAlpha: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, 0.4)

        /* the trendline draws left to right */
        .to(line, { strokeDashoffset: 0, duration: 1.4, ease: "power3.inOut" }, 0.65)

        /* square markers pop in as the draw passes their x-position */
        .fromTo("#mk1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "expo.out" }, 0.7)
        .fromTo("#mk2", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "expo.out" }, 1.35)
        .fromTo("#mk3", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "expo.out" }, 2.0)

        /* end value snaps in once the line lands */
        .from(root + " .endval", { autoAlpha: 0, x: 16, duration: 0.35, ease: "expo.out" }, 2.1)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.4)

        .set({}, {}, 8);

      window.__timelines["c-linechart"] = tl;
    </script>
  </body>
</html>
