<!doctype html>
<!--
  BLOOMBERG DATA · tier2 · lower-third · BOX
  Bottom-left overlay, transparent stage. A white label box clip-reveals the
  name (black Narrow caps), an accent underline bar draws beneath it, then a
  --panel strip slides up out of the underline carrying the role in white
  Narrow caps. Mechanical, square-cornered, dead-still hold.
  Slots: name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lowerthird-box {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* name — white label box, clip-reveal */
      #t2-lowerthird-box .namebox {
        position: absolute; left: 96px; top: 792px;
        overflow: hidden; /* clip-reveal container */
      }
      #t2-lowerthird-box .namebox .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 34px; letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
        white-space: nowrap;
      }

      /* accent underline draw */
      #t2-lowerthird-box .underbar {
        position: absolute; left: 96px; top: 848px;
        width: 360px; height: var(--bar-h); background: var(--accent);
        transform-origin: 0% 50%;
      }

      /* role — panel strip, slides up from beneath the underline */
      #t2-lowerthird-box .rolebox {
        position: absolute; left: 96px; top: 858px;
        overflow: hidden; height: 52px; /* clip-reveal container */
      }
      #t2-lowerthird-box .rolebox .roleinner {
        background: var(--panel); color: var(--white);
        border-left: 3px solid var(--accent);
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: 12px 20px 12px 17px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lowerthird-box" data-composition-id="t2-lowerthird-box" data-start="0" data-width="1920" data-height="1080">
      <div class="namebox"><div class="boxinner" data-slot="name">DANA MERCER</div></div>
      <div class="underbar"></div>
      <div class="rolebox"><div class="roleinner" data-slot="role">HEAD OF AI CURRICULUM, ACME</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-lowerthird-box";

      tl
        /* name box clip-reveals: inner slides in from the left */
        .from(root + " .namebox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.1)

        /* accent underline draws left-to-right */
        .fromTo(root + " .underbar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.55)

        /* role strip slides up out of the underline */
        .from(root + " .rolebox .roleinner", { yPercent: 101, duration: 0.45, ease: "power3.inOut" }, 0.85)

        .set({}, {}, 6);

      window.__timelines["t2-lowerthird-box"] = tl;
    </script>
  </body>
</html>
