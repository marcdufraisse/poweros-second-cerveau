<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · overview · STACK
  Full-screen takeover. A mono kicker chip fades up top, then FIVE rows of
  cream Luckiest-Guy caps (full black rim) STAMP in one per beat (scale
  1.6→1, back.out(2.2), ~0.28s, row stagger ~0.3s), center-aligned, stacked
  tight — the last row lands in accent blue. Dead stillness after the last
  stamp; no bar, no footer, just the list holding still.
  Slots: kicker, r1, r2, r3, r4, r5.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-stack {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-overview-stack .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-overview-stack .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* mono kicker chip */
      #t1-overview-stack .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: var(--text-dim); letter-spacing: 0.08em;
        border: 1px solid var(--panel-edge); border-radius: var(--radius-sm);
        background: var(--panel);
        padding: 10px 22px; margin-bottom: 40px;
      }
      #t1-overview-stack .kicker .prompt { color: var(--syn-green); }

      /* the stacked rows */
      #t1-overview-stack .rows {
        display: flex; flex-direction: column; align-items: center;
        gap: 6px;
      }
      #t1-overview-stack .row {
        font-size: var(--size-title); line-height: 1.08;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--cream);
        -webkit-text-stroke: var(--stroke-w) var(--outline);
        paint-order: stroke fill;
        text-shadow: var(--caption-shadow);
        max-width: 1600px;
      }
      #t1-overview-stack .row.last { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="t1-overview-stack" data-composition-id="t1-overview-stack" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="kicker"><span class="prompt">$</span> <span data-slot="kicker">the certification roadmap</span></div>
        <div class="rows">
          <div class="row" data-slot="r1">FOUNDATIONS</div>
          <div class="row" data-slot="r2">PROMPT ENGINEERING</div>
          <div class="row" data-slot="r3">AGENT STACKS</div>
          <div class="row" data-slot="r4">AUTOMATION PIPELINES</div>
          <div class="row last" data-slot="r5">ACME CERTIFIED</div>
        </div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-overview-stack";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .kicker", { autoAlpha: 0, y: -14, duration: 0.3, ease: "expo.out" }, 0.1)

        /* THE STAMPS — one row per beat, hard and fast */
        .from(root + " .row", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "50% 60%",
          duration: 0.28, ease: "back.out(2.2)", stagger: 0.3
        }, 0.55)

        /* dead stillness — the hold is the timing */
        .set({}, {}, 8);

      window.__timelines["t1-overview-stack"] = tl;
    </script>
  </body>
</html>
