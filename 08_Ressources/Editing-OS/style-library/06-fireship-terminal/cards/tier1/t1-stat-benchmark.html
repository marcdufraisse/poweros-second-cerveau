<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · stat · BENCHMARK
  Full-screen takeover. A benchmark panel centered on the canvas: title bar
  with filename "benchmark.txt" + a mono headline. Two horizontal bars stamp
  in — bar 1 ("before") is dim panel-edge fill, grows short via scaleX; bar 2
  ("after") is flame-gradient fill, grows longer, its mono value counting up
  in sync at the bar's end. Punchy and precise, dead still after.
  Slots: title, l1, v1, l2, v2.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-benchmark {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #t1-stat-benchmark .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-stat-benchmark .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-stat-benchmark .panel {
        width: 1280px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: var(--radius);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      #t1-stat-benchmark .chrome {
        height: var(--chrome-h);
        display: flex; align-items: center; gap: 10px;
        padding: 0 22px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--panel-edge);
      }
      #t1-stat-benchmark .dot { width: var(--dot); height: var(--dot); border-radius: 50%; }
      #t1-stat-benchmark .dot.red { background: var(--dot-red); }
      #t1-stat-benchmark .dot.yellow { background: var(--dot-yellow); }
      #t1-stat-benchmark .dot.green { background: var(--dot-green); }
      #t1-stat-benchmark .filename {
        margin-left: 16px; font-size: var(--size-label); color: var(--text-dim);
        letter-spacing: 0.02em;
      }

      #t1-stat-benchmark .body { padding: 58px 70px 70px; }

      #t1-stat-benchmark .title {
        font-size: var(--size-headline); font-weight: var(--wt-bold);
        color: var(--cream); letter-spacing: 0.01em;
        margin-bottom: 54px;
      }

      #t1-stat-benchmark .row { margin-bottom: 46px; }
      #t1-stat-benchmark .row:last-child { margin-bottom: 0; }

      #t1-stat-benchmark .row-head {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: var(--size-body); margin-bottom: 16px;
      }
      #t1-stat-benchmark .row-label { color: var(--text-dim); letter-spacing: 0.04em; }
      #t1-stat-benchmark .row-value { color: var(--text); font-weight: var(--wt-bold); font-size: 40px; }
      #t1-stat-benchmark .row.after .row-value { color: var(--flame-2); }

      #t1-stat-benchmark .track {
        height: 34px; border-radius: 17px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--panel-edge);
        overflow: hidden;
      }
      #t1-stat-benchmark .track.before { width: 420px; }
      #t1-stat-benchmark .track.after { width: 1140px; }

      #t1-stat-benchmark .fill {
        height: 100%; width: 100%;
        transform-origin: 0% 50%; transform: scaleX(0);
      }
      #t1-stat-benchmark .fill.before { background: var(--panel-edge); }
      #t1-stat-benchmark .fill.after { background: var(--flame-grad); }
    </style>
  </head>
  <body>
    <div id="t1-stat-benchmark" data-composition-id="t1-stat-benchmark" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="panel">
          <div class="chrome">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="filename">benchmark.txt</span>
          </div>
          <div class="body">
            <div class="title" data-slot="title">TIME TO FIRST DEPLOYED AGENT</div>

            <div class="row before">
              <div class="row-head">
                <span class="row-label" data-slot="l1">before Acme</span>
                <span class="row-value"><span class="count" data-slot="v1" data-value="41">0</span> days</span>
              </div>
              <div class="track before"><div class="fill before"></div></div>
            </div>

            <div class="row after">
              <div class="row-head">
                <span class="row-label" data-slot="l2">after Acme certification</span>
                <span class="row-value"><span class="count" data-slot="v2" data-value="3">0</span> days</span>
              </div>
              <div class="track after"><div class="fill after"></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-stat-benchmark";

      function makeCounter(sel) {
        const el = document.querySelector(root + " " + sel);
        return { el, target: parseFloat(el.getAttribute("data-value")) || 0, obj: { v: 0 } };
      }
      const c1 = makeCounter(".row.before .count");
      const c2 = makeCounter(".row.after .count");

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .panel", { autoAlpha: 0, y: 26, duration: 0.3, ease: "expo.out" }, 0.15)
        .from(root + " .title", { autoAlpha: 0, y: -10, duration: 0.26, ease: "expo.out" }, ">0.05")

        /* bar 1 — "before", dim, shorter grow */
        .from(root + " .row.before .row-label", { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, ">0.15")
        .to(root + " .track.before .fill", { scaleX: 1, duration: 0.5, ease: "expo.out" }, "<")
        .to(c1.obj, {
          v: c1.target, duration: 0.5, ease: "expo.out",
          onUpdate: () => { c1.el.textContent = Math.round(c1.obj.v); }
        }, "<")

        /* bar 2 — "after", flame gradient, longer grow, value ticks at its end */
        .from(root + " .row.after .row-label", { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, ">0.2")
        .to(root + " .track.after .fill", { scaleX: 1, duration: 0.6, ease: "expo.out" }, "<")
        .to(c2.obj, {
          v: c2.target, duration: 0.6, ease: "expo.out",
          onUpdate: () => { c2.el.textContent = Math.round(c2.obj.v); }
        }, "<")

        /* dead stillness */
        .set({}, {}, 7);

      window.__timelines["t1-stat-benchmark"] = tl;
    </script>
  </body>
</html>
