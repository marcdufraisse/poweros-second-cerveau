<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · section · FLAME
  Full-screen takeover, chapter divider. A full-width 18px flame-gradient
  bar wipes across mid-frame (scaleX 0→1, expo.out); the section title in
  cream Luckiest-Guy stamps in riding just above the bar; a mono chapter
  index snaps in below the bar last. Dead stillness after.
  Slots: index (text), title (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-flame {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-section-flame .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-section-flame .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* section title, rides above the bar */
      #t1-section-flame .title {
        font-size: var(--size-display); line-height: 1.1;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--cream);
        -webkit-text-stroke: var(--stroke-w) var(--outline);
        paint-order: stroke fill;
        text-shadow: var(--caption-shadow);
        max-width: 1500px;
        margin-bottom: 42px;
      }

      /* full-width flame-gradient bar */
      #t1-section-flame .bar {
        width: 1760px; height: 18px; border-radius: 9px;
        background: var(--flame-grad);
        transform-origin: 50% 50%;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.8), 0 0 30px rgba(var(--flame-rgb), 0.4);
      }

      /* mono chapter index, below the bar */
      #t1-section-flame .index {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: var(--text-dim); letter-spacing: 0.08em;
        margin-top: 36px;
      }
      #t1-section-flame .index .prompt { color: var(--syn-pink); }
    </style>
  </head>
  <body>
    <div id="t1-section-flame" data-composition-id="t1-section-flame" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="title" data-slot="title">THE PIVOT</div>
        <div class="bar"></div>
        <div class="index"><span class="prompt">//</span> <span data-slot="index">chapter 02</span></div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-section-flame";

      const tl = gsap.timeline({ paused: true });

      /* flame bar wipes across mid-frame first */
      tl.fromTo(root + " .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 0.3)

        /* title stamps in, riding above the bar */
        .from(root + " .title", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "50% 60%",
          duration: 0.28, ease: "back.out(2.2)"
        }, ">-0.12")

        /* mono chapter index snaps in below, last */
        .from(root + " .index", { autoAlpha: 0, y: 14, duration: 0.24, ease: "expo.out" }, ">0.16")

        /* dead stillness — ends completely still */
        .set({}, {}, 7);

      window.__timelines["t1-section-flame"] = tl;
    </script>
  </body>
</html>
