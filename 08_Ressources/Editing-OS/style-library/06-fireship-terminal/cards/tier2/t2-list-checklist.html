<!doctype html>
<!--
  FIRESHIP TERMINAL · tier2 · list · CHECKLIST
  Bottom-left panel. A small mono title sits above three rows, each pairing
  a syntax-green "✓" that STAMPS in with a mono item line that snaps in
  right behind it; rows stagger ~0.3s apart.
  Slots: title, i1, i2, i3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-list-checklist {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-mono);
      }

      #t2-list-checklist .panel {
        position: absolute; left: 80px; bottom: 74px; z-index: 3;
        width: 620px;
        background: var(--panel); border: 1px solid var(--panel-edge);
        border-radius: var(--radius);
        padding: 26px 32px 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }

      #t2-list-checklist .title {
        font-size: var(--size-label); color: var(--text-dim);
        letter-spacing: 0.1em; text-transform: uppercase;
        margin-bottom: 18px;
      }

      #t2-list-checklist .row {
        display: flex; align-items: baseline; gap: 16px;
        margin-top: 12px;
      }
      #t2-list-checklist .row:first-of-type { margin-top: 0; }

      #t2-list-checklist .check {
        color: var(--syn-green); font-size: 28px; font-weight: var(--wt-bold);
        transform-origin: 50% 50%;
      }
      #t2-list-checklist .item {
        color: var(--text); font-size: var(--size-body); font-weight: var(--wt-med);
      }
    </style>
  </head>
  <body>
    <div id="t2-list-checklist" data-composition-id="t2-list-checklist" data-start="0" data-width="1920" data-height="1080">
      <div class="panel">
        <div class="title" data-slot="title">SHIP CHECKLIST</div>
        <div class="row"><span class="check">&#10003;</span><span class="item" data-slot="i1">Tests passing</span></div>
        <div class="row"><span class="check">&#10003;</span><span class="item" data-slot="i2">Types checked</span></div>
        <div class="row"><span class="check">&#10003;</span><span class="item" data-slot="i3">Docs updated</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-list-checklist";

      const tl = gsap.timeline({ paused: true });

      /* panel + title snap in */
      tl.from(root + " .panel", { autoAlpha: 0, y: 24, duration: 0.3, ease: "expo.out" }, 0.1)
        .from(root + " .title", { autoAlpha: 0, y: -8, duration: 0.24, ease: "expo.out" }, ">-0.1")

        /* row 1 — check STAMPS, item snaps in behind it */
        .from(root + " .row:nth-child(2) .check", {
          autoAlpha: 0, scale: 1.6, duration: 0.28, ease: "back.out(2.2)"
        }, ">0.15")
        .from(root + " .row:nth-child(2) .item", { autoAlpha: 0, x: -10, duration: 0.22, ease: "expo.out" }, ">-0.08")

        /* row 2 */
        .from(root + " .row:nth-child(3) .check", {
          autoAlpha: 0, scale: 1.6, duration: 0.28, ease: "back.out(2.2)"
        }, ">0.3")
        .from(root + " .row:nth-child(3) .item", { autoAlpha: 0, x: -10, duration: 0.22, ease: "expo.out" }, ">-0.08")

        /* row 3 */
        .from(root + " .row:nth-child(4) .check", {
          autoAlpha: 0, scale: 1.6, duration: 0.28, ease: "back.out(2.2)"
        }, ">0.3")
        .from(root + " .row:nth-child(4) .item", { autoAlpha: 0, x: -10, duration: 0.22, ease: "expo.out" }, ">-0.08")

        /* dead stillness — the hold is the timing */
        .set({}, {}, 6);

      window.__timelines["t2-list-checklist"] = tl;
    </script>
  </body>
</html>
