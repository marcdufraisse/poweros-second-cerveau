<!doctype html>
<!--
  FIRESHIP TERMINAL · tier2 · label · BADGE
  Top-right corner-safe badge chip: a rounded panel with a 2px flame-gradient
  ring (dual-background border technique) holding mono uppercase text. It
  STAMPS in with an impact shake, then holds one finite glow pulse.
  Slots: badge.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-label-badge {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-mono);
      }

      #t2-label-badge .badge {
        position: absolute; top: 64px; right: 64px; z-index: 3;
        max-width: 440px;
        display: inline-block;
        border-radius: 999px;
        border: 2px solid transparent;
        background-image: linear-gradient(var(--panel), var(--panel)), var(--flame-grad);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        padding: 16px 34px;
        transform-origin: 50% 50%;
      }

      #t2-label-badge .badge-text {
        font-size: var(--size-label); font-weight: var(--wt-bold);
        color: var(--cream); letter-spacing: 0.12em; text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-label-badge" data-composition-id="t2-label-badge" data-start="0" data-width="1920" data-height="1080">
      <div class="badge">
        <span class="badge-text" data-slot="badge">NEW IN v2.0</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-label-badge";

      const tl = gsap.timeline({ paused: true });

      /* the STAMP */
      tl.from(root + " .badge", {
          autoAlpha: 0, scale: 1.6, duration: 0.28, ease: "back.out(2.2)"
        }, 0.15)

        /* impact shake — finite, hard cut, no drift */
        .to(root + " .badge", {
          keyframes: { x: [0, -10, 9, -6, 4, 0] },
          duration: 0.26, ease: "none"
        }, ">-0.02")

        /* one finite glow pulse */
        .to(root + " .badge", {
          boxShadow: "0 0 0 3px rgba(var(--flame-rgb), 0.55), 0 0 40px rgba(var(--flame-rgb), 0.65)",
          duration: 0.32, ease: "power2.out"
        }, ">0.1")
        .to(root + " .badge", {
          boxShadow: "0 0 0 0px rgba(var(--flame-rgb), 0), 0 0 0px rgba(var(--flame-rgb), 0)",
          duration: 0.5, ease: "power2.in"
        }, ">0.05")

        /* dead stillness — the hold is the timing */
        .set({}, {}, 6);

      window.__timelines["t2-label-badge"] = tl;
    </script>
  </body>
</html>
