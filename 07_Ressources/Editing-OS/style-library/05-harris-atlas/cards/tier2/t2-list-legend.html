<!doctype html>
<!--
  HARRIS ATLAS · tier2 · list · LEGEND
  Bottom-left parchment plate styled as a map legend: a small Oswald caps
  title, then three rows (color swatch + Oswald label) using the slate,
  accent, and red swatch colors. Rows stamp in one after another like legend
  keys printing onto the plate. Transparent page ground.
  Slots: title, i1, i2, i3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-list-legend {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
        overflow: hidden;
      }

      #t2-list-legend .plate {
        position: absolute; left: 90px; bottom: 84px; z-index: 5;
        width: 460px;
        background: var(--parchment-hi);
        border: 1px solid rgba(var(--ink-rgb), 0.5);
        border-radius: var(--radius-sm);
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        padding: 22px 28px 24px;
        transform-origin: 0% 100%;
      }
      #t2-list-legend .plate::before {
        content: ""; position: absolute; inset: 0;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.12; pointer-events: none;
      }
      #t2-list-legend .title {
        position: relative; z-index: 1;
        font-weight: var(--wt-semi); font-size: var(--size-label);
        color: var(--ink); letter-spacing: var(--track-caps);
        text-transform: uppercase; margin-bottom: 14px;
        padding-bottom: 10px; border-bottom: var(--hairline);
      }
      #t2-list-legend .row {
        position: relative; z-index: 1;
        display: flex; align-items: center; gap: 14px;
        margin-top: 12px;
      }
      #t2-list-legend .row:first-of-type { margin-top: 0; }
      #t2-list-legend .swatch {
        width: 20px; height: 20px; flex: 0 0 auto;
        border: 1px solid rgba(var(--ink-rgb), 0.4);
      }
      #t2-list-legend .swatch.slate  { background: var(--slate); }
      #t2-list-legend .swatch.accent { background: var(--accent); }
      #t2-list-legend .swatch.red    { background: var(--red); }
      #t2-list-legend .item {
        font-weight: var(--wt-med); font-size: 24px;
        color: var(--ink); letter-spacing: 0.03em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="t2-list-legend" data-composition-id="t2-list-legend" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="title" data-slot="title">INVESTIGATION LEGEND</div>
        <div class="row"><div class="swatch slate"></div><div class="item" data-slot="i1">CURRICULUM RISK</div></div>
        <div class="row"><div class="swatch accent"></div><div class="item" data-slot="i2">EARLY ADOPTER TERRITORY</div></div>
        <div class="row"><div class="swatch red"></div><div class="item" data-slot="i3">CONTESTED GROUND</div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-list-legend";

      tl.from(root + " .plate", { autoAlpha: 0, scale: 1.12, y: 16, duration: 0.5, ease: "expo.out" }, 0.1)
        .from(root + " .title", { autoAlpha: 0, y: -6, duration: 0.4, ease: "expo.out" }, 0.45)
        .from(root + " .row:nth-of-type(1)", { autoAlpha: 0, x: -14, duration: 0.4, ease: "expo.out" }, 0.7)
        .from(root + " .row:nth-of-type(2)", { autoAlpha: 0, x: -14, duration: 0.4, ease: "expo.out" }, 0.95)
        .from(root + " .row:nth-of-type(3)", { autoAlpha: 0, x: -14, duration: 0.4, ease: "expo.out" }, 1.2)
        .set({}, {}, 6);

      window.__timelines["t2-list-legend"] = tl;
    </script>
  </body>
</html>
