<!doctype html>
<!--
  HARRIS ATLAS · tier2 · label · COORD
  Top-left compact parchment chip: Courier uppercase label line above a
  bolder Oswald value line, with a tiny accent-blue tick on the chip's left
  edge. The whole chip stamps in like a coordinate pin on a map plate.
  Transparent page ground — sits over talking-head footage.
  Slots: label, value.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-label-coord {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
        overflow: hidden;
      }

      #t2-label-coord .chip {
        position: absolute; top: 90px; left: 90px; z-index: 5;
        max-width: 520px; max-height: 230px;
        background: var(--parchment-hi);
        border: 1px solid rgba(var(--ink-rgb), 0.5);
        border-radius: var(--radius-sm);
        box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        padding: 20px 28px 22px 32px;
        transform-origin: 0% 0%;
      }
      #t2-label-coord .chip::before {
        content: ""; position: absolute; inset: 0;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.12; pointer-events: none;
      }
      /* accent-blue tick on the chip's left edge */
      #t2-label-coord .tick {
        position: absolute; left: 0; top: 22px; width: 6px; height: 22px;
        background: var(--accent);
      }
      #t2-label-coord .label {
        position: relative; z-index: 1;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.72); letter-spacing: 0.10em;
        text-transform: uppercase; margin-bottom: 6px;
      }
      #t2-label-coord .value {
        position: relative; z-index: 1;
        font-weight: var(--wt-semi); font-size: 42px; line-height: 1.05;
        color: var(--ink); letter-spacing: var(--track-caps);
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="t2-label-coord" data-composition-id="t2-label-coord" data-start="0" data-width="1920" data-height="1080">
      <div class="chip">
        <div class="tick"></div>
        <div class="label" data-slot="label">COORDINATES · SIGNAL</div>
        <div class="value" data-slot="value">38.90&deg; N, 77.03&deg; W</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-label-coord";

      tl.from(root + " .chip", { autoAlpha: 0, scale: 1.12, y: -10, duration: 0.45, ease: "expo.out" }, 0.15)
        .from(root + " .tick", { scaleY: 0, transformOrigin: "50% 0%", duration: 0.4, ease: "power2.out" }, 0.45)
        .from(root + " .label", { autoAlpha: 0, y: -6, duration: 0.4, ease: "expo.out" }, 0.55)
        .from(root + " .value", { autoAlpha: 0, y: 8, duration: 0.45, ease: "expo.out" }, 0.7)
        .set({}, {}, 6);

      window.__timelines["t2-label-coord"] = tl;
    </script>
  </body>
</html>
