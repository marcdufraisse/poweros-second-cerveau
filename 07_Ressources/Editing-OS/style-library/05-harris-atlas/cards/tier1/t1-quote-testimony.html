<!doctype html>
<!--
  HARRIS ATLAS · tier1 · quote · TESTIMONY
  Full-screen takeover. A printed testimony plate: parchment ground with
  paper grain and a soft lit-paper glow, an oversized slate quotation mark
  sitting behind the first line, serif italic quote settling over it, and a
  boxed white-on-slate attribution name with a Courier role line beneath.
  Slots: quote, name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-testimony {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-quote-testimony .ground {
        position: absolute; inset: -60px; z-index: 1;
        background: radial-gradient(60% 60% at 40% 42%, var(--parchment-hi) 0%, var(--parchment) 70%);
      }

      #t1-quote-testimony .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-quote-testimony .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-quote-testimony .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-quote-testimony .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-quote-testimony .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-quote-testimony .coord.tl { top: 54px; left: 62px; }
      #t1-quote-testimony .coord.br { bottom: 54px; right: 62px; }

      #t1-quote-testimony .wrap {
        position: absolute; z-index: 5; left: 50%; top: 47%;
        transform: translate(-50%, -50%); width: 1360px;
      }
      #t1-quote-testimony .qmark {
        position: absolute; top: -150px; left: -70px; z-index: 1;
        font-family: var(--font-body); font-size: 440px; line-height: 1;
        color: var(--slate); opacity: 0.32; user-select: none;
      }
      #t1-quote-testimony .quote {
        position: relative; z-index: 2;
        font-family: var(--font-body); font-style: italic;
        font-size: var(--size-headline); line-height: 1.42; color: var(--ink);
      }
      #t1-quote-testimony .attr {
        position: relative; z-index: 2; margin-top: 46px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
      }
      #t1-quote-testimony .boxed {
        display: inline-block; background: var(--label-bg); color: var(--white);
        padding: var(--label-pad); border-radius: var(--radius-sm);
        font-weight: var(--wt-med); font-size: var(--size-label);
        letter-spacing: var(--track-caps); text-transform: uppercase;
      }
      #t1-quote-testimony .role {
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.68); letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-testimony" data-composition-id="t1-quote-testimony" data-start="0" data-width="1920" data-height="1080">

      <div class="ground"></div>
      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">TESTIMONY · MEMBER FILE</div>
      <div class="coord br" data-slot="coord">ACME ARCHIVE · SHEET 45</div>

      <div class="wrap">
        <div class="qmark">&ldquo;</div>
        <div class="quote" data-slot="quote">I didn&rsquo;t think a forty-five-minute call could change how I run my company. It did.</div>
        <div class="attr">
          <div class="boxed" data-slot="name">DENISE OKAFOR</div>
          <div class="role" data-slot="role">OPERATIONS LEAD · ACME MEMBER SINCE 2022</div>
        </div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-quote-testimony";

      const tl = gsap.timeline({ paused: true });

      /* slow documentary push-in — GROUND ONLY */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "44% 46%", duration: 7, ease: "power2.inOut" }, 0)

        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        /* oversized quotation mark settles behind the text first */
        .from(root + " .qmark", { autoAlpha: 0, scale: 1.1, duration: 0.9, ease: "power2.out" }, 1.0)

        /* quote settles over it */
        .from(root + " .quote", { autoAlpha: 0, y: 22, duration: 0.8, ease: "power2.out" }, 1.4)

        /* attribution stamps in: boxed name, then role line */
        .from(root + " .boxed", { autoAlpha: 0, scale: 1.12, duration: 0.45, ease: "expo.out" }, 2.5)
        .from(root + " .role", { autoAlpha: 0, y: 10, duration: 0.5, ease: "power2.out" }, 2.85)

        .set({}, {}, 7);

      window.__timelines["t1-quote-testimony"] = tl;
    </script>
  </body>
</html>
