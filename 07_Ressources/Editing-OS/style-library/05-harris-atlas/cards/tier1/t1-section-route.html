<!doctype html>
<!--
  HARRIS ATLAS · tier1 · section · ROUTE
  Full-screen takeover. Atlas itinerary card: a mono kicker + huge Oswald
  title sit in the upper half; a dashed route line draws across the lower
  third between two pinned endpoints, each carrying a boxed slate label.
  Slow push-in on the map ground only; the route + labels stay pin-sharp.
  Slots: kicker (text), title (text), from (text — start-point label),
  to (text — end-point label).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-route {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* map ground — pushed-in by the timeline (background only, text stays sharp) */
      #t1-section-route .ground {
        position: absolute; inset: -60px; z-index: 1;
      }
      #t1-section-route .ground svg { width: 100%; height: 100%; }

      #t1-section-route .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-section-route .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-section-route .vig { position: absolute; inset: 0; z-index: 7; background: var(--vignette); pointer-events: none; }

      #t1-section-route .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-section-route .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-section-route .coord.tl { top: 54px; left: 62px; }
      #t1-section-route .coord.br { bottom: 54px; right: 62px; }

      #t1-section-route .upper {
        position: absolute; top: 150px; left: 0; right: 0; z-index: 5;
        text-align: center;
      }
      #t1-section-route .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--ink-rgb), 0.72); letter-spacing: var(--track-wide);
        text-transform: uppercase; margin-bottom: 16px;
      }
      #t1-section-route .title {
        font-weight: var(--wt-semi); font-size: var(--size-title);
        line-height: 1.05; letter-spacing: 0.01em; color: var(--ink);
        text-transform: uppercase; margin: 0 auto; max-width: 1500px;
      }

      /* dashed route + endpoint dots — a fixed annotation layer, not the ground (stays pin-sharp) */
      #t1-section-route .annotations { position: absolute; inset: 0; z-index: 5; }
      #t1-section-route .annotations svg { width: 100%; height: 100%; }
      #t1-section-route .route {
        transform-box: fill-box; transform-origin: left center;
      }
      #t1-section-route .dot {
        transform-box: fill-box; transform-origin: 50% 50%;
      }

      #t1-section-route .pin {
        position: absolute; z-index: 6; transform: translate(-50%, 0);
        display: flex; flex-direction: column; align-items: center;
      }
      #t1-section-route .pin.a { left: 460px; top: 828px; }
      #t1-section-route .pin.b { left: 1460px; top: 828px; }
      #t1-section-route .pin .boxed {
        background: var(--label-bg); color: var(--white);
        padding: var(--label-pad); border-radius: var(--radius-sm);
        font-weight: var(--wt-med); font-size: var(--size-label);
        letter-spacing: var(--track-caps); text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-route" data-composition-id="t1-section-route" data-start="0" data-width="1920" data-height="1080">

      <div class="ground">
        <!-- abstract coastline: sage ocean, parchment landmass (no literal geography) -->
        <svg viewBox="0 0 2040 1200" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="2040" height="1200" fill="var(--sage)"/>
          <path d="M -80 500 C 260 380, 620 470, 860 410 C 1120 350, 1300 490, 1540 460 C 1800 430, 1980 540, 2120 510 L 2120 1300 L -80 1300 Z"
                fill="var(--parchment)"/>
        </svg>
      </div>

      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">PLATE 09 · ITINERARY</div>
      <div class="coord br">ACME ARCHIVE · SHEET 08</div>

      <div class="upper">
        <div class="kicker" data-slot="kicker">THE PATH TO CERTIFICATION</div>
        <h2 class="title" data-slot="title">FROM FIRST PROMPT TO FIELD-READY</h2>
      </div>

      <div class="annotations">
        <svg viewBox="0 0 1920 1080">
          <path d="M 460 800 H 1460" fill="none" stroke="rgba(42,36,28,0.55)" stroke-width="3" stroke-dasharray="16 12" class="route"/>
          <circle cx="460" cy="800" r="11" fill="var(--accent)" class="dot dot-a"/>
          <circle cx="1460" cy="800" r="11" fill="var(--accent)" class="dot dot-b"/>
        </svg>
      </div>

      <div class="pin a">
        <div class="boxed" data-slot="from">ENROLLMENT</div>
      </div>
      <div class="pin b">
        <div class="boxed" data-slot="to">CERTIFIED IN THE FIELD</div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-route";

      /* slow documentary push-in — GROUND ONLY, text stays pin-sharp */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "50% 40%", duration: 7, ease: "power2.inOut" }, 0)

        /* plate + coordinates print on */
        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        /* kicker + title settle in the upper half */
        .from(root + " .kicker", { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out" }, 1.0)
        .from(root + " .title", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 1.35)

        /* start dot pops, the dashed route draws across, end dot pops */
        .from(root + " .dot-a", { scale: 0, duration: 0.35, ease: "expo.out" }, 2.1)
        .fromTo(root + " .route", { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power1.inOut" }, 2.3)
        .from(root + " .dot-b", { scale: 0, duration: 0.35, ease: "expo.out" }, 3.5)

        /* boxed endpoint labels stamp in with their dots */
        .from(root + " .pin.a", { autoAlpha: 0, scale: 1.12, duration: 0.45, ease: "expo.out" }, 2.5)
        .from(root + " .pin.b", { autoAlpha: 0, scale: 1.12, duration: 0.45, ease: "expo.out" }, 3.7)

        .set({}, {}, 7);

      window.__timelines["t1-section-route"] = tl;
    </script>
  </body>
</html>
