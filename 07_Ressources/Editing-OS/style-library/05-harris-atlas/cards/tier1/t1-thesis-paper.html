<!doctype html>
<!--
  HARRIS ATLAS · tier1 · thesis · PAPER
  Full-screen takeover. Printed atlas plate: parchment ground with a faint
  coastline pushing in behind a plate frame + corner coordinates. A mono
  kicker sits above a giant two-line Oswald headline; the headline's key
  word (wrapped in <em>) is set in accent blue with a thick underline that
  draws in right after the headline stamps.
  Slots: kicker (text), headline (richtext — wrap the key word in <em>).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-paper {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* map ground — pushed-in by the timeline (background only, text stays sharp) */
      #t1-thesis-paper .ground {
        position: absolute; inset: -60px; z-index: 1;
      }
      #t1-thesis-paper .ground svg { width: 100%; height: 100%; }

      #t1-thesis-paper .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-thesis-paper .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-thesis-paper .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-thesis-paper .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-thesis-paper .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-thesis-paper .coord.tl { top: 54px; left: 62px; }
      #t1-thesis-paper .coord.br { bottom: 54px; right: 62px; }

      #t1-thesis-paper .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 140px;
      }
      #t1-thesis-paper .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--ink-rgb), 0.72); letter-spacing: var(--track-wide);
        margin-bottom: 26px; text-transform: uppercase;
      }
      #t1-thesis-paper .headline {
        font-weight: var(--wt-semi); font-size: var(--size-display);
        line-height: 1.1; letter-spacing: 0.01em; color: var(--ink);
        text-transform: uppercase; margin: 0; max-width: 1520px;
      }
      #t1-thesis-paper .headline em {
        font-style: normal; color: var(--accent); position: relative; display: inline-block;
      }
      #t1-thesis-paper .headline em::after {
        content: ""; position: absolute; left: 2px; right: 2px; bottom: -0.1em; height: 0.09em;
        background: var(--accent); transform-origin: left center; transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-paper" data-composition-id="t1-thesis-paper" data-start="0" data-width="1920" data-height="1080">

      <div class="ground">
        <!-- abstract coastline: sage ocean, parchment landmass (no literal geography) -->
        <svg viewBox="0 0 2040 1200" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="2040" height="1200" fill="var(--sage)" opacity="0.55"/>
          <path d="M -80 220 C 260 100, 600 190, 840 120 C 1100 50, 1300 200, 1560 160 C 1820 120, 2000 240, 2120 210 L 2120 1300 L -80 1300 Z"
                fill="var(--parchment)"/>
        </svg>
      </div>

      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">PLATE 14 · ARCHIVE</div>
      <div class="coord br">ACME DOSSIER · SHEET 03</div>

      <div class="center">
        <div class="kicker" data-slot="kicker">FIELD NOTES · ACME ARCHIVE</div>
        <h1 class="headline" data-slot="headline">THE CLASSROOM BECAME THE<br/><em>PROOF</em></h1>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-paper";

      /* slow documentary push-in — GROUND ONLY, text stays pin-sharp */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "50% 45%", duration: 7, ease: "power2.inOut" }, 0)

        /* plate + coordinates print on */
        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        /* kicker settles, then the headline STAMPS */
        .from(root + " .kicker", { autoAlpha: 0, y: 14, duration: 0.55, ease: "expo.out" }, 1.0)
        .from(root + " .headline", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 1.35)

        /* the key-word underline draws in after the headline lands */
        .to(root + " .headline em::after", { scaleX: 1, duration: 0.9, ease: "power1.inOut" }, 2.1)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-paper"] = tl;
    </script>
  </body>
</html>
