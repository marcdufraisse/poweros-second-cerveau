<!doctype html>
<!--
  HARRIS ATLAS · tier1 · section · FILM
  Full-screen takeover. Archival film chapter card: near-black ground with
  grain + heavy vignette, deterministic sprocket-hole strips run down both
  edges, a Courier chapter index types on top-center, and a huge cream
  Oswald title stamps in at center. A single warm burn wash sweeps across
  once at the very start as the transition-in.
  Slots: index (text — chapter index string), title (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-film {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--film); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }

      /* film ground — pushed-in by the timeline (background only, text stays sharp) */
      #t1-section-film .ground {
        position: absolute; inset: -60px; z-index: 1;
        background: radial-gradient(120% 100% at 65% 30%, rgba(244, 237, 220, 0.05), transparent 60%), var(--film);
      }

      #t1-section-film .grain {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.14;
      }
      #t1-section-film .vig { position: absolute; inset: 0; z-index: 7; background: var(--vignette); pointer-events: none; }

      /* single burn wash — the transition-in, sweeps once then clears */
      #t1-section-film .burn {
        position: absolute; inset: -10% -40%; z-index: 8; pointer-events: none;
        background: var(--burn); opacity: 0;
      }

      /* deterministic sprocket-hole strips (repeating-linear-gradient, no randomness) */
      #t1-section-film .sprocket {
        position: absolute; top: 0; bottom: 0; width: 40px; z-index: 3; pointer-events: none;
        background-image: repeating-linear-gradient(to bottom,
          rgba(244, 237, 220, 0.16) 0px, rgba(244, 237, 220, 0.16) 30px,
          transparent 30px, transparent 68px);
      }
      #t1-section-film .sprocket.left { left: 22px; }
      #t1-section-film .sprocket.right { right: 22px; }

      #t1-section-film .index {
        position: absolute; top: 100px; left: 0; right: 0; z-index: 5;
        text-align: center; font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(244, 237, 220, 0.78); letter-spacing: 0.14em; text-transform: uppercase;
      }

      #t1-section-film .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 0 200px;
      }
      #t1-section-film .title {
        font-weight: var(--wt-semi); font-size: var(--size-display);
        line-height: 1.08; letter-spacing: 0.01em; color: var(--cream);
        text-transform: uppercase; margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-film" data-composition-id="t1-section-film" data-start="0" data-width="1920" data-height="1080">

      <div class="ground"></div>
      <div class="grain"></div>
      <div class="sprocket left"></div>
      <div class="sprocket right"></div>

      <div class="index" data-slot="index">CHAPTER 04</div>

      <div class="center">
        <h1 class="title" data-slot="title">THE COHORT THAT<br/>TAUGHT ITSELF</h1>
      </div>

      <div class="burn"></div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-film";

      /* pre-split the chapter index into char spans for a deterministic typewriter reveal */
      (function splitChars(selector) {
        const el = document.querySelector(selector);
        const text = el.textContent;
        el.textContent = "";
        const frag = document.createDocumentFragment();
        for (const ch of text) {
          const span = document.createElement("span");
          span.textContent = ch === " " ? " " : ch;
          span.style.opacity = "0";
          frag.appendChild(span);
        }
        el.appendChild(frag);
      })(root + " .index");

      /* slow documentary push-in — GROUND ONLY, text stays pin-sharp */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "60% 35%", duration: 7, ease: "power2.inOut" }, 0)

        /* the burn wash sweeps across once as the transition-in, then clears */
        .fromTo(root + " .burn", { x: "-18%", opacity: 0 }, { x: "0%", opacity: 0.9, duration: 0.5, ease: "power2.inOut" }, 0)
        .to(root + " .burn", { x: "18%", opacity: 0, duration: 0.6, ease: "power2.inOut" }, 0.5)

        .from(root + " .sprocket", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0.2)

        /* chapter index types on */
        .to(root + " .index span", { opacity: 1, duration: 0.02, stagger: 0.03, ease: "none" }, 1.3)

        /* title STAMPS in at center */
        .from(root + " .title", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t1-section-film"] = tl;
    </script>
  </body>
</html>
