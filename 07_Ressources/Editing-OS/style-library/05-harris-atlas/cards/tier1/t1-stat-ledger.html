<!doctype html>
<!--
  HARRIS ATLAS · tier1 · stat · LEDGER
  Full-screen takeover. An archival ledger page: ruled parchment ground with
  a thin red margin rule, Oswald caps title, three Courier label/value rows
  divided by ink hairlines. The third row is the payoff — accent-blue text
  under an accent-blue hairline — and rows stamp in one at a time.
  Slots: title, r1l, r1v, r2l, r2v, r3l, r3v.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-ledger {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--parchment); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* ruled ledger ground — pushed-in by the timeline */
      #t1-stat-ledger .ground { position: absolute; inset: -60px; z-index: 1; }
      #t1-stat-ledger .ground svg { width: 100%; height: 100%; }

      #t1-stat-ledger .paper {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-paper); background-size: 240px 240px;
        mix-blend-mode: multiply; opacity: 0.16;
      }
      #t1-stat-ledger .age { position: absolute; inset: 0; z-index: 2; background: var(--paper-edge); pointer-events: none; }
      #t1-stat-ledger .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-stat-ledger .plate {
        position: absolute; inset: 40px; z-index: 4;
        border: var(--frame); border-radius: var(--radius-sm);
        pointer-events: none;
      }
      #t1-stat-ledger .coord {
        position: absolute; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: rgba(var(--ink-rgb), 0.65); letter-spacing: 0.06em;
      }
      #t1-stat-ledger .coord.tl { top: 54px; left: 62px; }
      #t1-stat-ledger .coord.br { bottom: 54px; right: 62px; }

      #t1-stat-ledger .book {
        position: absolute; z-index: 5; left: 50%; top: 50%;
        transform: translate(-50%, -50%); width: 980px;
      }
      #t1-stat-ledger .title {
        font-weight: var(--wt-semi); font-size: 62px; letter-spacing: var(--track-caps);
        text-transform: uppercase; text-align: center; color: var(--ink);
        margin-bottom: 46px;
      }
      #t1-stat-ledger .row {
        display: flex; justify-content: space-between; align-items: baseline;
        font-family: var(--font-mono); font-size: var(--size-body);
        padding: 20px 6px; color: rgba(var(--ink-rgb), 0.88);
        transform-origin: center;
      }
      #t1-stat-ledger .row .l { letter-spacing: 0.04em; }
      #t1-stat-ledger .row .v { font-weight: 700; }
      #t1-stat-ledger .row.payoff { color: var(--accent); }
      #t1-stat-ledger .row.payoff .l,
      #t1-stat-ledger .row.payoff .v { color: var(--accent); }

      #t1-stat-ledger .hr {
        width: 100%; height: 0; border-top: var(--hairline);
        transform: scaleX(0); transform-origin: left center;
      }
      #t1-stat-ledger .hr.accent { border-top: 2px solid var(--accent); }
    </style>
  </head>
  <body>
    <div id="t1-stat-ledger" data-composition-id="t1-stat-ledger" data-start="0" data-width="1920" data-height="1080">

      <div class="ground">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="1920" height="1080" fill="var(--parchment)"/>
          <g stroke="rgba(42,36,28,0.10)" stroke-width="2">
            <line x1="0" y1="150" x2="1920" y2="150"/>
            <line x1="0" y1="290" x2="1920" y2="290"/>
            <line x1="0" y1="430" x2="1920" y2="430"/>
            <line x1="0" y1="570" x2="1920" y2="570"/>
            <line x1="0" y1="710" x2="1920" y2="710"/>
            <line x1="0" y1="850" x2="1920" y2="850"/>
            <line x1="0" y1="990" x2="1920" y2="990"/>
          </g>
          <line x1="330" y1="0" x2="330" y2="1080" stroke="var(--red)" stroke-width="2.5" opacity="0.55"/>
        </svg>
      </div>

      <div class="paper"></div>
      <div class="age"></div>
      <div class="plate"></div>
      <div class="coord tl">LEDGER 03 · MEMBER ACCOUNTS</div>
      <div class="coord br" data-slot="coord">ACME ARCHIVE · SHEET 33</div>

      <div class="book">
        <div class="title" data-slot="title">THE AUTOMATION LEDGER</div>

        <div class="row r1">
          <span class="l" data-slot="r1l">HOURS LOGGED IN TRAINING</span>
          <span class="v" data-slot="r1v">126</span>
        </div>
        <div class="hr h1"></div>

        <div class="row r2">
          <span class="l" data-slot="r2l">WORKFLOWS AUTOMATED</span>
          <span class="v" data-slot="r2v">34</span>
        </div>
        <div class="hr h2 accent"></div>

        <div class="row r3 payoff">
          <span class="l" data-slot="r3l">REVENUE RECOVERED</span>
          <span class="v" data-slot="r3v">$212,000</span>
        </div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-stat-ledger";

      const tl = gsap.timeline({ paused: true });

      /* slow documentary push-in — GROUND ONLY */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "50% 48%", duration: 7, ease: "power2.inOut" }, 0)

        .from(root + " .plate", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15)
        .from(root + " .coord.tl", { opacity: 0, y: -8, duration: 0.5, ease: "expo.out" }, 0.7)
        .from(root + " .coord.br", { opacity: 0, y: 8, duration: 0.5, ease: "expo.out" }, 0.85)

        .from(root + " .title", { autoAlpha: 0, y: 16, duration: 0.6, ease: "power2.out" }, 1.0)

        /* rows stamp in, one at a time, hairlines draw between them */
        .from(root + " .row.r1", { autoAlpha: 0, scale: 1.1, duration: 0.45, ease: "expo.out" }, 1.6)
        .fromTo(root + " .hr.h1", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power1.inOut" }, 2.0)

        .from(root + " .row.r2", { autoAlpha: 0, scale: 1.1, duration: 0.45, ease: "expo.out" }, 2.3)
        .fromTo(root + " .hr.h2", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power1.inOut" }, 2.7)

        .from(root + " .row.r3", { autoAlpha: 0, scale: 1.14, duration: 0.5, ease: "expo.out" }, 3.05)

        .set({}, {}, 7);

      window.__timelines["t1-stat-ledger"] = tl;
    </script>
  </body>
</html>
