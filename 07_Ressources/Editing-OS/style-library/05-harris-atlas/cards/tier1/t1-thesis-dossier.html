<!doctype html>
<!--
  HARRIS ATLAS · tier1 · thesis · DOSSIER
  Full-screen takeover. Archival film ground: near-black with grain +
  heavy vignette. A Courier case-file header types on top-left, then a
  huge cream Oswald headline stamps in with a thin cream rule drawing
  beneath it. A faint finite projector flicker plays under everything.
  Slots: file (text — case-file header string), headline (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-dossier {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--film); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }

      /* film ground — pushed-in by the timeline (background only, text stays sharp) */
      #t1-thesis-dossier .ground {
        position: absolute; inset: -60px; z-index: 1;
        background: radial-gradient(120% 100% at 30% 20%, rgba(244, 237, 220, 0.05), transparent 60%), var(--film);
      }

      #t1-thesis-dossier .grain {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.14;
      }
      #t1-thesis-dossier .vig { position: absolute; inset: 0; z-index: 6; background: var(--vignette); pointer-events: none; }

      #t1-thesis-dossier .header {
        position: absolute; top: 74px; left: 90px; z-index: 5;
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(244, 237, 220, 0.78); letter-spacing: 0.10em;
        text-transform: uppercase; white-space: pre;
      }

      #t1-thesis-dossier .center {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
        padding: 0 150px;
      }
      #t1-thesis-dossier .headline {
        font-weight: var(--wt-semi); font-size: var(--size-display);
        line-height: 1.08; letter-spacing: 0.01em; color: var(--cream);
        text-transform: uppercase; margin: 0; max-width: 1420px;
      }
      #t1-thesis-dossier .rule {
        margin-top: 34px; height: 4px; width: 340px;
        background: rgba(244, 237, 220, 0.85); transform-origin: left center; transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-dossier" data-composition-id="t1-thesis-dossier" data-start="0" data-width="1920" data-height="1080">

      <div class="ground"></div>
      <div class="grain"></div>

      <div class="header" data-slot="file">CASE FILE · 042</div>

      <div class="center">
        <h1 class="headline" data-slot="headline">THE CERTIFICATE THAT<br/>OUTLASTED THE HYPE</h1>
        <div class="rule"></div>
      </div>

      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-dossier";

      /* pre-split the case-file header into char spans for a deterministic typewriter reveal */
      (function splitChars(selector) {
        const el = document.querySelector(selector);
        const text = el.textContent;
        el.textContent = "";
        const frag = document.createDocumentFragment();
        for (const ch of text) {
          const span = document.createElement("span");
          span.textContent = ch === " " ? " " : ch;
          span.style.opacity = "0";
          frag.appendChild(span);
        }
        el.appendChild(frag);
      })(root + " .header");

      /* slow documentary push-in — GROUND ONLY, text stays pin-sharp */
      tl.fromTo(root + " .ground", { scale: 1.0 }, { scale: 1.06, transformOrigin: "35% 40%", duration: 7, ease: "power2.inOut" }, 0)

        /* case-file header types on, character by character */
        .to(root + " .header span", { opacity: 1, duration: 0.02, stagger: 0.03, ease: "none" }, 0.3)

        /* headline STAMPS, then the rule draws beneath it */
        .from(root + " .headline", { autoAlpha: 0, scale: 1.12, duration: 0.55, ease: "expo.out" }, 1.6)
        .to(root + " .rule", { scaleX: 1, duration: 0.8, ease: "power1.inOut" }, 2.3)

        /* faint finite projector flicker across the whole ground */
        .to(root, { opacity: 0.97, duration: 0.12, repeat: 3, yoyo: true, ease: "none" }, 3.4)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-dossier"] = tl;
    </script>
  </body>
</html>
