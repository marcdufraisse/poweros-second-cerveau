<!doctype html>
<!--
  DAN KIEFT · custom · screen · ZOOM ON A REGION
  The second screen move: the whole screen is up, then we punch into ONE
  rectangle of it — the field he is actually talking about — and a yellow
  hairline frame plus a handwritten-feeling label name it.

  The punch is a transform on the screen wrapper, not a crop: the region's
  centre is translated to frame centre and scaled up. Feed the region as a
  percentage box (--rx/--ry/--rw/--rh = left/top/width/height in % of the
  screen), which is how Agent 3 will describe "the Generate button" or "the
  Scene context line" from a screenshot. Width and height are independent —
  the frame hugs what it shows.

  Slots: label (what the region IS), screen.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #screen-zoom-region {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--charcoal);
        font-family: var(--font-display);

        /* THE REGION — Agent 3 overwrites these four per beat.
           left / top / width / height as % of the screen. Width AND height are
           free: the frame hugs what it is showing (a wide short card, a line
           of text, a button). Forcing 16:9 made the frame overshoot on
           anything that is not a video — fixed 18/08. */
        --rx: 11%;
        --ry: 41%;
        --rw: 46%;
        --rh: 16%;
      }

      #screen-zoom-region .room {
        position: absolute; inset: 0;
        background:
          radial-gradient(70% 55% at 26% 12%, rgba(255,255,255,0.075), transparent 68%),
          radial-gradient(90% 70% at 50% 118%, rgba(0,0,0,0.55), transparent 62%);
      }

      #screen-zoom-region .stage {
        position: absolute; inset: 0;
        perspective: var(--perspective);
        perspective-origin: var(--perspective-origin);
        transform-style: preserve-3d;
      }

      /* .panel holds the 3D attitude, .zoom does the punch. Two layers so the
         perspective and the punch never fight over one transform. */
      #screen-zoom-region .panel {
        position: absolute; left: 50%; top: 50%;
        width: 1600px; height: 900px; margin: -450px 0 0 -800px;
        transform: translateZ(-160px) rotateY(-4deg) rotateX(1.5deg);
        transform-style: preserve-3d;
      }
      #screen-zoom-region .zoom {
        position: absolute; inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #screen-zoom-region .screen {
        position: absolute; inset: 0;
        border-radius: 12px; overflow: hidden;
        background: var(--charcoal-lit);
        box-shadow: var(--screen-shadow);
      }
      #screen-zoom-region .screen img,
      #screen-zoom-region .screen video {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }

      /* the yellow annotation frame, drawn ON the screen so it scales with it */
      #screen-zoom-region .frame {
        position: absolute;
        left: var(--rx); top: var(--ry);
        width: var(--rw); height: var(--rh);
        border: var(--frame-stroke) solid var(--yellow);
        border-radius: 6px;
        box-shadow: var(--yellow-glow);
        pointer-events: none;
      }
      /* label sits above the frame, in the frame's own scale — so it stays
         legible after the punch instead of ballooning */
      #screen-zoom-region .label {
        position: absolute; left: 0; bottom: calc(100% + 10px);
        font-family: var(--font-serif); font-style: italic;
        font-size: 30px; line-height: 1;
        color: var(--yellow);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="screen-zoom-region" data-composition-id="screen-zoom-region" data-start="0" data-width="1920" data-height="1080">
      <div class="room"></div>
      <div class="stage">
        <div class="panel">
          <div class="zoom">
            <div class="screen">
              <img data-slot="screen" src="../../references/prompt-carte-noire.png" alt="" />
            </div>
            <div class="frame">
              <div class="label" data-slot="label">Scene breakdown</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#screen-zoom-region";
      const el = document.querySelector(root);
      const css = getComputedStyle(el);
      const v = (n) => css.getPropertyValue(n).trim();
      const pct = (n) => parseFloat(v(n)) / 100;

      // Region geometry, in fractions of the screen.
      const rx = pct("--rx"), ry = pct("--ry"), rw = pct("--rw"), rh = pct("--rh");

      // Scale so the region fills ~78% of the frame (leave air around it).
      const scale = Math.min(0.78 / rw, 0.78 / rh);
      // Translate the region's centre to the panel's centre, pre-scale.
      const cx = (rx + rw / 2) - 0.5;
      const cy = (ry + rh / 2) - 0.5;
      const dx = -cx * 1600 * scale;
      const dy = -cy * 900 * scale;

      const tl = gsap.timeline({ paused: true });

      // 1. Wide: the whole screen, already drifting a touch.
      tl.fromTo(root + " .zoom",
        { scale: 1, x: 0, y: 0 },
        { scale: 1.04, x: 0, y: 0, duration: 1.6, ease: "none" }, 0);

      // 2. The frame draws on the region we are about to enter.
      tl.fromTo(root + " .frame",
        { opacity: 0, scale: 1.08, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: parseFloat(v("--dur-snap")), ease: "power3.out" }, 1.1);
      tl.fromTo(root + " .label",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.3);

      // 3. The punch. Fast, with the overshoot — this is the beat.
      tl.to(root + " .zoom",
        { scale: scale, x: dx, y: dy, duration: parseFloat(v("--dur-punch")), ease: "power3.inOut" }, 1.75);

      // 4. Held — but still creeping. A screen is never motionless.
      tl.to(root + " .zoom",
        { scale: scale * 1.05, x: dx * 1.05, y: dy * 1.05, duration: 4.5, ease: "none" }, 2.65);

      window.__timelines["screen-zoom-region"] = tl;
    </script>
  </body>
</html>
