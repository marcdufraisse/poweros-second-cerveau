<!doctype html>
<!--
  DAN KIEFT · tier1 · section · CARTON DE TECHNIQUE
  Relevé image par image sur RlKg6oXLf7Y (1:21 → 1:28).

  Coupe franche vers le bleu, puis quatre temps :
    1. le titre apparaît PETIT, centré
    2. il grossit en continu pendant tout le plan (7 s de push-in sur du texte)
    3. une barre-pilule se déploie sous lui, de gauche à droite, en ~0,5 s
    4. le sous-titre se révèle À L'INTÉRIEUR de la barre, de gauche à droite

  Le contenant arrive avant son contenu : c'est ce qui donne l'impression que
  la barre « apporte » le sous-titre au lieu de l'afficher. Et rien ne se fige :
  ça grossit encore au moment de la coupe.

  La scène a une vignette INVERSÉE — centre plus sombre que les bords — qui
  pousse le regard au milieu. C'est l'inverse du réflexe habituel.

  Slots: kicker (TECHNIQUE 1), sub (la ligne dans la barre).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t1-technique-card {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--royal-mist);
        font-family: var(--font-display);
      }

      /* vignette inversée : sombre au centre, plus clair sur les bords */
      #t1-technique-card .stage {
        position: absolute; inset: 0;
        background:
          radial-gradient(58% 62% at 50% 47%, var(--mist-core) 0%, transparent 74%),
          var(--royal-mist);
      }
      /* la brume : deux nappes très faibles, décalées, qui donnent du grain */
      #t1-technique-card .haze {
        position: absolute; inset: -10%;
        background:
          radial-gradient(30% 34% at 22% 30%, rgba(255,255,255,0.055), transparent 70%),
          radial-gradient(26% 30% at 78% 68%, rgba(255,255,255,0.045), transparent 70%),
          radial-gradient(34% 26% at 62% 22%, rgba(255,255,255,0.035), transparent 70%);
      }

      /* le bloc entier grossit : titre et barre ensemble, jamais séparément */
      #t1-technique-card .block {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 26px;
        will-change: transform;
      }
      #t1-technique-card .kicker {
        font-weight: var(--wt-bold); font-size: 92px; line-height: 1;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--white); white-space: nowrap;
      }

      /* la barre : elle se déploie en scaleX depuis le centre, donc aucun
         reflow, et son contenu est masqué tant qu'elle n'est pas ouverte */
      #t1-technique-card .bar {
        position: relative;
        padding: 11px 30px 13px; border-radius: 999px;
        background: linear-gradient(180deg, var(--pill-lit), var(--pill));
        box-shadow: 0 0 30px rgba(46, 108, 156, 0.5);
        transform: scaleX(0); transform-origin: 50% 50%;
      }
      #t1-technique-card .sub {
        display: block;
        font-weight: var(--wt-bold); font-size: 27px; line-height: 1;
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--white); white-space: nowrap;
        /* le texte se révèle de gauche à droite dans la barre */
        clip-path: inset(0 100% 0 0);
      }
    </style>
  </head>
  <body>
    <div id="t1-technique-card" data-composition-id="t1-technique-card" data-start="0" data-width="1920" data-height="1080">
      <div class="stage"></div>
      <div class="haze"></div>
      <div class="block">
        <div class="kicker" data-slot="kicker">Technique 1</div>
        <div class="bar"><span class="sub" data-slot="sub">Extending clips forward or backwards</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-technique-card";
      const tl = gsap.timeline({ paused: true });

      // 1+2. le bloc entre petit et grossit sans jamais s'arrêter.
      // translate(-50%,-50%) est déjà dans le CSS : on n'anime que l'échelle,
      // sinon GSAP écrase le centrage.
      tl.fromTo(root + " .block",
        { scale: 0.52, opacity: 0 },
        { scale: 0.62, opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
      tl.to(root + " .block",
        { scale: 1.18, duration: 9.5, ease: "none" }, 0.45);

      // 3. la barre se déploie — le contenant avant le contenu
      tl.to(root + " .bar",
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.3);

      // 4. puis le sous-titre la remplit, de gauche à droite
      tl.to(root + " .sub",
        { clipPath: "inset(0 0% 0 0)", duration: 0.62, ease: "power2.inOut" }, 2.72);

      // la brume dérive lentement en sens inverse du zoom : ça décolle le fond
      tl.fromTo(root + " .haze",
        { xPercent: 2, yPercent: -1 },
        { xPercent: -2, yPercent: 1, duration: 10, ease: "none" }, 0);

      window.__timelines["t1-technique-card"] = tl;
    </script>
  </body>
</html>
