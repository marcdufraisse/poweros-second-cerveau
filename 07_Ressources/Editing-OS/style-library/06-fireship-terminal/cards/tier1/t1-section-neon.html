<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · section · NEON
  Full-screen takeover. A small mono chapter index snaps in above; a neon
  wireframe rectangle (white edge + accent glow) flickers on with 2-3 quick
  opacity dips (finite) around a cream Luckiest-Guy title that stamps in
  inside it; once landed the glow settles into a soft finite pulse
  (repeat 2, yoyo). Dead stillness after.
  Slots: index (text), title (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-neon {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-section-neon .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-section-neon .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* mono chapter index, above the frame */
      #t1-section-neon .index {
        font-family: var(--font-mono); font-size: var(--size-label);
        color: var(--text-dim); letter-spacing: 0.08em;
        margin-bottom: 34px;
      }
      #t1-section-neon .index .prompt { color: var(--syn-purple); }

      /* neon wireframe rectangle */
      #t1-section-neon .frame {
        position: relative;
        padding: 56px 96px;
        border: var(--neon-edge);
        box-shadow: var(--neon-glow);
        background: rgba(255, 255, 255, 0.02);
        opacity: 0;
      }
      /* stronger glow overlay, cross-faded in for the settle pulse */
      #t1-section-neon .glow {
        position: absolute; inset: -2px; pointer-events: none;
        border: var(--neon-edge);
        box-shadow: 0 0 26px rgba(255, 255, 255, 0.95), 0 0 64px rgba(var(--accent-rgb), 0.85);
        opacity: 0;
      }

      /* title, stamps in inside the frame */
      #t1-section-neon .title {
        font-size: var(--size-display); line-height: 1.1;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--cream);
        -webkit-text-stroke: var(--stroke-w) var(--outline);
        paint-order: stroke fill;
        text-shadow: var(--caption-shadow);
        max-width: 1300px;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-neon" data-composition-id="t1-section-neon" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="index"><span class="prompt">//</span> <span data-slot="index">03 · the code report</span></div>
        <div class="frame">
          <div class="glow"></div>
          <div class="title" data-slot="title">CERTIFIED</div>
        </div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-section-neon";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .index", { autoAlpha: 0, y: -14, duration: 0.3, ease: "expo.out" }, 0.1)

        /* neon flicker-on — 2-3 quick opacity dips, then steady (finite) */
        .to(root + " .frame", { opacity: 1, duration: 0.04, ease: "none" }, 0.45)
        .to(root + " .frame", { opacity: 0.25, duration: 0.05, ease: "none" }, ">0.03")
        .to(root + " .frame", { opacity: 1, duration: 0.04, ease: "none" }, ">0.02")
        .to(root + " .frame", { opacity: 0.35, duration: 0.05, ease: "none" }, ">0.04")
        .to(root + " .frame", { opacity: 1, duration: 0.08, ease: "none" }, ">0.03")

        /* title stamps in inside the settled frame */
        .from(root + " .title", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "50% 55%",
          duration: 0.28, ease: "back.out(2.2)"
        }, ">0.1")

        /* glow settles into a soft steady pulse — finite, cross-faded overlay */
        .to(root + " .glow", {
          autoAlpha: 1, duration: 0.6, repeat: 2, yoyo: true, ease: "sine.inOut"
        }, ">0.15")

        /* dead stillness */
        .set({}, {}, 7);

      window.__timelines["t1-section-neon"] = tl;
    </script>
  </body>
</html>
