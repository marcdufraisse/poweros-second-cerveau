<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · thesis · ONEWORD
  Full-screen takeover. One mega cream Luckiest-Guy word STAMPS dead-center
  (scale 1.6→1, back.out, 0.28s) with the fat black rim; the instant it
  lands it takes a quick double impact shake (x keyframes, finite); a beat
  later a small mono sub-line snaps in below it. Dead stillness after.
  Slots: word, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-oneword {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--cream);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-thesis-oneword .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-thesis-oneword .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* the ONE mega word */
      #t1-thesis-oneword .word {
        font-size: var(--size-mega); line-height: 1;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--cream);
        -webkit-text-stroke: var(--stroke-w) var(--outline);
        paint-order: stroke fill;
        text-shadow: var(--caption-shadow);
        display: inline-block;
      }

      /* mono sub-line, snaps in below */
      #t1-thesis-oneword .sub {
        font-family: var(--font-mono); font-size: var(--size-body);
        color: var(--text-dim); letter-spacing: 0.02em;
        margin-top: 38px;
      }
      #t1-thesis-oneword .sub .prompt { color: var(--syn-green); }
    </style>
  </head>
  <body>
    <div id="t1-thesis-oneword" data-composition-id="t1-thesis-oneword" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="word" data-slot="word">SHIP</div>
        <div class="sub"><span class="prompt">&gt;</span> <span data-slot="sub">not just talk about it</span></div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-thesis-oneword";

      const tl = gsap.timeline({ paused: true });

      /* THE STAMP — one mega word, hard and fast */
      tl.from(root + " .word", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "50% 55%",
          duration: 0.28, ease: "back.out(2.2)"
        }, 0.4)

        /* right after landing — quick double impact shake, finite */
        .to(root + " .word", {
          keyframes: [
            { x: 6, duration: 0.05 },
            { x: -6, duration: 0.05 },
            { x: 5, duration: 0.05 },
            { x: -5, duration: 0.05 },
            { x: 0, duration: 0.05 }
          ], ease: "none"
        }, ">-0.02")

        /* a beat later — mono sub-line snaps in below */
        .from(root + " .sub", { autoAlpha: 0, y: 16, duration: 0.26, ease: "expo.out" }, ">0.22")

        /* dead stillness — the hold is the timing */
        .set({}, {}, 7);

      window.__timelines["t1-thesis-oneword"] = tl;
    </script>
  </body>
</html>
