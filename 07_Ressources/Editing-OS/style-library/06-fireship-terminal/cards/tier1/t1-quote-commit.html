<!doctype html>
<!--
  FIRESHIP TERMINAL · tier1 · quote · COMMIT
  Full-screen takeover. A git-log panel centered on the canvas: title bar
  filename "git log --oneline"; a mono commit-hash line (accent-colored short
  hash + dim relative date) snaps in, then the quote as the commit message in
  bold cream mono (large), then the author line below in --syn-green. Lines
  snap in sequence top to bottom; finite cursor blink at the end.
  Slots: quote, name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-commit {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #t1-quote-commit .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #t1-quote-commit .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-quote-commit .panel {
        width: 1320px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: var(--radius);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      #t1-quote-commit .chrome {
        height: var(--chrome-h);
        display: flex; align-items: center; gap: 10px;
        padding: 0 22px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--panel-edge);
      }
      #t1-quote-commit .dot { width: var(--dot); height: var(--dot); border-radius: 50%; }
      #t1-quote-commit .dot.red { background: var(--dot-red); }
      #t1-quote-commit .dot.yellow { background: var(--dot-yellow); }
      #t1-quote-commit .dot.green { background: var(--dot-green); }
      #t1-quote-commit .filename {
        margin-left: 16px; font-size: var(--size-label); color: var(--text-dim);
        letter-spacing: 0.02em;
      }

      #t1-quote-commit .body { padding: 62px 74px 76px; }

      /* commit hash line */
      #t1-quote-commit .hashline {
        font-size: var(--size-body);
      }
      #t1-quote-commit .hash { color: var(--accent); font-weight: var(--wt-bold); }
      #t1-quote-commit .date { color: var(--text-dim); margin-left: 18px; }

      /* commit message = the quote, large bold cream */
      #t1-quote-commit .message {
        font-size: 58px; line-height: 1.42; font-weight: var(--wt-bold);
        color: var(--cream);
        margin-top: 34px;
        max-width: 1160px;
      }

      /* author line */
      #t1-quote-commit .author {
        font-size: var(--size-body); color: var(--syn-green);
        margin-top: 36px;
      }
      #t1-quote-commit .author .role { color: var(--text-dim); }

      #t1-quote-commit .cursor {
        display: inline-block; width: 13px; height: 30px;
        background: var(--accent); margin-left: 10px; transform: translateY(6px);
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-commit" data-composition-id="t1-quote-commit" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="panel">
          <div class="chrome">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="filename">git log --oneline</span>
          </div>
          <div class="body">
            <div class="hashline">
              <span class="hash">a3f9c2e</span><span class="date">2 days ago</span>
            </div>
            <div class="message" data-slot="quote">Passed the cert, shipped my first agent, billed a client by Friday</div>
            <div class="author">
              <span data-slot="name">Marcus Webb</span><span class="role">, </span><span class="role" data-slot="role">Full-Stack Dev</span><span class="cursor"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-quote-commit";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .panel", { autoAlpha: 0, y: 26, duration: 0.3, ease: "expo.out" }, 0.15)

        /* commit hash line snaps in first */
        .from(root + " .hashline", { autoAlpha: 0, x: -18, duration: 0.24, ease: "expo.out" }, ">0.1")

        /* the quote, as the commit message — snaps in next */
        .from(root + " .message", { autoAlpha: 0, y: 16, duration: 0.28, ease: "back.out(1.6)" }, ">0.14")

        /* author line snaps in below */
        .from(root + " .author", { autoAlpha: 0, y: 12, duration: 0.24, ease: "expo.out" }, ">0.16")

        /* finite cursor blink at the end */
        .to(root + " .cursor", { autoAlpha: 0, duration: 0.2, repeat: 5, yoyo: true, ease: "none" }, ">0.1")

        /* dead stillness */
        .set({}, {}, 7);

      window.__timelines["t1-quote-commit"] = tl;
    </script>
  </body>
</html>
