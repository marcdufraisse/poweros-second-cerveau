<!doctype html>
<!--
  FIRESHIP TERMINAL · tier2 · caption · SLAM
  Bottom-center transparent overlay caption. Cream Luckiest-Guy type STAMPS
  in word by word (scale 1.6→1, back.out) with a fat black rim carrying
  legibility over any footage; one <em> word carries the accent color; max
  two short lines; dead stillness after the hits.
  Slots: caption (richtext).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-caption-slam {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }

      #t2-caption-slam .wrap {
        position: absolute; left: 0; right: 0; bottom: 96px; z-index: 3;
        display: flex; justify-content: center; text-align: center;
      }

      #t2-caption-slam .caption {
        font-size: 64px; line-height: 1.16;
        letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--cream);
        -webkit-text-stroke: var(--stroke-w) var(--outline);
        paint-order: stroke fill;
        text-shadow: var(--caption-shadow);
        max-width: 1420px;
      }
      #t2-caption-slam .caption .w { display: inline-block; padding: 0 10px; }
      #t2-caption-slam .caption em,
      #t2-caption-slam .caption em .w { font-style: normal; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="t2-caption-slam" data-composition-id="t2-caption-slam" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="caption" data-slot="caption">THIS ONE LINE <em>BREAKS</em> PRODUCTION</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-caption-slam";

      /* split the caption into stampable word spans (keeps <em> coloring) */
      const cap = document.querySelector(root + " .caption");
      function splitWords(node) {
        [...node.childNodes].forEach((child) => {
          if (child.nodeType === 3) {
            const frag = document.createDocumentFragment();
            child.textContent.split(/\s+/).filter(Boolean).forEach((word, i, arr) => {
              const s = document.createElement("span");
              s.className = "w"; s.textContent = word;
              frag.appendChild(s);
              if (i < arr.length - 1) frag.appendChild(document.createTextNode(" "));
            });
            node.replaceChild(frag, child);
          } else if (child.nodeType === 1) splitWords(child);
        });
      }
      splitWords(cap);

      const tl = gsap.timeline({ paused: true });

      /* THE STAMPS — one word per beat, hard and fast */
      tl.from(root + " .caption .w", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "50% 60%",
          duration: 0.28, ease: "back.out(2.2)", stagger: 0.22
        }, 0.2)

        /* dead stillness — the hold is the timing */
        .set({}, {}, 6);

      window.__timelines["t2-caption-slam"] = tl;
    </script>
  </body>
</html>
