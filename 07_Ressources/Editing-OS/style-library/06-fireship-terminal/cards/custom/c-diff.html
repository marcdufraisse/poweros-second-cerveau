<!doctype html>
<!--
  FIRESHIP TERMINAL · custom · compare · DIFF
  Full-screen takeover. A centered code-diff panel (filename
  "workflow.diff") snaps in; three red-tinted "-" removed lines slide in
  from the left, then three green-tinted "+" added lines slide in from the
  left after them, then a mono summary chip STAMPS bottom-right of the
  panel. Dead stillness after.
  Slots: d1, d2, d3, a1, a2, a3, sum.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-diff {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-mono); overflow: hidden;
      }
      #c-diff .vig { position: absolute; inset: 0; background: var(--vignette); z-index: 5; pointer-events: none; }

      #c-diff .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #c-diff .panel {
        position: relative;
        width: 1300px;
        background: var(--panel); border: 1px solid var(--panel-edge);
        border-radius: var(--radius);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      #c-diff .chrome {
        height: var(--chrome-h);
        display: flex; align-items: center; gap: 10px;
        padding: 0 22px;
        background: rgba(0, 0, 0, 0.22);
        border-bottom: 1px solid var(--panel-edge);
      }
      #c-diff .dot { width: var(--dot); height: var(--dot); border-radius: 50%; }
      #c-diff .dot.red { background: var(--dot-red); }
      #c-diff .dot.yellow { background: var(--dot-yellow); }
      #c-diff .dot.green { background: var(--dot-green); }
      #c-diff .filename { margin-left: 10px; font-size: var(--size-label); color: var(--text-dim); letter-spacing: 0.04em; }

      #c-diff .code { padding: 30px 0 84px; font-size: var(--size-code); line-height: 1.9; }
      #c-diff .diff-line {
        padding: 4px 40px; white-space: pre;
      }
      #c-diff .diff-line.rem {
        color: var(--dot-red);
        background: color-mix(in srgb, var(--dot-red) 14%, transparent);
      }
      #c-diff .diff-line.add {
        color: var(--syn-green);
        background: rgba(var(--green-rgb), 0.14);
      }
      #c-diff .diff-line .mark { display: inline-block; width: 22px; opacity: 0.85; }

      /* mono summary chip, bottom-right of the panel */
      #c-diff .sum {
        position: absolute; right: 32px; bottom: 26px;
        font-size: var(--size-label); color: var(--cream);
        border: 1px solid var(--panel-edge); border-radius: var(--radius-sm);
        background: rgba(0, 0, 0, 0.35);
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div id="c-diff" data-composition-id="c-diff" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="panel">
          <div class="chrome">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="filename">workflow.diff</span>
          </div>
          <div class="code">
            <div class="diff-line rem d1" data-slot="d1"><span class="mark">-</span>manual onboarding checklist</div>
            <div class="diff-line rem d2" data-slot="d2"><span class="mark">-</span>spreadsheet tracking by hand</div>
            <div class="diff-line rem d3" data-slot="d3"><span class="mark">-</span>wait 3 hours for review</div>
            <div class="diff-line add a1" data-slot="a1"><span class="mark">+</span>Acme automated onboarding agent</div>
            <div class="diff-line add a2" data-slot="a2"><span class="mark">+</span>auto-synced dashboard</div>
            <div class="diff-line add a3" data-slot="a3"><span class="mark">+</span>instant AI review in 5 minutes</div>
          </div>
          <div class="sum" data-slot="sum">-3 hours, +5 minutes</div>
        </div>
      </div>
      <div class="vig"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#c-diff";

      const tl = gsap.timeline({ paused: true });

      /* panel snaps in */
      tl.from(root + " .panel", { autoAlpha: 0, y: 26, duration: 0.3, ease: "expo.out" }, 0.1)
        .from(root + " .chrome .dot", { autoAlpha: 0, scale: 0.4, duration: 0.2, ease: "back.out(2)", stagger: 0.05 }, ">-0.1")
        .from(root + " .filename", { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, "<")

        /* three removed lines slide in from the left */
        .from(root + " .d1", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.15")
        .from(root + " .d2", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.1")
        .from(root + " .d3", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.1")

        /* three added lines slide in from the left, after the removals */
        .from(root + " .a1", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.3")
        .from(root + " .a2", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.1")
        .from(root + " .a3", { autoAlpha: 0, x: -40, duration: 0.22, ease: "expo.out" }, ">0.1")

        /* summary chip STAMPS bottom-right */
        .from(root + " .sum", {
          autoAlpha: 0, scale: 1.6, transformOrigin: "100% 100%",
          duration: 0.28, ease: "back.out(2.2)"
        }, ">0.25")

        /* dead stillness */
        .set({}, {}, 8);

      window.__timelines["c-diff"] = tl;
    </script>
  </body>
</html>
