<!doctype html>
<!--
  HOUSE · social 9:16 · HEADER BRAND
  The persistent top banner from reel Dba-jOyIbom: brand/topic line in jaune
  caps with an optional white subline, pinned to the top safe zone of the
  vertical frame. Transparent elsewhere. For collabs, announcements, or
  naming the tool being demoed.
  Slots: title, sub (optional).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-header-brand {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #soc-header-brand .head {
        position: absolute; top: 96px; left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        text-align: center;
      }
      #soc-header-brand .title {
        font-weight: var(--wt-heavy); font-size: 64px; letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--jaune);
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }
      #soc-header-brand .sub {
        font-family: var(--font-body); font-weight: var(--wt-bold);
        font-size: 34px; color: var(--white);
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="soc-header-brand" data-composition-id="soc-header-brand" data-start="0" data-width="1080" data-height="1920">
      <div class="head">
        <div class="title" data-slot="title">HIGGSFIELD</div>
        <div class="sub" data-slot="sub">gratuit et illimité pendant 24h</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-header-brand";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .title", { autoAlpha: 0, y: -34, duration: 0.45, ease: "expo.out" }, 0.1)
        .from(root + " .sub", { autoAlpha: 0, y: -18, duration: 0.4, ease: "power3.out" }, 0.3)

        .set({}, {}, 8);

      window.__timelines["soc-header-brand"] = tl;
    </script>
  </body>
</html>
