<!doctype html>
<!--
  HOUSE · social 9:16 · CTA COMMENT BAR
  Le CTA qui joue le geste (validé sur le reel montage-ia v6) : une barre de
  commentaire IG reconstituée, le mot-clé se tape tout seul (clavier), Publier
  clique, le commentaire posté apparaît avec le handle et le mot en jaune.
  Positionné dans la zone haute (règle 1a : jamais sur le visage).
  Sons associés (convention sfx) : typing pendant la frappe, click sur Publier,
  pop sur la bulle postée.
  Slots: user (handle), keyword (le mot à commenter), initial (1 lettre avatar).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-cta-comment-bar {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-body);
      }
      #soc-cta-comment-bar .wrap { position: absolute; left: 100px; right: 100px; top: 560px; }
      #soc-cta-comment-bar .posted { display: flex; align-items: center; gap: 18px;
        background: rgba(255,255,255,0.06); border-radius: 18px; padding: 20px 24px;
        margin-bottom: 24px; visibility: hidden; }
      #soc-cta-comment-bar .ava { width: 56px; height: 56px; border-radius: 50%;
        background: linear-gradient(135deg, var(--jaune), #8B5CF6); flex: none;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 30px; color: var(--charcoal); }
      #soc-cta-comment-bar .puser { font-weight: var(--wt-bold); font-size: 27px; color: #fff; }
      #soc-cta-comment-bar .pword { font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 30px; color: var(--jaune); letter-spacing: 0.04em; }
      #soc-cta-comment-bar .pheart { margin-left: auto; font-size: 34px; }
      #soc-cta-comment-bar .field { display: flex; align-items: center; gap: 18px;
        background: #1c1e24; border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px; padding: 18px 30px; }
      #soc-cta-comment-bar .ftext { flex: 1; font-weight: var(--wt-med);
        font-size: 30px; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; }
      #soc-cta-comment-bar .ftext .typed { color: #fff; font-weight: var(--wt-heavy); letter-spacing: 0.04em; }
      #soc-cta-comment-bar .ftext .caret { display: inline-block; width: 3px; height: 34px;
        background: #fff; vertical-align: -6px; margin-left: 2px; opacity: 0; }
      #soc-cta-comment-bar .fsend { font-weight: var(--wt-heavy); font-size: 28px; color: #4da6ff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="soc-cta-comment-bar" data-composition-id="soc-cta-comment-bar" data-start="0" data-width="1080" data-height="1920">
      <div class="wrap">
        <div class="posted" id="scb-posted">
          <div class="ava" data-slot="initial">M</div>
          <div class="puser" data-slot="user">votre.compte</div>
          <div class="pword" id="scb-word"></div>
          <div class="pheart">&#129293;</div>
        </div>
        <div class="field">
          <div class="ava">M</div>
          <div class="ftext"><span id="scb-ph">Ajouter un commentaire&#8230;</span><span class="typed" id="scb-typed"></span><span class="caret" id="scb-caret"></span></div>
          <div class="fsend" id="scb-send">Publier</div>
        </div>
      </div>
      <div style="display:none" data-slot="keyword" id="scb-kw">MONTAGE</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-cta-comment-bar";
      const KW = document.getElementById("scb-kw").textContent.trim();
      document.getElementById("scb-word").textContent = KW;
      const typed = document.getElementById("scb-typed");

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .field", { autoAlpha: 0, y: 50, duration: 0.35, ease: "expo.out" }, 0.1)
        .fromTo("#scb-caret", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: 5 }, 0.45)
        .set("#scb-ph", { display: "none" }, 0.50)
        .to({ n: 0 }, { n: KW.length, duration: 0.12 * KW.length, ease: "none",
          onUpdate: function () { typed.textContent = KW.slice(0, Math.round(this.targets()[0].n)); } }, 0.50)
        .to("#scb-send", { opacity: 1, duration: 0.2 }, 0.65)
        .to("#scb-send", { scale: 1.25, duration: 0.12, ease: "power2.out" }, 0.50 + 0.12 * 8 + 0.35)
        .to("#scb-send", { scale: 1, duration: 0.15, ease: "power2.inOut" }, 0.50 + 0.12 * 8 + 0.47)
        .set("#scb-typed", { textContent: "" }, 0.50 + 0.12 * 8 + 0.55)
        .set("#scb-caret", { opacity: 0 }, 0.50 + 0.12 * 8 + 0.55)
        .set("#scb-ph", { display: "inline" }, 0.50 + 0.12 * 8 + 0.55)
        .fromTo("#scb-posted", { autoAlpha: 0, y: 26, scale: 0.94, visibility: "visible" },
          { autoAlpha: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.50 + 0.12 * 8 + 0.60)
        .fromTo(root + " .pheart", { scale: 1 }, { scale: 1.35, duration: 0.16, ease: "back.out(2.5)", yoyo: true, repeat: 1 }, 0.50 + 0.12 * 8 + 1.0)

        .set({}, {}, 6);

      window.__timelines["soc-cta-comment-bar"] = tl;
    </script>
  </body>
</html>
