<!doctype html>
<!--
  HOUSE · social 9:16 · PROFILE CARD
  The white rounded profile-stats card from reel DZU-J9roH-O: avatar with
  jaune story ring, handle, three stat columns (publications / followers /
  suivi(e)s). Slides in top-left over any footage. Transparent elsewhere.
  Slots: avatar (media), handle, s1, l1, s2, l2, s3, l3.
  Avatar : photo de profil de l'utilisateur, embarquee (source asset-library/PP/pp.jpg).
  Chiffres : repris de about-me.md (abonnes LinkedIn, newsletter Substack,
  rythme). Les labels nomment la source, sinon la fiche - qui imite un profil
  Instagram - les ferait passer pour des chiffres Instagram. Ne jamais y mettre
  l'objectif de 1,5 M d'impressions : c'est une cible, pas un resultat.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #soc-profile-card {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-body);
      }
      #soc-profile-card .card {
        position: absolute; top: 90px; left: 60px;
        display: flex; align-items: center; gap: 30px;
        background: var(--white); color: var(--charcoal);
        border-radius: 26px; padding: 30px 40px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      #soc-profile-card .ava {
        width: 110px; height: 110px; border-radius: 50%;
        padding: 4px; background: var(--jaune);
        box-sizing: border-box; flex: none;
      }
      #soc-profile-card .ava img {
        width: 100%; height: 100%; border-radius: 50%;
        object-fit: cover; display: block; border: 3px solid var(--white);
        box-sizing: border-box;
      }
      #soc-profile-card .col { display: flex; flex-direction: column; gap: 14px; }
      #soc-profile-card .handle { font-weight: var(--wt-bold); font-size: 30px; }
      #soc-profile-card .stats { display: flex; gap: 40px; }
      #soc-profile-card .stat { display: flex; flex-direction: column; gap: 2px; }
      #soc-profile-card .num { font-weight: var(--wt-heavy); font-size: 34px; font-variant-numeric: tabular-nums; }
      #soc-profile-card .lab { font-size: 22px; color: rgba(23, 11, 48, 0.6); }
    </style>
  </head>

          <div class="stats">
            <div class="stat"><span class="num" data-slot="s1">40 K</span><span class="lab" data-slot="l1">abonnés LinkedIn</span></div>
            <div class="stat"><span class="num" data-slot="s2">15 K</span><span class="lab" data-slot="l2">newsletter</span></div>
            <div class="stat"><span class="num" data-slot="s3">1/jour</span><span class="lab" data-slot="l3">publication</span></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#soc-profile-card";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .card", { autoAlpha: 0, y: -60, duration: 0.5, ease: "expo.out" }, 0.1)
        .from(root + " .ava", { scale: 0.6, duration: 0.4, ease: "back.out(1.8)" }, 0.3)
        .from(root + " .stat", { autoAlpha: 0, y: 12, duration: 0.35, ease: "power3.out", stagger: 0.1 }, 0.45)

        .set({}, {}, 8);

      window.__timelines["soc-profile-card"] = tl;
    </script>
  </body>
