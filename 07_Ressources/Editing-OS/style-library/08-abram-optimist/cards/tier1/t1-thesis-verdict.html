<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · thesis · VERDICT
  Full-screen takeover. The "huge if true" verdict: a Manrope 800 claim
  center-stage with its key word underlined by THE prism moment (a thin
  --prism bar that wipes in beneath the word); a white floating chip pops
  in below with a --sun tick and a mono verdict line.
  Slots: headline (richtext, key word wrapped in <span class="key">), verdict.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-verdict {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-thesis-verdict .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 var(--pad);
      }

      /* the claim */
      #t1-thesis-verdict .headline {
        font-weight: var(--wt-black); font-size: var(--size-display);
        letter-spacing: var(--track-tight); line-height: 1.1;
        color: var(--ink); max-width: 1480px;
      }

      /* the key word — carries THE prism moment as an underline bar, not a clip */
      #t1-thesis-verdict .headline .key {
        position: relative; display: inline-block; padding: 0 4px;
      }
      #t1-thesis-verdict .headline .key .bar {
        position: absolute; left: 0; right: 0; bottom: -14px; height: 10px;
        border-radius: 6px;
        background-image: var(--prism);
        transform-origin: left center; transform: scaleX(0);
      }

      /* the floating verdict chip */
      #t1-thesis-verdict .chip {
        display: flex; align-items: center; gap: 18px;
        background: var(--white); box-shadow: var(--lift);
        border-radius: var(--radius); padding: 22px 38px 24px;
        margin-top: 72px;
      }
      #t1-thesis-verdict .chip .tick {
        width: 16px; height: 16px; border-radius: 5px;
        background: var(--sun); flex: 0 0 auto;
      }
      #t1-thesis-verdict .chip .verdict {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase; color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-verdict" data-composition-id="t1-thesis-verdict" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="headline" data-slot="headline">AI certification is now <span class="key">faster<span class="bar"></span></span> than a weekend course</div>

        <div class="chip">
          <span class="tick"></span>
          <span class="verdict" data-slot="verdict">Verified: 1,200+ members certified</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-verdict";

      /* claim rises and settles */
      tl.from(root + " .headline", { autoAlpha: 0, y: 34, duration: 0.7, ease: "expo.out" }, 0.2)

        /* THE prism moment — the underline bar wipes in beneath the key word */
        .to(root + " .headline .key .bar", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.75)

        /* verdict chip POPS */
        .from(root + " .chip", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 1.15)

        /* one gentle bob on the chip, finite */
        .to(root + " .chip", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-verdict"] = tl;
    </script>
  </body>
</html>
