<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · stat · CARD
  Full-screen takeover. Warm off-white stage with a faint prism-wash corner
  glow; a big white floating card (--lift, --radius, ~1100px) pops in
  center holding a small mono tag, an ink Manrope count-up number, and a
  one-line label. THE prism moment: an 8px --prism bar wipes once across
  the card's top edge. The number itself stays plain ink — no double
  prism moment.
  Slots: tag, stat, label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-card {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* faint prism wash, bottom-left corner only */
      #t1-stat-card .wash {
        position: absolute; bottom: -260px; left: -260px;
        width: 1000px; height: 900px; border-radius: 50%;
        background: var(--prism-wash);
        filter: blur(70px);
      }

      #t1-stat-card .card {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 1100px; padding: 88px 96px 72px;
        background: var(--white); border-radius: var(--radius);
        box-shadow: var(--lift);
        overflow: hidden;
        text-align: center;
        z-index: 3;
      }

      /* prism bar wipes across the card's top edge */
      #t1-stat-card .card .bar {
        position: absolute; top: 0; left: 0; height: 8px; width: 100%;
        background-image: var(--prism);
        background-size: 220% 100%; background-position: 0% 50%;
        transform: scaleX(0); transform-origin: left center;
      }

      #t1-stat-card .tag {
        display: inline-block;
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--canvas-dim); color: var(--ink);
        border-radius: var(--radius-pill);
        padding: 10px 26px 12px; margin-bottom: 36px;
      }

      #t1-stat-card .stat {
        font-weight: var(--wt-black); font-size: 210px;
        letter-spacing: var(--track-tight); line-height: 1;
        color: var(--ink);
      }

      #t1-stat-card .label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: var(--size-headline); color: var(--ink-soft);
        margin-top: 26px; line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-card" data-composition-id="t1-stat-card" data-start="0" data-width="1920" data-height="1080">
      <div class="wash"></div>

      <div class="card">
        <div class="bar"></div>
        <div class="tag" data-slot="tag">AGENT BUILD TIME</div>
        <div class="stat" data-slot="stat">11 min</div>
        <div class="label" data-slot="label">average time from idea to a working agent</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-card";

      function countUp(sel, opts) {
        const el = document.querySelector(sel);
        const raw = el.textContent.trim();
        const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
        if (!m) return gsap.timeline();
        const prefix = m[1], suffix = m[3];
        const numStr = m[2].replace(/,/g, "");
        const isFloat = numStr.indexOf(".") !== -1;
        const decimals = isFloat ? numStr.split(".")[1].length : 0;
        const target = parseFloat(numStr);
        const obj = { v: 0 };
        el.textContent = prefix + (isFloat ? (0).toFixed(decimals) : "0") + suffix;
        return gsap.to(obj, {
          v: target,
          duration: opts.duration || 1.2,
          ease: opts.ease || "power3.out",
          onUpdate: function () {
            const disp = isFloat ? obj.v.toFixed(decimals) : Math.round(obj.v).toLocaleString("en-US");
            el.textContent = prefix + disp + suffix;
          }
        });
      }

      tl
        .from(root + " .wash", { autoAlpha: 0, scale: 0.85, transformOrigin: "20% 80%", duration: 1.2, ease: "power2.out" }, 0)

        /* the card POPS */
        .from(root + " .card", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.25)

        /* mono tag pops just after the card lands */
        .from(root + " .tag", { autoAlpha: 0, scale: 0.6, duration: 0.4, ease: "back.out(1.7)" }, 0.55)

        /* number pops in, then counts up eagerly */
        .from(root + " .stat", { autoAlpha: 0, y: 16, duration: 0.4, ease: "expo.out" }, 0.7)
        .add(countUp(root + " .stat", { duration: 1.1, ease: "power3.out" }), 0.75)

        /* THE prism bar wipes once across the top edge */
        .to(root + " .card .bar", { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 0.55)
        .to(root + " .card .bar", { backgroundPosition: "100% 50%", duration: 1.1, ease: "power2.inOut" }, 0.9)

        /* label rises and settles */
        .from(root + " .label", { autoAlpha: 0, y: 22, duration: 0.6, ease: "expo.out" }, 1.35)

        /* one gentle bob on the tag, finite */
        .to(root + " .tag", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-stat-card"] = tl;
    </script>
  </body>
</html>
