<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · section · TAPE
  Full-screen takeover. Tape-deck chapter card: a big ink pill chip pops in
  center ("PART 2 <<"), the section title rises beneath it, and two thin
  ink rules draw outward from center above and below the stack. A small
  mono timestamp sits at the bottom of the frame. No prism moment — this
  card stays monochrome, all tape-deck ink-on-canvas.
  Slots: tape, title, time.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-tape {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-section-tape .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* the two rules that draw outward from center */
      #t1-section-tape .rule {
        width: 640px; height: 2px; background: var(--ink);
        transform-origin: center; transform: scaleX(0);
      }
      #t1-section-tape .rule-top { margin-bottom: 40px; }
      #t1-section-tape .rule-bottom { margin-top: 40px; }

      /* the big ink pill chip */
      #t1-section-tape .tape {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 22px 54px 26px;
      }

      /* the section title */
      #t1-section-tape .title {
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.1;
        color: var(--ink); max-width: 1400px;
        margin-top: 44px;
      }

      #t1-section-tape .time {
        position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
        font-family: var(--font-mono); font-size: var(--size-tiny);
        letter-spacing: var(--track-mono); color: var(--ink-faint);
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-tape" data-composition-id="t1-section-tape" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="rule rule-top"></div>
        <div class="tape" data-slot="tape">PART 2 &lt;&lt;</div>
        <div class="title" data-slot="title">Building your first agent</div>
        <div class="rule rule-bottom"></div>
      </div>

      <div class="time" data-slot="time">[ 00:12:40 ]</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-tape";

      /* the tape chip POPS in first */
      tl.from(root + " .tape", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 0.2)

        /* the two rules draw outward from center, together */
        .to(root + " .rule-top", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.65)
        .to(root + " .rule-bottom", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.65)

        /* the section title rises and settles */
        .from(root + " .title", { autoAlpha: 0, y: 30, duration: 0.7, ease: "expo.out" }, 0.75)

        /* the timestamp snaps in */
        .from(root + " .time", { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out" }, 1.4)

        /* one gentle bob on the tape chip, finite */
        .to(root + " .tape", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-section-tape"] = tl;
    </script>
  </body>
</html>
