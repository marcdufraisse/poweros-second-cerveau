<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · quote · DELIGHT
  Full-screen takeover. A mono pill tag ("REAL MEMBER. REAL QUOTE.") pops
  in above a centered sentence-case Manrope 700 pull quote (3 lines max);
  the key phrase inside <em> is THE prism moment — gradient-clipped,
  panning once. Below, the member's name in Manrope 700 and their role in
  mono --ink-soft settle in.
  Slots: tag, quote (richtext — wrap the key phrase in <em>), name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-delight {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-quote-delight .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      #t1-quote-delight .tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 12px 30px 14px; margin-bottom: 56px;
      }

      #t1-quote-delight .quote {
        font-weight: var(--wt-bold); font-size: 62px;
        letter-spacing: var(--track-tight); line-height: 1.32;
        color: var(--ink); max-width: 1440px;
      }

      /* THE prism phrase — clipped gradient, panning background. No will-change. */
      #t1-quote-delight .quote em {
        font-style: normal;
        padding: 0 8px;
        background-image: var(--prism);
        background-size: 220% 100%; background-position: 0% 50%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      #t1-quote-delight .attrib {
        margin-top: 56px;
      }

      #t1-quote-delight .name {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-body); color: var(--ink);
      }

      #t1-quote-delight .role {
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-mono); text-transform: uppercase;
        color: var(--ink-soft); margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-delight" data-composition-id="t1-quote-delight" data-start="0" data-width="1920" data-height="1080">
      <div class="center">
        <div class="tag" data-slot="tag">REAL MEMBER. REAL QUOTE.</div>
        <div class="quote" data-slot="quote">I built my first <em>agent that actually worked</em> before lunch on day one.</div>
        <div class="attrib">
          <div class="name" data-slot="name">Jordan Reyes</div>
          <div class="role" data-slot="role">ACME MEMBER · CLASS OF 2026</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-quote-delight";

      tl
        /* tape tag POPS */
        .from(root + " .tag", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 0.15)

        /* quote rises and settles */
        .from(root + " .quote", { autoAlpha: 0, y: 34, duration: 0.7, ease: "expo.out" }, 0.45)

        /* THE prism pan — light moves through the phrase once */
        .to(root + " .quote em", { backgroundPosition: "100% 50%", duration: 1.3, ease: "power2.inOut" }, 1.0)

        /* name + role settle in */
        .from(root + " .name", { autoAlpha: 0, y: 18, duration: 0.5, ease: "expo.out" }, 1.5)
        .from(root + " .role", { autoAlpha: 0, y: 18, duration: 0.5, ease: "expo.out" }, 1.62)

        /* one gentle bob on the tag, finite */
        .to(root + " .tag", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.1)

        .set({}, {}, 7);

      window.__timelines["t1-quote-delight"] = tl;
    </script>
  </body>
</html>
