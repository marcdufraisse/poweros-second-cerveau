<!doctype html>
<!--
  ABRAM OPTIMIST · tier1 · section · SWEEP
  Full-screen takeover. Divider showpiece: the frame opens on empty canvas.
  A light-leak flare sweeps across once — THE prism moment — and "leaves
  behind" the section title, which fades and rises in exactly as the flare
  passes its position. A mono pill tag pops in beneath it, then a thin
  --prism rule draws full-width under everything.
  Slots: tag, title.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-sweep {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-section-sweep .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* the section title, left behind by the flare's sweep */
      #t1-section-sweep .title {
        font-weight: var(--wt-black); font-size: var(--size-display);
        letter-spacing: var(--track-tight); line-height: 1.1;
        color: var(--ink); max-width: 1500px;
      }

      /* tape-deck pill tag */
      #t1-section-sweep .tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 12px 30px 14px; margin-top: 40px;
      }

      /* THE prism rule — thin, draws full-width beneath everything */
      #t1-section-sweep .rule {
        width: 1728px; height: 4px; border-radius: 3px;
        background-image: var(--prism);
        transform-origin: center; transform: scaleX(0);
        margin-top: 56px;
      }

      /* light-leak flare band that sweeps once and leaves the title behind */
      #t1-section-sweep .flare {
        position: absolute; top: -10%; bottom: -10%; left: 0; width: 60%;
        background: var(--flare);
        transform: skewX(-14deg) translateX(-140%);
        z-index: 6; pointer-events: none;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-sweep" data-composition-id="t1-section-sweep" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="title" data-slot="title">The next chapter starts now</div>
        <div class="tag" data-slot="tag">CHAPTER 3 · LIVE</div>
        <div class="rule"></div>
      </div>

      <div class="flare"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-sweep";

      /* THE prism moment — the flare sweeps across the empty frame once */
      tl.to(root + " .flare", { xPercent: 420, duration: 0.9, ease: "power2.inOut" }, 0.3)

        /* the title fades + rises in exactly as the flare passes its position */
        .from(root + " .title", { autoAlpha: 0, y: 26, duration: 0.6, ease: "expo.out" }, 0.72)

        /* the tag POPS in beneath it */
        .from(root + " .tag", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(1.7)" }, 1.15)

        /* the prism rule draws full-width */
        .to(root + " .rule", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 1.35)

        /* one gentle bob on the tag, finite */
        .to(root + " .tag", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-section-sweep"] = tl;
    </script>
  </body>
</html>
