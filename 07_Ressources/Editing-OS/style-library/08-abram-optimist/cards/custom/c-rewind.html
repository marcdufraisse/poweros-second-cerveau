<!doctype html>
<!--
  ABRAM OPTIMIST · custom · moment · REWIND
  Full-screen takeover. A white claim card pops in center stage, then a mono
  "REWIND <<" pill tag slams in over its top-left corner while the card does
  a quick rewind-shake (four fast finite x jitters) and two thin ink scan
  bars flicker across it, finite. The card settles, then a second line and
  a mono timestamp land beneath the claim.
  Slots: claim, again, time.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-rewind {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      #c-rewind .wash {
        position: absolute; top: -240px; left: -220px;
        width: 1000px; height: 820px; border-radius: 50%;
        background: var(--prism-wash);
        filter: blur(70px);
      }

      #c-rewind .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #c-rewind .card {
        position: relative;
        width: 1180px; padding: 90px 100px 76px;
        background: var(--white); border-radius: var(--radius);
        box-shadow: var(--lift);
        display: flex; flex-direction: column; align-items: center;
        text-align: center; overflow: hidden;
      }

      #c-rewind .claim {
        font-weight: var(--wt-black); font-size: 66px;
        letter-spacing: var(--track-tight); line-height: 1.14;
        color: var(--ink);
      }

      #c-rewind .again {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-body); color: var(--ink-soft);
        margin-top: 30px; opacity: 0;
      }

      #c-rewind .time {
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-mono); color: var(--ink-faint);
        margin-top: 20px; opacity: 0;
      }

      /* the scan bars flicker across the card during the shake */
      #c-rewind .scanbar {
        position: absolute; left: -10%; width: 120%; height: 5px;
        background: rgba(var(--ink-rgb), 0.08);
        opacity: 0; z-index: 5; pointer-events: none;
      }
      #c-rewind .scanbar--1 { top: 34%; }
      #c-rewind .scanbar--2 { top: 66%; }

      /* the REWIND tag anchor — position fixed, never animated for scale */
      #c-rewind .tag-anchor {
        position: absolute; top: 118px; left: 300px; z-index: 6;
      }

      #c-rewind .tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-mono);
        text-transform: uppercase;
        background: var(--ink); color: var(--white);
        border-radius: var(--radius-pill);
        padding: 12px 30px 14px;
        box-shadow: var(--lift);
      }
    </style>
  </head>
  <body>
    <div id="c-rewind" data-composition-id="c-rewind" data-start="0" data-width="1920" data-height="1080">
      <div class="wash"></div>

      <div class="stage">
        <div class="card">
          <div class="scanbar scanbar--1"></div>
          <div class="scanbar scanbar--2"></div>
          <div class="claim" data-slot="claim">Every member ships a working agent</div>
          <div class="again" data-slot="again">...one more time:</div>
          <div class="time" data-slot="time">[ 00:02:41 ]</div>
        </div>
      </div>

      <div class="tag-anchor">
        <div class="tag">REWIND &lt;&lt;</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-rewind";

      gsap.set(root + " .tag", { scale: 0.5, autoAlpha: 0 });

      tl.from(root + " .wash", { autoAlpha: 0, scale: 0.85, transformOrigin: "20% 20%", duration: 1.0, ease: "power2.out" }, 0)

        /* claim card pops in center stage */
        .from(root + " .card", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(1.7)" }, 0.2)

        /* REWIND tag SLAMS in over the corner */
        .to(root + " .tag", { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)" }, 0.85)

        /* the rewind shake — four fast finite x jitters on the card */
        .to(root + " .card", { x: -14, duration: 0.07, ease: "power1.inOut" }, 0.95)
        .to(root + " .card", { x: 14, duration: 0.14, ease: "power1.inOut", repeat: 3, yoyo: true }, 1.02)
        .to(root + " .card", { x: 0, duration: 0.1, ease: "power1.inOut" }, 1.44)

        /* two static scan bars flicker across, finite */
        .to(root + " .scanbar--1", { opacity: 1, duration: 0.05, repeat: 5, yoyo: true }, 0.95)
        .to(root + " .scanbar--2", { opacity: 1, duration: 0.05, repeat: 5, yoyo: true }, 1.02)
        .set(root + " .scanbar--1, " + root + " .scanbar--2", { opacity: 0 }, 1.55)

        /* card settles, then the second line + timestamp land */
        .to(root + " .again", { opacity: 1, duration: 0.4, ease: "expo.out" }, 1.75)
        .to(root + " .time", { opacity: 1, duration: 0.4, ease: "expo.out" }, 1.95)

        /* one gentle bob on the tag, finite */
        .to(root + " .tag", { y: -6, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.5)

        .set({}, {}, 8);

      window.__timelines["c-rewind"] = tl;
    </script>
  </body>
</html>
