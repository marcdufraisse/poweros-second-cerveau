<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · stat · DELTA
  Full-screen takeover, centered market-move composition (deliberate break
  from the broadsheet left-align, used sparingly). A white label-box kicker
  clip-reveals top-center; a huge amber mono percentage rolls up dead-center
  with a large CSS-triangle beside it in --up; a thin --up bar draws beneath
  the number; an Archivo claim settles below. Mechanical, dead-still hold.
  Slots: kicker, stat, label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-delta {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-delta .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-stat-delta .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      #t1-stat-delta .labelbox {
        overflow: hidden; /* clip-reveal container */
        margin-bottom: 44px;
      }
      #t1-stat-delta .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }

      #t1-stat-delta .statrow {
        display: flex; align-items: flex-start; gap: 28px;
      }
      #t1-stat-delta .stat {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: var(--size-mega); line-height: 0.9;
        color: var(--amber); letter-spacing: -0.03em;
      }
      #t1-stat-delta .tri {
        width: 0; height: 0; margin-top: 44px;
        border-left: 36px solid transparent; border-right: 36px solid transparent;
        border-bottom: 54px solid var(--up);
        transform-origin: 50% 100%;
      }

      #t1-stat-delta .underbar {
        width: 460px; height: var(--bar-h); background: var(--up);
        margin-top: 30px; transform-origin: 50% 50%;
      }

      #t1-stat-delta .claim {
        margin-top: 40px;
        font-weight: var(--wt-bold); font-size: var(--size-headline);
        letter-spacing: var(--track-tight); line-height: 1.2;
        color: var(--white); text-align: center; max-width: 1100px;
      }

      #t1-stat-delta .stamp {
        position: absolute; bottom: 96px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-stat-delta .stamp2 {
        position: absolute; bottom: 96px; right: 96px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-delta" data-composition-id="t1-stat-delta" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="stage">
        <div class="labelbox"><div class="boxinner" data-slot="kicker">AGENT ADOPTION · MARKET MOVE</div></div>

        <div class="statrow">
          <div class="stat" data-slot="stat" data-count-to="64" data-count-prefix="+" data-count-suffix="%">+0%</div>
          <div class="tri"></div>
        </div>

        <div class="underbar"></div>

        <div class="claim" data-slot="label">of certified members now run at least one production AI agent</div>
      </div>

      <div class="stamp">SOURCE: ACME MEMBER SURVEY 2026</div>
      <div class="stamp2">2026-07 · 09:41:07 EST</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-delta";

      const statEl = document.querySelector(root + " .stat");
      const target = parseFloat(statEl.dataset.countTo || "64");
      const pre = statEl.dataset.countPrefix || "";
      const suf = statEl.dataset.countSuffix || "";
      const counter = { v: 0 };
      const fmt = (n) => pre + Math.round(n).toLocaleString("en-US") + suf;

      tl.from(root + " .labelbox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.1)

        .from(root + " .stat", { autoAlpha: 0, duration: 0.3, ease: "power2.out" }, 0.55)
        .to(counter, {
          v: target, duration: 1.5, ease: "power2.out",
          onUpdate: () => { statEl.textContent = fmt(counter.v); }
        }, 0.55)
        .fromTo(root + " .tri", { scaleY: 0, autoAlpha: 0 }, { scaleY: 1, autoAlpha: 1, duration: 0.4, ease: "expo.out" }, 1.7)

        .fromTo(root + " .underbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 2.0)
        .from(root + " .claim", { autoAlpha: 0, y: 22, duration: 0.5, ease: "expo.out" }, 2.3)

        .from(root + " .stamp",  { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.7)
        .from(root + " .stamp2", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-delta"] = tl;
    </script>
  </body>
</html>
