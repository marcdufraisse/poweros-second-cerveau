<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · quote · ATTRIB
  Full-screen takeover. Attributed statement: a tall 6px accent-blue rule
  draws downward on the left grid line beside a large Archivo quote (3
  lines max, white); below, a white label box carries the name, a
  Narrow-caps role line follows, and a mono date sits last. Left-aligned
  broadsheet grid, mechanical entrances, dead-still hold.
  Slots: quote, name, role, date.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-attrib {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-quote-attrib .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-quote-attrib .bar {
        position: absolute; top: 220px; left: 96px; width: 6px; height: 420px;
        background: var(--accent); transform-origin: 50% 0%;
      }

      #t1-quote-attrib .quote {
        position: absolute; top: 200px; left: 140px; right: 300px;
        font-weight: var(--wt-bold); font-size: var(--size-headline);
        letter-spacing: var(--track-tight); line-height: 1.32;
        color: var(--white);
      }

      #t1-quote-attrib .attrib {
        position: absolute; top: 660px; left: 140px;
      }
      #t1-quote-attrib .namebox {
        overflow: hidden; display: inline-block;
      }
      #t1-quote-attrib .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }
      #t1-quote-attrib .role {
        margin-top: 20px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-body); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
      }
      #t1-quote-attrib .date {
        margin-top: 14px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }

      #t1-quote-attrib .botrule {
        position: absolute; bottom: 118px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-quote-attrib .source {
        position: absolute; bottom: 68px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-attrib" data-composition-id="t1-quote-attrib" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="bar"></div>
      <div class="quote" data-slot="quote">"We stopped hiring for headcount and started hiring for judgment. The agents handle the queue now."</div>

      <div class="attrib">
        <div class="namebox"><div class="boxinner" data-slot="name">DENISE OKAFOR</div></div>
        <div class="role" data-slot="role">VP OPERATIONS, RIDGELINE CONSULTING</div>
        <div class="date" data-slot="date">CERTIFIED · 2026-03-11</div>
      </div>

      <div class="botrule"></div>
      <div class="source">SOURCE: ACME MEMBER INTERVIEW SERIES 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-quote-attrib";

      tl.fromTo(root + " .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.inOut" }, 0.05)
        .from(root + " .quote", { autoAlpha: 0, y: 20, duration: 0.55, ease: "expo.out" }, 0.35)

        .from(root + " .namebox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 1.5)
        .from(root + " .role", { autoAlpha: 0, x: 16, duration: 0.4, ease: "power2.out" }, 1.85)
        .from(root + " .date", { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 2.05)

        .fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.2)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.3)

        .set({}, {}, 7);

      window.__timelines["t1-quote-attrib"] = tl;
    </script>
  </body>
</html>
