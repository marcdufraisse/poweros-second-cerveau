<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · stat · NUMERAL
  Full-screen takeover. Broadsheet grid: top rule + white label box with
  accent underline bar clip-reveal in; an enormous amber mono numeral rolls
  up left-aligned; an Archivo claim sits right of it across a vertical rule;
  a green delta ticks in beneath; source line bottom-left. Mechanical
  precision, square corners, dead-still hold.
  Slots: kicker, stat, label, delta, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-numeral {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-numeral .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      /* top rule + label box */
      #t1-stat-numeral .toprule {
        position: absolute; top: 120px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-stat-numeral .labelbox {
        position: absolute; top: 150px; left: 96px;
        overflow: hidden; /* clip-reveal container */
      }
      #t1-stat-numeral .labelbox .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }
      #t1-stat-numeral .underbar {
        position: absolute; top: 204px; left: 96px;
        width: 220px; height: var(--bar-h); background: var(--accent);
        transform-origin: 0% 50%;
      }

      /* the numeral row */
      #t1-stat-numeral .row {
        position: absolute; left: 96px; right: 96px; top: 320px; bottom: 300px;
        display: flex; align-items: center; gap: 72px;
      }
      #t1-stat-numeral .stat {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: var(--size-mega); line-height: 0.95;
        color: var(--amber); letter-spacing: -0.03em;
        min-width: 760px;
      }
      #t1-stat-numeral .vrule {
        width: 1px; align-self: stretch; background: var(--rule);
        transform-origin: 50% 0%;
      }
      #t1-stat-numeral .claimcol { flex: 1; }
      #t1-stat-numeral .claim {
        font-weight: var(--wt-bold); font-size: var(--size-headline);
        letter-spacing: var(--track-tight); line-height: 1.22;
        color: var(--white); max-width: 760px;
      }
      #t1-stat-numeral .delta {
        display: flex; align-items: center; gap: 14px;
        margin-top: 36px;
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-body); color: var(--up);
      }
      #t1-stat-numeral .delta .tri {
        width: 0; height: 0;
        border-left: 11px solid transparent; border-right: 11px solid transparent;
        border-bottom: 16px solid var(--up);
      }

      /* bottom rule + source */
      #t1-stat-numeral .botrule {
        position: absolute; bottom: 170px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 100% 50%;
      }
      #t1-stat-numeral .source {
        position: absolute; bottom: 118px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-stat-numeral .stamp {
        position: absolute; bottom: 118px; right: 96px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-numeral" data-composition-id="t1-stat-numeral" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="toprule"></div>
      <div class="labelbox"><div class="boxinner" data-slot="kicker">AI CERTIFICATION MARKET</div></div>
      <div class="underbar"></div>

      <div class="row">
        <div class="stat" data-slot="stat" data-count-to="12400" data-count-prefix="" data-count-suffix="">0</div>
        <div class="vrule"></div>
        <div class="claimcol">
          <div class="claim" data-slot="label">members completed an Acme certification track this year</div>
          <div class="delta"><span class="tri"></span><span data-slot="delta">+38% YOY</span></div>
        </div>
      </div>

      <div class="botrule"></div>
      <div class="source" data-slot="source">SOURCE: ACME MEMBER SURVEY 2026</div>
      <div class="stamp">2026-07 · 09:41:07 EST</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-numeral";

      /* number roll-up with thousands separator */
      const statEl = document.querySelector(root + " .stat");
      const target = parseFloat(statEl.dataset.countTo || "12400");
      const pre = statEl.dataset.countPrefix || "";
      const suf = statEl.dataset.countSuffix || "";
      const counter = { v: 0 };
      const fmt = (n) => pre + Math.round(n).toLocaleString("en-US") + suf;

      tl.fromTo(root + " .toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.05)

        /* label box clip-reveals: inner slides out of the overflow-hidden box */
        .from(root + " .labelbox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.3)
        .fromTo(root + " .underbar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.55)

        /* numeral rolls up */
        .from(root + " .stat", { autoAlpha: 0, duration: 0.3, ease: "power2.out" }, 0.7)
        .to(counter, {
          v: target, duration: 1.6, ease: "power2.out",
          onUpdate: () => { statEl.textContent = fmt(counter.v); }
        }, 0.7)

        /* vertical rule draws down, claim snaps in */
        .fromTo(root + " .vrule", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power3.inOut" }, 0.9)
        .from(root + " .claim", { autoAlpha: 0, x: 28, duration: 0.5, ease: "expo.out" }, 1.15)

        /* delta ticks in */
        .from(root + " .delta", { autoAlpha: 0, y: 14, duration: 0.4, ease: "expo.out" }, 2.3)

        /* bottom furniture */
        .fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.4)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 1.9)
        .from(root + " .stamp",  { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-numeral"] = tl;
    </script>
  </body>
</html>
