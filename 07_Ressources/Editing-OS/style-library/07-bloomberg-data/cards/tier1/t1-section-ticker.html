<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · section · TICKER
  A ticker-tape section break. The Archivo section title clip-reveals above
  a full-width panel strip; the strip's hairline edges draw in, then the
  panel itself wipes open from center; a mono ticker line (the tape slot
  text, repeated 3x and separated by bullets) translates linearly
  right-to-left across it — a single finite pass, no loop. A Narrow-caps
  kicker sits below the strip.
  Slots: kicker, title, tape.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-ticker {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-section-ticker .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-section-ticker .titleclip {
        position: absolute; top: 300px; left: 96px; right: 96px; overflow: hidden;
      }
      #t1-section-ticker .title {
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.05;
        color: var(--white); text-transform: uppercase;
      }

      #t1-section-ticker .strip-wrap {
        position: absolute; left: 0; right: 0; top: 470px; height: 110px;
        overflow: hidden;
      }
      #t1-section-ticker .stripbg {
        position: absolute; inset: 0; background: var(--panel);
        transform-origin: 50% 50%;
      }
      #t1-section-ticker .edge-top, #t1-section-ticker .edge-bot {
        position: absolute; left: 0; right: 0; height: 1px; background: var(--rule);
        transform-origin: 0% 50%;
      }
      #t1-section-ticker .edge-top { top: 0; }
      #t1-section-ticker .edge-bot { bottom: 0; }

      #t1-section-ticker .tape-mask {
        position: absolute; inset: 0; overflow: hidden;
      }
      #t1-section-ticker .tape {
        position: absolute; top: 50%; left: 0; white-space: nowrap;
        transform: translateY(-50%);
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: var(--size-headline); letter-spacing: 0.02em;
        color: var(--amber);
      }

      #t1-section-ticker .kickerclip {
        position: absolute; top: 630px; left: 96px; overflow: hidden;
      }
      #t1-section-ticker .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t1-section-ticker" data-composition-id="t1-section-ticker" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="titleclip"><div class="title" data-slot="title">THE TAPE DOESN'T LIE</div></div>

      <div class="strip-wrap">
        <div class="stripbg"></div>
        <div class="edge-top"></div>
        <div class="edge-bot"></div>
        <div class="tape-mask">
          <div class="tape" data-slot="tape">AGENT ADOPTION UP 41% Q/Q</div>
        </div>
      </div>

      <div class="kickerclip"><div class="kicker" data-slot="kicker">SECTION BREAK</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-ticker";

      /* build the repeated tape line: base phrase x3, separated by bullets */
      const tapeEl = document.querySelector(root + " .tape");
      const base = tapeEl.textContent.trim().split(" • ")[0].trim();
      tapeEl.textContent = Array(8).fill(base).join("   •   ");

      tl.from(root + " .title", { yPercent: 105, duration: 0.65, ease: "power3.inOut" }, 0.05)

        /* strip edges draw, panel wipes open from center */
        .fromTo(root + " .edge-top", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.65)
        .fromTo(root + " .edge-bot", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.65)
        .fromTo(root + " .stripbg", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.85)

        .from(root + " .kicker", { xPercent: -101, duration: 0.45, ease: "power3.inOut" }, 1.35)

        /* single finite linear pass, right to left */
        .fromTo(root + " .tape", { x: 60 }, { x: -1500, duration: 5.2, ease: "none" }, 1.55)

        .set({}, {}, 7);

      window.__timelines["t1-section-ticker"] = tl;
    </script>
  </body>
</html>
