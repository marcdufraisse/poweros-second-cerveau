<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · thesis · BROADSHEET
  Front-page moment. A top rule draws left-to-right; a white label-box kicker
  clip-reveals beneath it with its accent underline; then a huge Archivo
  headline (two lines, one key word in accent blue) snaps in line by line —
  each line clip-revealed out of its own overflow container. A thin bottom
  rule draws in from the right, closing on a Narrow-caps source line.
  Slots: kicker, headline (richtext — two lines, wrap the emphasized word in
  <em> for the accent-blue treatment), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-broadsheet {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-thesis-broadsheet .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      /* top rule + label box */
      #t1-thesis-broadsheet .toprule {
        position: absolute; top: 120px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-thesis-broadsheet .labelbox {
        position: absolute; top: 150px; left: 96px;
        overflow: hidden;
      }
      #t1-thesis-broadsheet .labelbox .boxinner {
        background: var(--white); color: var(--black);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; padding: var(--label-pad);
      }
      #t1-thesis-broadsheet .underbar {
        position: absolute; top: 204px; left: 96px;
        width: 220px; height: var(--bar-h); background: var(--accent);
        transform-origin: 0% 50%;
      }

      /* headline: two lines, each clip-revealed from its own container */
      #t1-thesis-broadsheet .headline {
        position: absolute; top: 300px; left: 96px; right: 96px;
      }
      #t1-thesis-broadsheet .headline .hline {
        overflow: hidden;
      }
      #t1-thesis-broadsheet .headline .hline-in {
        font-weight: var(--wt-black); font-size: var(--size-display);
        letter-spacing: var(--track-tight); line-height: 1.04;
        color: var(--white); text-transform: uppercase;
      }
      #t1-thesis-broadsheet .headline em {
        font-style: normal; color: var(--accent);
      }

      /* bottom rule + source */
      #t1-thesis-broadsheet .botrule {
        position: absolute; bottom: 170px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 100% 50%;
      }
      #t1-thesis-broadsheet .source {
        position: absolute; bottom: 118px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-thesis-broadsheet .stamp {
        position: absolute; bottom: 118px; right: 96px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-broadsheet" data-composition-id="t1-thesis-broadsheet" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="toprule"></div>
      <div class="labelbox"><div class="boxinner" data-slot="kicker">ACME CERTIFICATION DESK</div></div>
      <div class="underbar"></div>

      <div class="headline" data-slot="headline">
        <div class="hline"><div class="hline-in">CERTIFIED ACME MEMBERS</div></div>
        <div class="hline"><div class="hline-in"><em>DOUBLE</em> IN SIX MONTHS</div></div>
      </div>

      <div class="botrule"></div>
      <div class="source" data-slot="source">SOURCE: ACME MEMBER SURVEY 2026</div>
      <div class="stamp">2026-07 · 09:41:07 EST</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-broadsheet";

      tl.fromTo(root + " .toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.05)

        /* label box clip-reveals: inner slides out of the overflow-hidden box */
        .from(root + " .labelbox .boxinner", { xPercent: -101, duration: 0.5, ease: "power3.inOut" }, 0.3)
        .fromTo(root + " .underbar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.55)

        /* headline lines clip-reveal one after another */
        .from(root + " .hline-in", {
          yPercent: 105, duration: 0.65, ease: "power3.inOut", stagger: 0.18
        }, 0.85)

        /* bottom furniture */
        .fromTo(root + " .botrule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.9)
        .from(root + " .source", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.4)
        .from(root + " .stamp",  { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-broadsheet"] = tl;
    </script>
  </body>
</html>
