<!doctype html>
<!--
  BLOOMBERG DATA · tier1 · quote · PULL
  Full-screen takeover. Broadsheet pull-quote: an enormous Archivo 800
  quote fragment (left-aligned, one key word in accent italic) sits
  between two horizontal rules that draw in from the left grid edge; the
  full attribution line lands under the bottom rule in Narrow caps beside
  a small amber mono page-ref. Mechanical draws, dead-still hold.
  Slots: quote (richtext, may contain <em>), attrib, ref.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-pull {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-quote-pull .scan { position: absolute; inset: 0; background: var(--tex-scan); z-index: 1; pointer-events: none; }

      #t1-quote-pull .rule-top {
        position: absolute; top: 300px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }
      #t1-quote-pull .rule-bot {
        position: absolute; top: 800px; left: 96px; right: 96px; height: 1px;
        background: var(--rule); transform-origin: 0% 50%;
      }

      #t1-quote-pull .quote {
        position: absolute; top: 400px; left: 96px; right: 220px;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); line-height: 1.06;
        color: var(--white);
      }
      #t1-quote-pull .quote em {
        font-style: italic; color: var(--accent);
      }

      #t1-quote-pull .attribrow {
        position: absolute; top: 838px; left: 96px; right: 96px;
        display: flex; align-items: baseline; justify-content: space-between;
      }
      #t1-quote-pull .attrib {
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
      }
      #t1-quote-pull .ref {
        font-family: var(--font-mono); font-weight: var(--wt-semi);
        font-size: var(--size-body); color: var(--amber);
      }

      #t1-quote-pull .stamp {
        position: absolute; bottom: 96px; left: 96px;
        font-family: var(--font-label); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="t1-quote-pull" data-composition-id="t1-quote-pull" data-start="0" data-width="1920" data-height="1080">
      <div class="scan"></div>

      <div class="rule-top"></div>
      <div class="quote" data-slot="quote">The certification isn't paper. It's <em>proof</em> the agent shipped revenue.</div>
      <div class="rule-bot"></div>

      <div class="attribrow">
        <div class="attrib" data-slot="attrib">MARCUS THIEL, FOUNDER · THIEL GROWTH PARTNERS</div>
        <div class="ref" data-slot="ref">P.04</div>
      </div>

      <div class="stamp">SOURCE: ACME MEMBER INTERVIEW SERIES 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-quote-pull";

      tl.fromTo(root + " .rule-top", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power3.inOut" }, 0.05)
        .from(root + " .quote", { autoAlpha: 0, y: 24, duration: 0.6, ease: "expo.out" }, 0.4)
        .fromTo(root + " .rule-bot", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power3.inOut" }, 1.1)

        .from(root + " .attrib", { autoAlpha: 0, x: -18, duration: 0.4, ease: "power2.out" }, 1.7)
        .from(root + " .ref",    { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 1.85)
        .from(root + " .stamp",  { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 2.1)

        .set({}, {}, 7);

      window.__timelines["t1-quote-pull"] = tl;
    </script>
  </body>
</html>
