<!doctype html>
<!--
  NICK SARAEV · tier1 · overview · LE MARKUP ÉDITORIAL
  Pour parler de TEXTE : trois lignes en serif romaine centrées sur blanc,
  puis des corrections d'éditeur qui claquent une par une — lavis rouge
  derrière la phrase, biffure, pilule rouge à bout de flèche.
  Le texte NE BOUGE JAMAIS. Seules les annotations arrivent.
  Slots: line1..line3, tag1..tag3 (le label de la pilule ; "" = pas
  d'annotation sur cette ligne).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t1-editorial-markup {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: var(--white);
      }
      #t1-editorial-markup .page {
        position: absolute; left: 200px; right: 200px; top: 32%;
        display: flex; flex-direction: column; gap: 34px; align-items: center;
      }
      #t1-editorial-markup .line {
        position: relative; width: fit-content; max-width: 100%;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px; line-height: 1.5; color: #2B2B2B; text-align: center;
      }
      /* le lavis + la biffure, révélés par clip */
      #t1-editorial-markup .line .wash {
        position: absolute; inset: -4px -8px;
        background: var(--mark-wash); border-radius: 4px;
        clip-path: inset(0 100% 0 0);
      }
      #t1-editorial-markup .line .strike {
        position: absolute; left: -4px; right: -4px; top: 50%; height: 3px;
        background: var(--mark-red); transform-origin: 0 50%; transform: scaleX(0);
      }
      #t1-editorial-markup .line .txt { position: relative; }

      /* la pilule + sa flèche de rappel */
      #t1-editorial-markup .tag {
        position: absolute; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center; gap: 0;
        opacity: 0;
      }
      #t1-editorial-markup .tag .leader {
        height: 2px; width: 34px; background: var(--mark-red);
        transform-origin: 0 50%;
      }
      #t1-editorial-markup .tag.left  { right: calc(100% + 4px); flex-direction: row-reverse; }
      #t1-editorial-markup .tag.left .leader { transform-origin: 100% 50%; }
      #t1-editorial-markup .tag.right { left: calc(100% + 4px); }
      #t1-editorial-markup .tag .pill {
        background: var(--mark-red); color: #fff;
        font-family: var(--font-body); font-weight: 800;
        font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase;
        padding: 10px 16px; border-radius: 99px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t1-editorial-markup" data-composition-id="t1-editorial-markup" data-start="0" data-width="1080" data-height="1920">
      <div class="page">
        <div class="line" data-i="1">
          <span class="wash"></span><span class="strike"></span>
          <span class="txt" data-slot="line1">It's important to note that</span>
          <span class="tag right"><span class="leader"></span><span class="pill" data-slot="tag1">Unnecessary intro</span></span>
        </div>
        <div class="line" data-i="2">
          <span class="wash"></span><span class="strike"></span>
          <span class="txt" data-slot="line2">— dropped in for effect —</span>
          <span class="tag left"><span class="leader"></span><span class="pill" data-slot="tag2">Em dash</span></span>
        </div>
        <div class="line" data-i="3">
          <span class="wash"></span><span class="strike"></span>
          <span class="txt" data-slot="line3">a unique perspective without saying anything</span>
          <span class="tag right"><span class="leader"></span><span class="pill" data-slot="tag3">Fake insight</span></span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-editorial-markup";
      const tl = gsap.timeline({ paused: true });

      /* la page arrive entière, tranquille */
      tl.fromTo(root + " .page", { y: 30, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 0.05);

      /* les corrections claquent, une ligne à la fois */
      let t = 0.7;
      document.querySelectorAll(root + " .line").forEach((line) => {
        const tag = line.querySelector(".pill");
        if (!tag || !tag.textContent.trim()) return;
        tl.to(line.querySelector(".wash"), { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "power2.inOut" }, t);
        tl.to(line.querySelector(".strike"), { scaleX: 1, duration: 0.26, ease: "power2.inOut" }, t + 0.12);
        tl.fromTo(line.querySelector(".tag .leader"), { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, t + 0.3);
        tl.fromTo(line.querySelector(".tag"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, t + 0.28);
        tl.fromTo(line.querySelector(".pill"), { scale: 0.7 },
          { scale: 1, duration: 0.26, ease: "back.out(2.4)" }, t + 0.42);
        t += 0.75;
      });

      tl.set({}, {}, t + 1.6);
      window.__timelines["t1-editorial-markup"] = tl;
    </script>
  </body>
</html>
