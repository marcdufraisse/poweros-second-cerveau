<!doctype html>
<!--
  HIGGSFIELD · tier1 · section · OLIVE PILL
  Quieter olive section marker (the stage-boot's little sibling): no mega
  title, just a lime-outlined mono pill that draws its border, then the
  section name resolves inside it with the dot-matrix shimmer. For minor
  section changes where the full boot card is too loud.
  Slots: pill, title.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t1-section-olive-pill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--olive); overflow: hidden; font-family: var(--font-display);
      }
      #t1-section-olive-pill .bokeh {
        position: absolute; inset: -6%; width: 112%; height: 112%;
        background: var(--olive-bokeh); filter: blur(46px);
      }
      #t1-section-olive-pill .dots {
        position: absolute; inset: 0;
        background-image: var(--dot-grid); background-size: var(--dot-grid-size);
      }
      #t1-section-olive-pill .vig { position: absolute; inset: 0; background: var(--vignette); }

      #t1-section-olive-pill .wrap {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 34px; z-index: 2;
      }
      #t1-section-olive-pill .pill {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-tiny); letter-spacing: var(--track-pill);
        text-transform: uppercase; color: var(--lime);
        border: 1.5px solid var(--lime-dim); border-radius: 100px;
        padding: 10px 26px;
      }
      #t1-section-olive-pill .title {
        font-weight: var(--wt-heavy); font-size: var(--size-display); line-height: 1;
        letter-spacing: 0.03em; text-transform: uppercase; color: var(--white);
        text-shadow: 0 0 26px rgba(var(--lime-rgb), 0.24);
      }
      #t1-section-olive-pill .title .ch { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="t1-section-olive-pill" data-composition-id="t1-section-olive-pill" data-start="0" data-width="1920" data-height="1080">
      <div class="bokeh"></div>
      <div class="dots"></div>
      <div class="vig"></div>
      <div class="wrap">
        <div class="pill" data-slot="pill">PART 2</div>
        <div class="title" data-slot="title">THE SCRIPT</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t1-section-olive-pill";

      function splitChars(el) {
        const text = el.textContent; el.textContent = "";
        text.split("").forEach((ch) => {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = ch === " " ? "\u00A0" : ch;
          el.appendChild(s);
        });
      }
      splitChars(document.querySelector(root + " .title"));

      function seededOrder(n, seed) {
        let s = seed; const idx = Array.from({ length: n }, (_, i) => i);
        for (let i = n - 1; i > 0; i--) {
          s = (s * 1103515245 + 12345) % 2147483648;
          const j = s % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]];
        }
        const rank = new Array(n); idx.forEach((v, i) => (rank[v] = i)); return rank;
      }

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .pill", { autoAlpha: 0, scale: 0.85, duration: 0.4, ease: "back.out(1.9)" }, 0.12);

      const chs = gsap.utils.toArray(root + " .title .ch");
      const rank = seededOrder(chs.length, 7);
      chs.forEach((ch, i) => {
        tl.from(ch, { autoAlpha: 0, filter: "blur(8px)", duration: 0.5, ease: "power2.out" }, 0.4 + rank[i] * 0.05);
      });

      tl.to(root + " .bokeh", { xPercent: -1.4, yPercent: 1.2, duration: 3.2, ease: "sine.inOut" }, 0)
        .set({}, {}, 4);

      window.__timelines["t1-section-olive-pill"] = tl;
    </script>
  </body>
</html>
