<!doctype html>
<!--
  HIGGSFIELD · tier2 · label · ARROW FLOW
  The "IDEA -> $$$" move: top word lands, an arrow draws downward, the payoff
  word pops under it. Vertical stack beside the head, lime with dark rim,
  slight tilt.
  Slots: top, bottom.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-arrow-flow {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-arrow-flow .block {
        position: absolute; top: 200px; right: 200px; z-index: 3;
      }
      #t2-arrow-flow .tilt {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        transform: var(--kinetic-tilt); /* static 3D tilt; GSAP moves .block */
      }
      #t2-arrow-flow .word {
        font-weight: var(--wt-black); font-size: var(--size-headline); line-height: 1;
        letter-spacing: 0.04em; text-transform: uppercase;
        color: var(--lime); text-shadow: var(--kinetic-shadow);
      }
      #t2-arrow-flow svg { display: block; }
      #t2-arrow-flow .shaft {
        stroke: var(--lime); stroke-width: 7; fill: none; stroke-linecap: round;
      }
      #t2-arrow-flow .head { fill: var(--lime); }
    </style>
  </head>
  <body>
    <div id="t2-arrow-flow" data-composition-id="t2-arrow-flow" data-start="0" data-width="1920" data-height="1080">
      <div class="block"><div class="tilt">
        <div class="word top" data-slot="top">IDEA</div>
        <svg width="40" height="92" viewBox="0 0 40 92">
          <line class="shaft" x1="20" y1="6" x2="20" y2="62" />
          <polygon class="head" points="20,86 4,58 36,58" />
        </svg>
        <div class="word bottom" data-slot="bottom">$$$</div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-arrow-flow";

      const shaft = document.querySelector(root + " .shaft");
      const len = 56;
      shaft.style.strokeDasharray = len;
      shaft.style.strokeDashoffset = len;

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .word.top", { autoAlpha: 0, y: 20, duration: 0.4, ease: "expo.out" }, 0.1)
        /* arrow draws downward */
        .to(shaft, { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 0.55)
        .from(root + " .head", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 0%", duration: 0.22, ease: "back.out(2)" }, 0.85)
        /* payoff pops */
        .from(root + " .word.bottom", { autoAlpha: 0, scale: 1.5, duration: 0.32, ease: "back.out(2)" }, 1.05)
        /* micro-drift */
        .to(root + " .block", { y: -8, duration: 2.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2)
        .set({}, {}, 5.5);

      window.__timelines["t2-arrow-flow"] = tl;
    </script>
  </body>
</html>
