<!doctype html>
<!--
  HIGGSFIELD · tier2 · media · PAPER SCRIPT
  The white tilted document card sliding in from the right: doc title, a thin
  rule, then body lines that draw on as skeleton bars (reads as "a script
  exists" without literal tiny text). A lime margin highlight sweeps one bar.
  Slots: title, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-paper-script {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-paper-script .doc {
        position: absolute; top: 150px; right: 150px; z-index: 3;
        width: 470px;
      }
      #t2-paper-script .tilt {
        padding: 44px 46px 52px;
        background: var(--cream-2); border-radius: 10px;
        box-shadow: var(--glass-shadow);
        transform: perspective(1400px) rotateY(-9deg) rotate(2.5deg); /* static; GSAP moves .doc */
      }
      #t2-paper-script .title {
        font-weight: var(--wt-heavy); font-size: 34px; line-height: 1.15;
        color: var(--charcoal); margin-bottom: 8px;
      }
      #t2-paper-script .sub {
        font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.14em;
        text-transform: uppercase; color: rgba(23, 25, 28, 0.5); margin-bottom: 22px;
      }
      #t2-paper-script .rule { height: 2px; background: rgba(23, 25, 28, 0.14); margin-bottom: 26px; }
      #t2-paper-script .bar {
        height: 11px; border-radius: 6px; background: rgba(23, 25, 28, 0.13);
        margin-bottom: 14px; transform-origin: 0 50%; position: relative;
      }
      #t2-paper-script .bar.hl::after {
        content: ""; position: absolute; inset: -3px -6px;
        background: var(--lime-dim); border-radius: 8px;
        transform: scaleX(var(--hl, 0)); transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div id="t2-paper-script" data-composition-id="t2-paper-script" data-start="0" data-width="1920" data-height="1080">
      <div class="doc"><div class="tilt">
        <div class="title" data-slot="title">Headphone Ad Script</div>
        <div class="sub" data-slot="sub">SCENE 1 · INT KITCHEN</div>
        <div class="rule"></div>
        <div class="bar" style="width: 92%"></div>
        <div class="bar" style="width: 100%"></div>
        <div class="bar hl" style="width: 84%"></div>
        <div class="bar" style="width: 96%"></div>
        <div class="bar" style="width: 65%"></div>
        <div class="bar" style="width: 100%"></div>
        <div class="bar" style="width: 88%"></div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-paper-script";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .doc", {
          autoAlpha: 0, x: 140, rotation: 6, duration: 0.6, ease: "expo.out"
        }, 0.1)
        .from(root + " .title", { autoAlpha: 0, y: 10, duration: 0.3, ease: "expo.out" }, 0.5)
        .from(root + " .sub",   { autoAlpha: 0, duration: 0.25, ease: "power2.out" }, 0.65)
        .from(root + " .rule",  { scaleX: 0, transformOrigin: "0 50%", duration: 0.35, ease: "power3.out" }, 0.75)
        .from(root + " .bar",   { scaleX: 0, duration: 0.3, ease: "power3.out", stagger: 0.07 }, 0.9)
        /* lime margin highlight sweeps the key line */
        .to(root + " .bar.hl", { "--hl": 1, duration: 0.4, ease: "power3.out" }, 1.8)
        /* paper drifts subtly */
        .to(root + " .doc", { y: -8, rotation: -1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8)
        .set({}, {}, 6.5);

      window.__timelines["t2-paper-script"] = tl;
    </script>
  </body>
</html>
