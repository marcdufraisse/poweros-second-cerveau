<!doctype html>
<!--
  HIGGSFIELD · tier2 · label · GLASS STEP
  The frosted-glass step panel floating beside the speaker: eyebrow, title,
  and sub build line by line (each entering dim, flipping to lime-soft), the
  panel snaps in tilted then drifts slowly while alive.
  Slots: kicker, title, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-glass-step {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-glass-step .panel {
        position: absolute; top: 190px; right: 120px; z-index: 3;
      }
      #t2-glass-step .tilt {
        width: 560px; padding: 44px 50px;
        display: flex; flex-direction: column; align-items: center; gap: 22px;
        background: var(--glass-bg);
        border: var(--glass-edge); border-radius: var(--radius);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
        transform: var(--glass-tilt); /* static 3D tilt; GSAP moves .panel */
        text-align: center;
      }
      #t2-glass-step .kicker {
        font-weight: var(--wt-semi); font-size: var(--size-tiny);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      #t2-glass-step .title {
        font-weight: var(--wt-heavy); font-size: 40px; line-height: 1.14;
        letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55);
      }
      #t2-glass-step .sub {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-tiny); letter-spacing: var(--track-pill);
        text-transform: uppercase; color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="t2-glass-step" data-composition-id="t2-glass-step" data-start="0" data-width="1920" data-height="1080">
      <div class="panel"><div class="tilt">
        <div class="kicker" data-slot="kicker">STEP 3</div>
        <div class="title" data-slot="title">GENERATING SCENES</div>
        <div class="sub" data-slot="sub">IN SEEDANCE 2.0</div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#t2-glass-step";
      const css = getComputedStyle(document.documentElement);
      const LIMESOFT = css.getPropertyValue("--lime-soft").trim();

      const tl = gsap.timeline({ paused: true });

      /* panel snaps in */
      tl.from(root + " .panel", {
          autoAlpha: 0, x: 90, duration: 0.55, ease: "expo.out"
        }, 0.1)

        /* lines build: enter dim, flip to lime-soft staged */
        .from(root + " .kicker", { autoAlpha: 0, y: 12, duration: 0.3, ease: "expo.out" }, 0.45)
        .from(root + " .title",  { autoAlpha: 0, y: 14, duration: 0.34, ease: "expo.out" }, 0.85)
        .to(root + " .kicker",   { color: LIMESOFT, duration: 0.22, ease: "power2.inOut" }, 0.9)
        .from(root + " .sub",    { autoAlpha: 0, y: 12, duration: 0.3, ease: "expo.out" }, 1.35)
        .to(root + " .title",    { color: LIMESOFT, duration: 0.22, ease: "power2.inOut" }, 1.4)
        .to(root + " .sub",      { color: LIMESOFT, duration: 0.22, ease: "power2.inOut" }, 1.85)

        /* drift while alive */
        .to(root + " .panel", { y: -10, rotation: -0.6, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.7)

        .set({}, {}, 7);

      window.__timelines["t2-glass-step"] = tl;
    </script>
  </body>
</html>
