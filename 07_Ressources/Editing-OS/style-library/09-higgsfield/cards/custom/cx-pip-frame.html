<!doctype html>
<!--
  HIGGSFIELD · custom · pip · SPEAKER PIP FRAME
  The screen-recording grammar: a rounded speaker-PIP frame bottom-right with
  den-tone chrome and a lime prompt pill beside it. The PIP well is empty -
  Agent 3 layers the actual speaker <video> in a wrapper positioned to match
  (contract: never put class="clip" or transforms on the video itself).
  Slots: pill.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #cx-pip-frame {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden; font-family: var(--font-mono);
      }
      /* the PIP well: Agent 3 aligns the speaker video wrapper to this box
         (x 1560, y 780, 300x240 incl. 4px chrome inset) */
      #cx-pip-frame .pip {
        position: absolute; right: 60px; bottom: 60px; z-index: 3;
        width: 300px; height: 240px;
        border-radius: var(--radius-pip);
        background: rgba(25, 35, 42, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.5);
      }
      #cx-pip-frame .pill {
        position: absolute; right: 380px; bottom: 92px; z-index: 3;
        font-weight: var(--wt-bold); font-size: var(--size-tiny);
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--charcoal); background: var(--lime);
        border-radius: var(--radius-sm); padding: 12px 20px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="cx-pip-frame" data-composition-id="cx-pip-frame" data-start="0" data-width="1920" data-height="1080">
      <div class="pip"></div>
      <div class="pill" data-slot="pill">GENERATING...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#cx-pip-frame";

      const tl = gsap.timeline({ paused: true });

      tl.from(root + " .pip", { autoAlpha: 0, y: 60, scale: 0.9, duration: 0.5, ease: "expo.out" }, 0.1)
        .from(root + " .pill", { autoAlpha: 0, x: 40, duration: 0.4, ease: "back.out(1.9)" }, 0.5)
        /* pill breathes once to read as "working" */
        .to(root + " .pill", { scale: 1.04, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0)
        .set({}, {}, 8);

      window.__timelines["cx-pip-frame"] = tl;
    </script>
  </body>
</html>
