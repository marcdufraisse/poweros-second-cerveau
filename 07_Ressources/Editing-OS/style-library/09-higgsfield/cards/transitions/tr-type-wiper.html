<!doctype html>
<!--
  HIGGSFIELD · transition · TYPE WIPER
  A mega Inter Tight 900 word drives through the frame right-to-left as the
  wiper — kinetic type doing the transition's job. Slight skew while moving
  (motion lean), the scene hard-swaps as the word crosses center, and the
  word exits pulling the new scene's first beat behind it.
  Slots: word.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-type-wiper {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .wiper {
        position: absolute; left: 0; top: 50%; z-index: 5; height: 0;
        display: flex; align-items: center; will-change: transform;
      }
      .wiper .w {
        font-weight: var(--wt-black); font-size: 420px; line-height: 1;
        letter-spacing: -0.01em; text-transform: uppercase; color: var(--lime);
        white-space: nowrap;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.5), 0 30px 70px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="tr-type-wiper" data-composition-id="tr-type-wiper" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"><div class="tag">TYPE WIPER · THE WORD IS THE TRANSITION</div></div>
      <div class="sceneB"></div>
      <div class="wiper"><div class="w" data-slot="word">NEXT UP</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-type-wiper";
      const tl = gsap.timeline({ paused: true });

      /* word drives through with a motion lean; swap under its center pass */
      tl.set(root + " .wiper", { x: 2100, skewX: -8 }, 0)
        .to(root + " .wiper", { x: -3400, duration: 1.0, ease: "power2.inOut" }, 1.2)
        .to(root + " .wiper", { skewX: 0, duration: 0.4, ease: "power2.out" }, 1.9)

        .set(root + " .sceneA", { visibility: "hidden" }, 1.7)
        .set(root + " .sceneB", { visibility: "visible" }, 1.7)

        .set({}, {}, 4.4);

      window.__timelines["tr-type-wiper"] = tl;
    </script>
  </body>
</html>
