<!doctype html>
<!--
  HIGGSFIELD · transition · FLASH CUT
  The 3-frame lime-white pop (ref: v2's lightning-over-ingots beat). Flash
  spikes to full, the cut lands inside it, B settles from a 1.06 micro-punch.
  The fastest move in the kit — for rapid-fire montage runs where even a whip
  is too slow.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-flash-cut {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .cam { position: absolute; inset: 0; transform-origin: 50% 46%; }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); visibility: hidden; }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .flash {
        position: absolute; inset: 0; z-index: 6; opacity: 0; pointer-events: none;
        background: radial-gradient(70% 70% at 50% 46%,
          rgba(255, 255, 250, 0.98) 0%, rgba(var(--lime-rgb), 0.75) 55%, rgba(var(--lime-rgb), 0.25) 100%);
      }
    </style>
  </head>
  <body>
    <div id="tr-flash-cut" data-composition-id="tr-flash-cut" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <div class="sceneA"></div>
        <div class="sceneB"></div>
        <div class="tag">FLASH CUT · THREE FRAMES OF LIME LIGHTNING</div>
      </div>
      <div class="flash"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-flash-cut";
      const tl = gsap.timeline({ paused: true });

      tl.to(root + " .flash", { opacity: 1, duration: 0.07, ease: "power1.in" }, 1.5)

        .set(root + " .sceneA", { visibility: "hidden" }, 1.57)
        .set(root + " .sceneB", { visibility: "visible" }, 1.57)
        .set(root + " .cam", { scale: 1.06 }, 1.57)

        .to(root + " .flash", { opacity: 0, duration: 0.16, ease: "power2.out" }, 1.58)
        .to(root + " .cam", { scale: 1, duration: 0.45, ease: "power3.out" }, 1.58)

        .set({}, {}, 3.6);

      window.__timelines["tr-flash-cut"] = tl;
    </script>
  </body>
</html>
