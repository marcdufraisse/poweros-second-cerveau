<!doctype html>
<!--
  HIGGSFIELD · transition · WHIP PAN
  The AE classic: camera whips left, both scenes travel as one world, motion
  blur ramps up mid-whip and clears on the settle. Scene B lands with a 30px
  overshoot then settles (the "hand-eased" AE finish). Swap is positional —
  B physically sits to the right of A.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-whip-pan {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .cam { position: absolute; inset: 0; will-change: transform, filter; }
      .sceneA, .sceneB { position: absolute; top: 0; width: 1920px; height: 1080px; }
      .sceneA { left: 0; background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { left: 1920px; background: var(--olive); }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
    </style>
  </head>
  <body>
    <div id="tr-whip-pan" data-composition-id="tr-whip-pan" data-start="0" data-width="1920" data-height="1080">
      <div class="cam">
        <div class="sceneA"><div class="tag">WHIP PAN · ONE WORLD, MOTION BLUR, OVERSHOOT SETTLE</div></div>
        <div class="sceneB"><div class="tag">SCENE B · LANDED</div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-whip-pan";
      const tl = gsap.timeline({ paused: true });

      /* whip past the target, blur peaks mid-move, settle back the 30px */
      tl.to(root + " .cam", { x: -1950, duration: 0.5, ease: "power4.inOut" }, 1.2)
        .to(root + " .cam", { x: -1920, duration: 0.35, ease: "power3.out" }, 1.7)
        .to(root + " .cam", { filter: "blur(26px)", duration: 0.22, ease: "power2.in" }, 1.25)
        .to(root + " .cam", { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 1.55)
        .set({}, {}, 4);

      window.__timelines["tr-whip-pan"] = tl;
    </script>
  </body>
</html>
