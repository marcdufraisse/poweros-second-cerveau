<!doctype html>
<!--
  HIGGSFIELD · transition · CIRCLE REVEAL
  Scene B irises open from a point (like clicking a UI element in the product
  — the graphics ARE the UI escaped into the room). A lime ring leads the
  expanding edge and dissolves as the circle swallows the frame. Clip-path
  driven, fully seekable.
  Slots: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #tr-circle-reveal {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--navy); overflow: hidden; font-family: var(--font-display);
      }
      .sceneA, .sceneB { position: absolute; inset: 0; }
      .sceneA { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 46%); }
      .sceneA::after { content: ""; position: absolute; inset: 0; background: var(--streaks); }
      .sceneB { background: var(--olive); z-index: 3; clip-path: circle(0px at 1310px 620px); }
      .sceneB::after { content: ""; position: absolute; inset: 0; background-image: var(--dot-grid); background-size: var(--dot-grid-size); }
      .tag {
        position: absolute; left: 64px; bottom: 56px; z-index: 2;
        font-family: var(--font-mono); font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-pill); text-transform: uppercase; color: var(--grey-pre);
      }
      .ring {
        position: absolute; left: 1310px; top: 620px; width: 120px; height: 120px;
        margin: -60px 0 0 -60px; z-index: 5; border-radius: 50%;
        border: 3px solid var(--lime);
        box-shadow: 0 0 30px rgba(var(--lime-rgb), 0.4), inset 0 0 22px rgba(var(--lime-rgb), 0.25);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="tr-circle-reveal" data-composition-id="tr-circle-reveal" data-start="0" data-width="1920" data-height="1080">
      <div class="sceneA"><div class="tag">CIRCLE REVEAL · IRIS FROM THE CLICK POINT</div></div>
      <div class="sceneB"></div>
      <div class="ring"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = "#tr-circle-reveal";
      const tl = gsap.timeline({ paused: true });

      /* ring pings at the origin point, then the iris opens behind it */
      tl.fromTo(root + " .ring", { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.9)" }, 1.0)

        .to(root + " .sceneB", {
          clipPath: "circle(2300px at 1310px 620px)",
          duration: 0.8, ease: "power3.inOut"
        }, 1.4)
        .to(root + " .ring", { scale: 40, opacity: 0, duration: 0.8, ease: "power3.inOut" }, 1.4)

        .set({}, {}, 4.2);

      window.__timelines["tr-circle-reveal"] = tl;
    </script>
  </body>
</html>
