<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · stat · LEFT
  Full-screen takeover. True-black stage; left half carries a huge
  left-aligned metallic count-up number; right column holds a quiet kicker,
  a headline claim, and two hairline-separated micro spec rows (mono label +
  value). Silk motion, no bounce.
  Slots: kicker, stat, label, spec1, spec2.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-left {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-left .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-stat-left .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-stat-left .row {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center;
        padding: 0 var(--pad);
      }

      #t1-stat-left .left-col {
        width: 52%;
      }

      /* metallic hero number — background-clip:text; padding protects edges;
         NO will-change here (render gotcha) */
      #t1-stat-left .stat {
        font-weight: var(--wt-black); font-size: calc(var(--size-mega) * 0.74);
        line-height: 1.0; letter-spacing: var(--track-display);
        padding: 0 10px 0 0;
        background: var(--metal-text);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        display: inline-block;
      }

      #t1-stat-left .right-col {
        width: 48%;
        display: flex; flex-direction: column; justify-content: center;
        padding-left: 72px;
      }

      #t1-stat-left .kicker {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 18px;
      }

      #t1-stat-left .label {
        font-weight: var(--wt-semi); font-size: var(--size-headline);
        letter-spacing: var(--track-snug); color: var(--text);
        line-height: 1.28; max-width: 720px;
        margin-bottom: 40px;
      }
      #t1-stat-left .label em { font-style: normal; color: var(--accent); }

      #t1-stat-left .spec-row {
        display: flex; align-items: baseline; justify-content: space-between;
        max-width: 640px;
        padding: 18px 0;
        border-top: var(--rule);
      }
      #t1-stat-left .spec-row.last { border-bottom: var(--rule); }

      #t1-stat-left .spec-label {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-tiny); letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--text-faint);
      }
      #t1-stat-left .spec-value {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-body); color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-left" data-composition-id="t1-stat-left" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="row">
        <div class="left-col">
          <div class="stat" data-slot="stat" data-count-to="1240" data-count-suffix="+">0+</div>
        </div>

        <div class="right-col">
          <div class="kicker" data-slot="kicker">Certification pipeline</div>
          <div class="label" data-slot="label">workflows launched by Acme members in the last <em>90 days</em></div>

          <div class="spec-row" data-slot="spec1">
            <span class="spec-label">Avg build time</span>
            <span class="spec-value">38 min</span>
          </div>
          <div class="spec-row last" data-slot="spec2">
            <span class="spec-label">Completion rate</span>
            <span class="spec-value">91%</span>
          </div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-left";

      const statEl = document.querySelector(root + " .stat");
      const target = parseFloat(statEl.dataset.countTo || "1240");
      const suffix = statEl.dataset.countSuffix || "";
      const counter = { v: 0 };

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "20% 60%", duration: 1.6, ease: "expo.out" }, 0)

        /* left mega number rises + resolves while it counts */
        .from(root + " .stat", { autoAlpha: 0, x: -30, filter: "blur(14px)", duration: 1.3, ease: "expo.out" }, 0.3)
        .to(counter, {
          v: target, duration: 1.9, ease: "power3.out",
          onUpdate: () => { statEl.textContent = Math.round(counter.v) + suffix; }
        }, 0.3)

        .from(root + " .kicker", { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 1.0, ease: "expo.out" }, 0.55)
        .from(root + " .label",  { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 1.0, ease: "expo.out" }, 0.8)

        .from(root + " .spec-row[data-slot='spec1']", { autoAlpha: 0, y: 16, duration: 0.9, ease: "expo.out" }, 1.15)
        .from(root + " .spec-row[data-slot='spec2']", { autoAlpha: 0, y: 16, duration: 0.9, ease: "expo.out" }, 1.35)

        /* glow drifts — finite */
        .to(root + " .stage-glow", { scale: 1.05, transformOrigin: "20% 60%", duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-left"] = tl;
    </script>
  </body>
</html>
