<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · section · NUMBER
  Full-screen chapter marker. True-black stage. An enormous chapter numeral
  sits behind and offset from the title as a dim outlined ghost (stroke only,
  transparent fill, no gradient) — the title and its sub-line sit in front,
  full white, overlapping its lower edge. No accent color; the depth itself
  is the device.
  Slots: num (text), title (text), sub (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-number {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-section-number .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-section-number .edge {
        position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none;
      }

      #t1-section-number .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-section-number .wrap {
        position: relative; width: 980px; height: 560px;
      }

      /* the ghost numeral — stroke only, transparent fill, offset behind */
      #t1-section-number .num {
        position: absolute; top: -30px; left: -40px; z-index: 2;
        font-weight: var(--wt-black); font-size: var(--size-mega);
        line-height: 1; letter-spacing: var(--track-display);
        color: transparent; -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 2px var(--text-faint);
        transform: scale(1.5); transform-origin: 0% 0%;
      }

      #t1-section-number .content {
        position: absolute; left: 60px; bottom: 40px; z-index: 4;
        max-width: 820px;
      }

      #t1-section-number .title {
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-snug); line-height: 1.05;
        color: var(--text);
      }

      #t1-section-number .sub {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); letter-spacing: var(--track-snug);
        color: var(--text-dim); margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-number" data-composition-id="t1-section-number" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="wrap">
          <div class="num" data-slot="num">3</div>
          <div class="content">
            <div class="title" data-slot="title">Automations</div>
            <div class="sub" data-slot="sub">Turning workflows into systems that run without you</div>
          </div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-number";

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 78%", duration: 1.6, ease: "expo.out" }, 0)

        /* the ghost numeral resolves first, low and slow */
        .from(root + " .num", { autoAlpha: 0, y: 30, filter: "blur(18px)", duration: 1.5, ease: "expo.out" }, 0.25)

        /* the title lands in front of it */
        .from(root + " .title", { autoAlpha: 0, y: 30, filter: "blur(12px)", duration: 1.1, ease: "expo.out" }, 0.85)

        .from(root + " .sub", { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 1.35)

        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 78%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6)

        .set({}, {}, 7);

      window.__timelines["t1-section-number"] = tl;
    </script>
  </body>
</html>
