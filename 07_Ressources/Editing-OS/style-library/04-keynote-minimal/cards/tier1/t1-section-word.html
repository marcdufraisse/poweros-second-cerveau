<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · section · WORD
  Full-screen chapter marker. True-black stage, one soft glow low in frame, a
  tiny mono chapter index above a single mega word set in the metallic
  gradient. The word scales and blur-resolves into place; no count-up, no
  supporting copy — pure chapter punctuation.
  Slots: index (text), word (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-section-word {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-section-word .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-section-word .edge {
        position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none;
      }

      #t1-section-word .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      #t1-section-word .index {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        color: var(--text-faint); margin-bottom: 30px;
      }

      /* the mega chapter word — metallic gradient, background-clip:text;
         padding protects edges; NO will-change here (render gotcha) */
      #t1-section-word .word {
        font-weight: var(--wt-black); font-size: var(--size-mega);
        line-height: 1; letter-spacing: var(--track-display);
        padding: 0 40px;
        background: var(--metal-text);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="t1-section-word" data-composition-id="t1-section-word" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="index" data-slot="index">01 / 05</div>
        <div class="word" data-slot="word">Agents</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-section-word";

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 78%", duration: 1.6, ease: "expo.out" }, 0)

        .from(root + " .index", { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 0.3)

        /* the word arrives with more scale + blur drama than a plain line */
        .from(root + " .word", { autoAlpha: 0, y: 30, scale: 0.92, filter: "blur(16px)", duration: 1.4, ease: "expo.out" }, 0.65)

        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 78%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6)

        .set({}, {}, 7);

      window.__timelines["t1-section-word"] = tl;
    </script>
  </body>
</html>
