<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · thesis · CONTRAST
  Full-screen takeover. True-black stage. Two stacked lines set the claim by
  weight-contrast rather than color: a dim, light-weight setup line resolves
  first, a beat passes, then a heavier, larger, full-white payoff line lands
  directly beneath it. No accent color used — the contrast IS the device.
  Slots: line1 (text), line2 (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-thesis-contrast {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-thesis-contrast .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-thesis-contrast .edge {
        position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none;
      }

      #t1-thesis-contrast .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 var(--pad);
      }

      /* setup line — quiet, light, dim */
      #t1-thesis-contrast .line1 {
        font-weight: var(--wt-reg); font-size: var(--size-title);
        letter-spacing: var(--track-snug); line-height: 1.15;
        color: var(--text-dim); max-width: 1400px;
        margin-bottom: 18px;
      }

      /* payoff line — heavy, full white, slightly larger */
      #t1-thesis-contrast .line2 {
        font-weight: var(--wt-black); font-size: var(--size-display);
        letter-spacing: var(--track-display); line-height: 1.06;
        color: var(--text); max-width: 1500px; padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="t1-thesis-contrast" data-composition-id="t1-thesis-contrast" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="line1" data-slot="line1">It's not more content.</div>
        <div class="line2" data-slot="line2">It's the right system.</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-thesis-contrast";

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 82%", duration: 1.6, ease: "expo.out" }, 0)

        /* setup line resolves first */
        .from(root + " .line1", { autoAlpha: 0, y: 26, filter: "blur(10px)", duration: 1.1, ease: "expo.out" }, 0.3)

        /* a full beat of quiet before the payoff */
        .from(root + " .line2", { autoAlpha: 0, y: 34, filter: "blur(14px)", duration: 1.2, ease: "expo.out" }, 1.7)

        .to(root + " .stage-glow", { scale: 1.06, transformOrigin: "50% 82%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.9)

        .set({}, {}, 7);

      window.__timelines["t1-thesis-contrast"] = tl;
    </script>
  </body>
</html>
