<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · quote · CENTER
  Full-screen takeover. True-black stage; a soft stage glow breathes low in
  frame; a sparse centered quote with short hairlines above and below that
  draw outward from center; mono attribution (name · role) resolves beneath.
  Slots: quote, name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-quote-center {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-quote-center .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-quote-center .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-quote-center .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 var(--pad);
      }

      /* hairlines draw outward from center — width interpolates while the
         flex column keeps them horizontally centered */
      #t1-quote-center .rule-h {
        height: 1px; background: var(--hairline); width: 0px;
      }
      #t1-quote-center .rule-top { margin-bottom: 46px; }
      #t1-quote-center .rule-bottom { margin-top: 46px; }

      #t1-quote-center .quote {
        font-weight: var(--wt-semi); font-size: calc(var(--size-headline) + 12px);
        line-height: 1.36; letter-spacing: var(--track-snug);
        max-width: 1320px; color: var(--text); padding: 0 8px;
      }
      #t1-quote-center .quote em {
        font-style: normal; color: var(--accent);
      }

      #t1-quote-center .attribution {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-label); color: var(--text-dim);
        letter-spacing: 0.02em; display: flex; align-items: center; gap: 14px;
      }
      #t1-quote-center .attribution .dot { color: var(--text-faint); }
    </style>
  </head>
  <body>
    <div id="t1-quote-center" data-composition-id="t1-quote-center" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="rule-h rule-top"></div>
        <div class="quote" data-slot="quote">The certification didn&rsquo;t just teach me the tools. It gave me a system I could actually <em>ship with clients</em>.</div>
        <div class="rule-h rule-bottom"></div>
        <div class="attribution">
          <span data-slot="name">Priya Nandakumar</span>
          <span class="dot">&middot;</span>
          <span data-slot="role">AI Automation Consultant</span>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-quote-center";

      tl.from(root + " .stage-glow", { autoAlpha: 0, duration: 1.6, ease: "expo.out" }, 0)

        /* hairlines grow outward from the centered flex column */
        .fromTo(root + " .rule-top", { width: 0 }, { width: 130, duration: 1.1, ease: "expo.out" }, 0.25)
        .fromTo(root + " .rule-bottom", { width: 0 }, { width: 130, duration: 1.1, ease: "expo.out" }, 0.25)

        .from(root + " .quote", { autoAlpha: 0, y: 30, filter: "blur(11px)", duration: 1.2, ease: "expo.out" }, 0.5)

        .from(root + " .attribution", { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 1.0, ease: "expo.out" }, 1.35)

        /* glow breathes — finite */
        .to(root + " .stage-glow", { scale: 1.05, transformOrigin: "50% 78%", duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-quote-center"] = tl;
    </script>
  </body>
</html>
