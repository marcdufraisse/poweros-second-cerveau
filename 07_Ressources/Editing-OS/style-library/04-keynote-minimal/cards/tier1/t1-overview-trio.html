<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · overview · TRIO
  Full-screen takeover. True-black stage; a soft stage glow breathes low in
  frame; three equal columns separated by two vertical hairlines, each with
  a big keyword/number and two lines of dim copy, resolving left to right
  beneath a title.
  Slots: title, h1, b1, h2, b2, h3, b3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-overview-trio {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-overview-trio .stage-glow {
        position: absolute; inset: 0; background: var(--glow-stage); z-index: 1;
      }
      #t1-overview-trio .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-overview-trio .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      #t1-overview-trio .title {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--text); margin-bottom: 76px; text-align: center;
      }

      #t1-overview-trio .trio {
        display: flex; align-items: flex-start; justify-content: center;
      }

      #t1-overview-trio .col {
        width: 440px; text-align: center; padding: 0 20px;
      }

      #t1-overview-trio .h {
        font-weight: var(--wt-bold); font-size: var(--size-title);
        letter-spacing: var(--track-display); color: var(--text);
        line-height: 1.05; margin-bottom: 26px;
      }

      #t1-overview-trio .b {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.45; color: var(--text-dim);
        max-width: 340px; margin: 0 auto;
      }

      #t1-overview-trio .vline {
        width: 1px; height: 260px; background: var(--hairline);
        margin-top: 20px; transform: scaleY(0); transform-origin: 0% 0%;
      }
    </style>
  </head>
  <body>
    <div id="t1-overview-trio" data-composition-id="t1-overview-trio" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="title" data-slot="title">Three ways members grow with Acme</div>

        <div class="trio">
          <div class="col" data-col="1">
            <div class="h" data-slot="h1">Learn</div>
            <div class="b" data-slot="b1">Structured certification tracks on agents, automation, and prompt systems.</div>
          </div>
          <div class="vline" data-vline="1"></div>
          <div class="col" data-col="2">
            <div class="h" data-slot="h2">Build</div>
            <div class="b" data-slot="b2">Live labs and templates to ship your first automated workflow in week one.</div>
          </div>
          <div class="vline" data-vline="2"></div>
          <div class="col" data-col="3">
            <div class="h" data-slot="h3">Earn</div>
            <div class="b" data-slot="b3">A member network and job board matching certified builders to paid work.</div>
          </div>
        </div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-overview-trio";

      tl.from(root + " .stage-glow", { autoAlpha: 0, duration: 1.6, ease: "expo.out" }, 0)

        .from(root + " .title", { autoAlpha: 0, y: 26, filter: "blur(10px)", duration: 1.1, ease: "expo.out" }, 0.2)

        /* columns resolve left to right */
        .from(root + ' .col[data-col="1"] .h', { autoAlpha: 0, y: 30, filter: "blur(10px)", duration: 1.0, ease: "expo.out" }, 1.0)
        .from(root + ' .col[data-col="1"] .b', { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 1.18)
        .to(root + ' .vline[data-vline="1"]', { scaleY: 1, duration: 0.9, ease: "expo.out" }, 1.35)

        .from(root + ' .col[data-col="2"] .h', { autoAlpha: 0, y: 30, filter: "blur(10px)", duration: 1.0, ease: "expo.out" }, 1.45)
        .from(root + ' .col[data-col="2"] .b', { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 1.63)
        .to(root + ' .vline[data-vline="2"]', { scaleY: 1, duration: 0.9, ease: "expo.out" }, 1.8)

        .from(root + ' .col[data-col="3"] .h', { autoAlpha: 0, y: 30, filter: "blur(10px)", duration: 1.0, ease: "expo.out" }, 1.9)
        .from(root + ' .col[data-col="3"] .b', { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 2.08)

        .to(root + " .stage-glow", { scale: 1.05, transformOrigin: "50% 78%", duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.8)

        .set({}, {}, 8);

      window.__timelines["t1-overview-trio"] = tl;
    </script>
  </body>
</html>
