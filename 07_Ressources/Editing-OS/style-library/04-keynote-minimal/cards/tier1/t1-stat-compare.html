<!doctype html>
<!--
  KEYNOTE MINIMAL · tier1 · stat · COMPARE
  Full-screen takeover. True-black stage; a soft stage glow breathes low in
  frame; a dim, smaller former value draws a strike-through line beside a
  huge accent-colored current value, with a quiet kicker above and a claim
  below. The current value is the card's single accent element. Silk
  motion, no bounce.
  Slots: kicker, prev, stat, label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-compare {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-compare .stage-glow {
        position: absolute; inset: 0; background: var(--glow-accent); z-index: 1;
      }
      #t1-stat-compare .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #t1-stat-compare .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      #t1-stat-compare .kicker {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 26px;
      }

      #t1-stat-compare .compare-row {
        display: flex; align-items: center; gap: 34px;
      }

      #t1-stat-compare .prev-wrap {
        position: relative; display: inline-block;
      }
      #t1-stat-compare .prev {
        font-weight: var(--wt-semi); font-size: var(--size-title);
        letter-spacing: var(--track-snug); color: var(--text-faint);
      }
      #t1-stat-compare .strike {
        position: absolute; left: 0; right: 0; top: 50%; height: 2px;
        background: var(--text-faint); width: 0;
        transform-origin: 0% 50%;
      }

      #t1-stat-compare .arrow {
        font-weight: var(--wt-med); font-size: var(--size-title);
        color: var(--text-faint);
      }

      /* accent-colored hero number — background-clip:text; padding protects edges;
         NO will-change here (render gotcha) */
      #t1-stat-compare .stat {
        font-weight: var(--wt-black); font-size: var(--size-mega);
        line-height: 1.0; letter-spacing: var(--track-display);
        padding: 0 40px;
        background: var(--blue-metal-text);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      #t1-stat-compare .label {
        font-weight: var(--wt-semi); font-size: var(--size-headline);
        letter-spacing: var(--track-snug); color: var(--text);
        max-width: 1100px; line-height: 1.25;
        margin-top: 36px;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-compare" data-composition-id="t1-stat-compare" data-start="0" data-width="1920" data-height="1080">
      <div class="stage-glow"></div>

      <div class="center">
        <div class="kicker" data-slot="kicker">Time to launch a workflow</div>

        <div class="compare-row">
          <div class="prev-wrap">
            <div class="prev" data-slot="prev">12 hrs</div>
            <div class="strike"></div>
          </div>
          <div class="arrow">&rarr;</div>
          <div class="stat" data-slot="stat" data-count-to="90" data-count-suffix=" min">0 min</div>
        </div>

        <div class="label" data-slot="label">using the Acme agent template library instead of building from scratch</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t1-stat-compare";

      const statEl = document.querySelector(root + " .stat");
      const target = parseFloat(statEl.dataset.countTo || "90");
      const suffix = statEl.dataset.countSuffix || "";
      const counter = { v: 0 };

      tl.from(root + " .stage-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 55%", duration: 1.6, ease: "expo.out" }, 0)

        .from(root + " .kicker", { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 1.0, ease: "expo.out" }, 0.3)

        /* former value settles in, then gets struck through */
        .from(root + " .prev", { autoAlpha: 0, y: 18, filter: "blur(6px)", duration: 0.9, ease: "expo.out" }, 0.55)
        .to(root + " .strike", { width: "100%", duration: 0.7, ease: "power3.out" }, 1.15)

        .from(root + " .arrow", { autoAlpha: 0, x: -12, duration: 0.7, ease: "power2.out" }, 1.55)

        /* huge current value rises + resolves while it counts */
        .from(root + " .stat", { autoAlpha: 0, y: 34, filter: "blur(12px)", duration: 1.2, ease: "expo.out" }, 1.7)
        .to(counter, {
          v: target, duration: 1.6, ease: "power3.out",
          onUpdate: () => { statEl.textContent = Math.round(counter.v) + suffix; }
        }, 1.7)

        .from(root + " .label", { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 1.0, ease: "expo.out" }, 2.55)

        /* glow breathes — finite */
        .to(root + " .stage-glow", { scale: 1.05, transformOrigin: "50% 55%", duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-compare"] = tl;
    </script>
  </body>
</html>
