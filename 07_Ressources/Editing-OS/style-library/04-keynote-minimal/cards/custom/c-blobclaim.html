<!doctype html>
<!--
  KEYNOTE MINIMAL · custom · thesis · BLOBCLAIM
  Full-screen thesis takeover — the one colorful card. A blue+violet duo
  glow rises slowly behind a centered two-line claim at --size-display,
  drifting (scale 1 -> 1.08, sine.inOut, finite repeats) as the whole show
  of accent color. The claim itself resolves with blur and stays white/dim
  throughout — the glow alone carries the color budget. A tiny mono foot
  sits below.
  Slots: headline (richtext — <em> allowed, styled --wt-black white only),
  foot (text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #c-blobclaim {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #c-blobclaim .duo-glow {
        position: absolute; inset: 0; background: var(--glow-duo); z-index: 1;
      }
      #c-blobclaim .edge { position: absolute; inset: 0; background: var(--edge-falloff); z-index: 5; pointer-events: none; }

      #c-blobclaim .center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      #c-blobclaim .headline {
        font-weight: var(--wt-semi); font-size: var(--size-display);
        letter-spacing: var(--track-display); color: var(--text);
        line-height: 1.08; max-width: 1560px;
        padding: 0 20px;
      }
      /* keep the claim itself white/dim — the glow is the only color here */
      #c-blobclaim .headline em {
        font-style: normal; font-weight: var(--wt-black); color: var(--text);
      }

      #c-blobclaim .foot {
        margin-top: 46px;
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: var(--size-tiny); letter-spacing: 0.04em;
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="c-blobclaim" data-composition-id="c-blobclaim" data-start="0" data-width="1920" data-height="1080">
      <div class="duo-glow"></div>

      <div class="center">
        <div class="headline" data-slot="headline">Not your replacement.<br />Your <em>force multiplier</em>.</div>
        <div class="foot" data-slot="foot">Acme Certification · Automation Track</div>
      </div>

      <div class="edge"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#c-blobclaim";

      tl.from(root + " .duo-glow", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 55%", duration: 1.7, ease: "expo.out" }, 0)

        .from(root + " .headline", { autoAlpha: 0, y: 30, filter: "blur(12px)", duration: 1.3, ease: "expo.out" }, 0.7)

        .from(root + " .foot", { autoAlpha: 0, duration: 0.9, ease: "power2.inOut" }, 2.1)

        /* the glow drifts — the card's whole color budget, kept finite */
        .to(root + " .duo-glow", { scale: 1.08, transformOrigin: "50% 55%", duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        .set({}, {}, 8);

      window.__timelines["c-blobclaim"] = tl;
    </script>
  </body>
</html>
