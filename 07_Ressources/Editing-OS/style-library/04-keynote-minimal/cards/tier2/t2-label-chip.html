<!doctype html>
<!--
  KEYNOTE MINIMAL · tier2 · label · CHIP
  Compact top-left corner chip over talking-head video. Transparent stage;
  a small near-black hairline chip holds a tiny uppercase mono label and one
  bold value line. A hairline draws in first, then label and value resolve
  from a soft blur.
  Slots: label, value.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      /* transparent stage — tier2 overlays float over live footage */
      #t2-label-chip {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        font-family: var(--font-display); overflow: hidden;
      }

      #t2-label-chip .chip {
        position: absolute; top: 96px; left: 96px; max-width: 500px;
        background: rgba(0, 0, 0, 0.74);
        border: var(--rule);
        border-radius: var(--radius-sm);
        padding: 26px 34px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      }

      #t2-label-chip .hairline {
        width: 0; height: 1px; background: var(--hairline);
        margin-bottom: 16px;
      }

      #t2-label-chip .label {
        font-family: var(--font-mono); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 10px;
      }

      #t2-label-chip .value {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--text); line-height: 1.15;
      }
    </style>
  </head>
  <body>
    <div id="t2-label-chip" data-composition-id="t2-label-chip" data-start="0" data-width="1920" data-height="1080">
      <div class="chip">
        <div class="hairline"></div>
        <div class="label" data-slot="label">Now Streaming</div>
        <div class="value" data-slot="value">AI Agents 101</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-label-chip";

      tl.from(root + " .chip", { autoAlpha: 0, y: -14, duration: 0.8, ease: "expo.out" }, 0)
        .to(root + " .hairline", { width: 90, duration: 0.8, ease: "expo.out" }, 0.25)
        .from(root + " .label", { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.8, ease: "expo.out" }, 0.75)
        .from(root + " .value", { autoAlpha: 0, y: 14, filter: "blur(8px)", duration: 0.9, ease: "expo.out" }, 0.95)

        .set({}, {}, 6);

      window.__timelines["t2-label-chip"] = tl;
    </script>
  </body>
</html>
