<!doctype html>
<!--
  KEYNOTE MINIMAL · tier2 · definition · PLATE
  Floating bottom-center plate over talking-head video. Transparent stage; a
  near-black hairline plate holds a bold accent-colored term, a hairline
  that draws in beneath it, and a quiet one-line definition. The term
  resolves first, then the hairline draws, then the definition resolves.
  Slots: term, def.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      /* transparent stage — tier2 overlays float over live footage */
      #t2-def-plate {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        font-family: var(--font-display); overflow: hidden;
      }

      #t2-def-plate .plate {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        max-width: 1100px; text-align: center;
        background: rgba(0, 0, 0, 0.74);
        border: var(--rule);
        border-radius: var(--radius-sm);
        padding: 34px 56px;
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.4);
      }

      #t2-def-plate .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--accent);
      }

      #t2-def-plate .rule {
        width: 0; height: 1px; background: var(--hairline);
        margin: 18px auto;
      }

      #t2-def-plate .def {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-body); color: var(--text-dim);
        line-height: 1.3; max-width: 900px; margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="t2-def-plate" data-composition-id="t2-def-plate" data-start="0" data-width="1920" data-height="1080">
      <div class="plate">
        <div class="term" data-slot="term">Agentic Workflow</div>
        <div class="rule"></div>
        <div class="def" data-slot="def">A chained sequence of AI agent actions that completes a task without step-by-step human prompting.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = "#t2-def-plate";

      tl.from(root + " .plate", { autoAlpha: 0, duration: 0.9, ease: "expo.out" }, 0)
        .from(root + " .term", { autoAlpha: 0, y: 18, filter: "blur(10px)", duration: 1.0, ease: "expo.out" }, 0.2)
        .to(root + " .rule", { width: 120, duration: 0.9, ease: "expo.out" }, 1.1)
        .from(root + " .def", { autoAlpha: 0, y: 14, filter: "blur(8px)", duration: 0.9, ease: "expo.out" }, 1.35)

        .set({}, {}, 6);

      window.__timelines["t2-def-plate"] = tl;
    </script>
  </body>
</html>
